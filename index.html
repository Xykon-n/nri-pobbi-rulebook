каймура, сажа из печи, капля ночной росы.</li>\n<li><em>Варка:</em> сварить в темноте, ни разу не взглянув на огонь.</li>\n<li><em>Признаки:</em> зрачки расширяются на весь глаз.</li>\n<li><em>Действие:</em> на сутки видишь в темноте.</li>\n</ul>\n<p><strong>Нюх баргеста</strong> · Серебро · сл. 3</p>\n<ul>\n<li><em>Состав:</em> язык баргеста, полынь, соль.</li>\n<li><em>Варка:</em> язык засолить на три ночи, вынуть, истолочь с полынью.</li>\n<li><em>Признаки:</em> после приёма пахнет псиной, и собаки рычат на тебя.</li>\n<li><em>Действие:</em> на сутки «Следопыт» без требования и +1 кость к Выживанию по следу.</li>\n</ul>\n<p><strong>Нечувствие</strong> · Серебро · сл. 3</p>\n<ul>\n<li><em>Состав:</em> вытяжка из гнезда сюпсю (из занятого им трупа), свиной жир, пепел крапивы.</li>\n<li><em>Варка:</em> гнездо вываривать, сменив воду трижды; червя не трогать голыми руками. На жир положить отвар и пепел, мешать, пока не перестанешь чувствовать пальцы.</li>\n<li><em>Признаки:</em> кожа холодеет, как у мертвеца.</li>\n<li><em>Действие:</em> на сутки Калечащая рана не даёт штрафа части тела. Тело работает, как у трупа, которым правит сюпсю: не чувствуя боли.</li>\n</ul>\n<p><strong>Змеиная шкура</strong> · Серебро · сл. 3</p>\n<ul>\n<li><em>Состав:</em> яд гадюки, молоко козы, чеснок.</li>\n<li><em>Варка:</em> каплю яда — в кипящее молоко, по капле в день, девять дней.</li>\n<li><em>Действие:</em> на сутки яды не действуют.</li>\n</ul>\n<p><strong>Совиное сердце</strong> · Серебро · сл. 3</p>\n<ul>\n<li><em>Состав:</em> совиное сердце, кофейное зерно с южного рынка, красное вино.</li>\n<li><em>Варка:</em> сердце высушить на чердаке, где не бывает солнца, истолочь с зерном.</li>\n<li><em>Действие:</em> сутки без сна и без штрафов за бессонницу.</li>\n</ul>\n<p><strong>Голодная утроба</strong> · Серебро · сл. 3</p>\n<ul>\n<li><em>Состав:</em> мох с могильного камня, земля из-под порога, крепкий уксус.</li>\n<li><em>Варка:</em> настоять на уксусе в ночь новой Могилы, процедить через саван.</li>\n<li><em>Действие:</em> сутки без еды и воды без последствий.</li>\n</ul>\n<h5 id=\"яды-специализация-врачевание-яды\">Яды (специализация «Врачевание: яды»)</h5>\n<p><strong>Гнилая кровь</strong> · Бронза · сл. 2 · на клинок</p>\n<ul>\n<li><em>Состав:</em> кровь падали, ржавчина, болотная тина.</li>\n<li><em>Действие:</em> следующая рана этим клинком всегда даёт Кровотечение.</li>\n</ul>\n<p><strong>Чёрная желчь</strong> · Бронза · сл. 2 · в питьё</p>\n<ul>\n<li><em>Состав:</em> желчь больной скотины, полынь, вино.</li>\n<li><em>Действие:</em> последствие «на время»: жертва слегла на несколько дней.</li>\n</ul>\n<p><strong>Лицо тиньгоя</strong> · Бронза · сл. 2 · в дым или питьё</p>\n<ul>\n<li><em>Состав:</em> пыль, соскобленная с лица тиньгоя, болотный багульник, сухой мёд.</li>\n<li><em>Действие:</em> на сцену жертва верит первому, что услышит: +1 кость к Обману против неё. Тиньгой хитёр, и его хитрость передаётся тому, кто рядом с жертвой.</li>\n</ul>\n<p><strong>Сонная роса</strong> · Серебро · сл. 3 · на клинок</p>\n<ul>\n<li><em>Состав:</em> роса с цветков дрёма-корня, жир летучей мыши, пепел.</li>\n<li><em>Действие:</em> следующая рана этим клинком даёт Оглушение и −1 Выносливости за такт три такта.</li>\n</ul>\n<p><strong>Мёртвая вода</strong> · Серебро · сл. 3 · в питьё</p>\n<ul>\n<li><em>Состав:</em> вода, в которой обмывали тело, занятое сюпсю, соль с могилы.</li>\n<li><em>Действие:</em> смерть за сутки без Врачевания. Это медленная смерть: Удача работает.</li>\n</ul>\n<p><strong>Противоядие</strong> к любому яду — снадобье со сложностью, как у яда, и специализацией «яды».</p>\n<hr />\n<h4 id=\"стартовые-наборы-ремёсел\">Стартовые наборы ремёсел</h4>\n<p>Стартовое снаряжение выдаётся <strong>сверх достатка</strong>: его не покупают. Оружие — бронзовое.</p>\n<p><strong>У каждого:</strong> одежда по положению, огниво, бурдюк, еда на три дня, нож.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ремесло</th>\n<th>Оружие и броня</th>\n<th>Инструменты и прочее</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Наёмник</strong></td>\n<td>меч (с грамотой нанимателя) или боевой топор, или копьё; стёганка; щит</td>\n<td>грамота нанимателя, точильный камень</td>\n</tr>\n<tr>\n<td><strong>Солдат</strong></td>\n<td>копьё или алебарда; стёганка; простой шлем</td>\n<td>грамота полка, котелок</td>\n</tr>\n<tr>\n<td><strong>Охотник</strong></td>\n<td>лук и стрелы; кинжал</td>\n<td>капканы, верёвка, тёмный плащ</td>\n</tr>\n<tr>\n<td><strong>Моряк</strong></td>\n<td>кинжал; рабочий топор</td>\n<td>верёвка, кошка и крюки, просмолённый плащ</td>\n</tr>\n<tr>\n<td><strong>Стражник</strong></td>\n<td>алебарда или копьё; дубинка; стёганка; простой шлем</td>\n<td>грамота стражи, кандалы, фонарь</td>\n</tr>\n<tr>\n<td><strong>Вор</strong></td>\n<td>кинжал</td>\n<td>отмычки, верёвка с кошкой, тёмный плащ</td>\n</tr>\n<tr>\n<td><strong>Крысолов</strong></td>\n<td>крестьянский цеп или дубина</td>\n<td>капканы, мешок, одна склянка «Гнилой крови», если есть специализация «яды»</td>\n</tr>\n<tr>\n<td><strong>Могильщик</strong></td>\n<td>рабочий топор</td>\n<td>лопата, фонарь, мешок соли, саван</td>\n</tr>\n<tr>\n<td><strong>Лекарь</strong></td>\n<td>кинжал</td>\n<td>сумка лекаря, хирургический набор, два снадобья на выбор</td>\n</tr>\n<tr>\n<td><strong>Писарь</strong></td>\n<td>кинжал</td>\n<td>писчий набор, чистые грамоты, печать конторы</td>\n</tr>\n<tr>\n<td><strong>Торговец</strong></td>\n<td>кинжал</td>\n<td>весы и гири, мул, <strong>кошель бронзы</strong></td>\n</tr>\n<tr>\n<td><strong>Мастер</strong></td>\n<td>булава (кузнечный молот) или рабочий топор</td>\n<td>инструменты ремесла (походные), кожаный фартук</td>\n</tr>\n<tr>\n<td><strong>Священник</strong></td>\n<td>дубина (посох)</td>\n<td>святой символ, богословская книга, сумка лекаря</td>\n</tr>\n<tr>\n<td><strong>Мелкий элитарий</strong></td>\n<td>меч; кинжал; стёганка</td>\n<td>лошадь, хорошая одежда, печать рода</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"должник-хорошая-вещь\">«Должник»: хорошая вещь</h4>\n<p>Одна вещь на две ступени выше своего достатка:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Положение</th>\n<th>Уровень вещи</th>\n<th>Примеры</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Изгой, Отребье</td>\n<td>Бронза</td>\n<td>кинжал, стёганка, отмычки, лук</td>\n</tr>\n<tr>\n<td>Простой люд</td>\n<td>Серебро</td>\n<td>меч, арбалет, закрытый шлем, хирургический набор</td>\n</tr>\n<tr>\n<td>Почтенный</td>\n<td>Много серебра</td>\n<td>кольчуга, бронзовые латы, двуручный меч</td>\n</tr>\n<tr>\n<td>Элитарии</td>\n<td>Состояние</td>\n<td>стальные латы, латы из императорского серебра</td>\n</tr>\n</tbody>\n</table></div>\n<hr />\n<hr />\n"}]}, {"title": "Приложения", "chapters": [{"id": "приложение-а.-лист-персонажа-смертный", "title": "Приложение А. Лист персонажа «Смертный»", "html": "<p>Лист сверстан так, что служит одновременно записью персонажа и шпаргалкой по правилам. Все числа на нём совпадают с этой книгой.</p>\n<p><strong>Страница 1 — персонаж.</strong> Имя, раса и происхождение, ремесло, положение в обществе (пять ступеней с достатком и свободными тратами). Характеристики со шкалой ступеней и костей (Образцово d16 … Отвратно d4; у Удачи вместо кости — сожжения до Обречённо). Выносливость (7 + модификатор Телосложения) со шкалой до отрицательных значений и пометками о ценах действий; Воля и Давление. Список навыков по трём группам с колонками «уровень», «отметки», «специализация». Блок «Как расти» (отметки, бросок роста, уроки). Тела: Сердце, Разум, Дух.</p>\n<p><strong>Страница 2 — бой и вещи.</strong> Таблица оружия (пул, дистанция, база, атака, защита, теги) и брони (материал, лат, шлем, щит). Готовые пулы: Уклонение, Борьба, Чтение, Воля, «Стерпеть», Запугивание. Трек ран по частям тела, состояния (Сбит, Удержан, Обезоружен, Оглушён, Изнемог, Дрогнул, Кровотечение, Сильное кровотечение, Смертельная рана). Клейма, таланты, снаряжение, кошели.</p>\n<p><strong>Страница 3 — последствия боя (шпаргалка).</strong> Ярусы S и что они значат; кубы такта и Обмен; счёт раны (база оружия + тип × место − броня); броня по типам удара и щель лат; ступени ран; Удача в бою; теги ран; «стерпеть»; Давление и Воля; Борьба и земля.</p>\n<p><strong>Страница 4 — алхимия.</strong> Три ступени склянок и яды: кто варит, сложность, цена ингредиентов, длительность, цена для тела; правила посуды, провала и покупки. Полный список рецептов (снадобья, эликсиры, мутагены, яды) с составами — сокращённая версия главы 18.</p>\n<p><strong>Страница 5 — боевой помощник.</strong> Стойки (объявляются открыто монетой); клетки тайного выбора: пять костей — Интент, Линия, Кинетика, Тип, Ставка — поворачиваются нужной гранью и ставятся в клетки; порядок такта по шагам (стойки → кости → траты жетонов → вскрытие → ярус и кубы).</p>\n<hr />\n"}, {"id": "приложение-б.-карта-что-где-искать", "title": "Приложение Б. Карта: что где искать", "html": "<p>Быстрый указатель по темам. В скобках — раздел главы.</p>\n<h3 id=\"основа\">Основа</h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Тема</th>\n<th>Где</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Шкала ступеней и кости (d4–d16, d20)</td>\n<td><a href=\"#/2/0/глава-4.-характеристики\" class=\"xref\">Глава 4</a></td>\n</tr>\n<tr>\n<td>Бросок навыка, сложность, крит, крит-инверсия</td>\n<td><a href=\"#/2/1/глава-5.-ядро-броска\" class=\"xref\">Глава 5</a></td>\n</tr>\n<tr>\n<td>Специализация: сдвиг кости, расширенный крит</td>\n<td><a href=\"#/2/3/глава-7.-навыки\" class=\"xref\">Глава 7</a></td>\n</tr>\n<tr>\n<td>Удача: сжечь, покупки, Обречённо, Шутка Шута</td>\n<td><a href=\"#/2/2/глава-6.-удача\" class=\"xref\">Глава 6</a></td>\n</tr>\n<tr>\n<td>Запретное: пять особых правил</td>\n<td><a href=\"#/2/3/глава-7.-навыки\" class=\"xref\">Глава 7</a></td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"создание-персонажа\">Создание персонажа</h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Тема</th>\n<th>Где</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Порядок создания за 7 шагов</td>\n<td><a href=\"#/3/0/глава-8.-порядок-создания-персонажа\" class=\"xref\">Глава 8</a></td>\n</tr>\n<tr>\n<td>Происхождения людей, роды укотов</td>\n<td><a href=\"#/3/1/глава-9.-расы-и-происхождения\" class=\"xref\">Глава 9</a></td>\n</tr>\n<tr>\n<td>Ремёсла и положение в обществе</td>\n<td><a href=\"#/3/2/глава-10.-ремёсла-и-положение-в-обществе\" class=\"xref\">Глава 10</a></td>\n</tr>\n<tr>\n<td>Клейма</td>\n<td><a href=\"#/3/3/глава-11.-клейма\" class=\"xref\">Глава 11</a></td>\n</tr>\n<tr>\n<td>Таланты (все списки)</td>\n<td><a href=\"#/3/4/глава-12.-таланты\" class=\"xref\">Глава 12</a></td>\n</tr>\n<tr>\n<td>Запретные таланты</td>\n<td><a href=\"#/3/5/глава-13.-запретные-таланты\" class=\"xref\">Глава 13</a></td>\n</tr>\n<tr>\n<td>Отметки, бросок роста, уроки</td>\n<td><a href=\"#/3/6/глава-14.-опыт-и-рост\" class=\"xref\">Глава 14</a></td>\n</tr>\n<tr>\n<td>Примеры готовых персонажей</td>\n<td><a href=\"#/3/0/глава-8.-порядок-создания-персонажа\" class=\"xref\">Глава 8</a></td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"бой\">Бой</h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Тема</th>\n<th>Где</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Такт за минуту (шпаргалка)</td>\n<td><a href=\"#/4/0/глава-15.-бой\" class=\"xref\">Глава 15</a>, начало</td>\n</tr>\n<tr>\n<td>Такт, Интенты, матрица, ярусы S</td>\n<td><a href=\"#/4/0/глава-15.-бой\" class=\"xref\">Глава 15</a> (15.1)</td>\n</tr>\n<tr>\n<td>Кубы такта, Обмен, Контратака</td>\n<td><a href=\"#/4/0/глава-15.-бой\" class=\"xref\">Глава 15</a> (15.2)</td>\n</tr>\n<tr>\n<td>Ставка, чтение, жетоны, финты</td>\n<td><a href=\"#/4/0/глава-15.-бой\" class=\"xref\">Глава 15</a> (15.3)</td>\n</tr>\n<tr>\n<td>Дистанция, манёвры, толпа</td>\n<td><a href=\"#/4/0/глава-15.-бой\" class=\"xref\">Глава 15</a> (15.4)</td>\n</tr>\n<tr>\n<td>Оружие, стойки, щиты, теги оружия</td>\n<td><a href=\"#/4/0/глава-15.-бой\" class=\"xref\">Глава 15</a> (15.5)</td>\n</tr>\n<tr>\n<td>Раны, броня, теги ран, «стерпеть», Давление, Борьба</td>\n<td><a href=\"#/4/0/глава-15.-бой\" class=\"xref\">Глава 15</a> (15.6)</td>\n</tr>\n<tr>\n<td>Выстрел: три слоя, точка прицела</td>\n<td><a href=\"#/4/1/глава-16.-стрельба\" class=\"xref\">Глава 16</a> (ч. 1)</td>\n</tr>\n<tr>\n<td>Такт стрелка, перестрелка</td>\n<td><a href=\"#/4/1/глава-16.-стрельба\" class=\"xref\">Глава 16</a> (ч. 2)</td>\n</tr>\n<tr>\n<td>Укрытия, позиция</td>\n<td><a href=\"#/4/1/глава-16.-стрельба\" class=\"xref\">Глава 16</a> (ч. 3)</td>\n</tr>\n<tr>\n<td>Осечка, нагар, колчан</td>\n<td><a href=\"#/4/1/глава-16.-стрельба\" class=\"xref\">Глава 16</a> (ч. 5)</td>\n</tr>\n<tr>\n<td>Залп, подавление, граната</td>\n<td><a href=\"#/4/1/глава-16.-стрельба\" class=\"xref\">Глава 16</a> (ч. 6)</td>\n</tr>\n<tr>\n<td>Профили стрелкового оружия</td>\n<td><a href=\"#/4/1/глава-16.-стрельба\" class=\"xref\">Глава 16</a> (ч. 7)</td>\n</tr>\n<tr>\n<td>Твари: размер, природа, теги, карточки</td>\n<td><a href=\"#/4/2/глава-17.-твари\" class=\"xref\">Глава 17</a></td>\n</tr>\n</tbody>\n</table></div>\n<h3 id=\"мир-и-хозяйство\">Мир и хозяйство</h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Тема</th>\n<th>Где</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Деньги (Колёса), цены, достаток</td>\n<td><a href=\"#/5/0/глава-18.-снаряжение-и-алхимия\" class=\"xref\">Глава 18</a></td>\n</tr>\n<tr>\n<td>Алхимия: снадобья, эликсиры, мутагены, яды</td>\n<td><a href=\"#/5/0/глава-18.-снаряжение-и-алхимия\" class=\"xref\">Глава 18</a></td>\n</tr>\n<tr>\n<td>Стартовые наборы ремёсел</td>\n<td><a href=\"#/5/0/глава-18.-снаряжение-и-алхимия\" class=\"xref\">Глава 18</a></td>\n</tr>\n<tr>\n<td>Звери и твари мира</td>\n<td><a href=\"#/1/2/глава-3.-звери-твари-и-растения\" class=\"xref\">Глава 3</a></td>\n</tr>\n<tr>\n<td>Лист персонажа, устройство</td>\n<td><a href=\"#/6/0/приложение-а.-лист-персонажа-смертный\" class=\"xref\">Приложение А</a></td>\n</tr>\n</tbody>\n</table></div>\n<hr />\n"}, {"id": "приложение-г.-указатель-рабочих-документов-проекта", "title": "Приложение Г. Указатель рабочих документов проекта", "html": "<p>В эту книгу вошли главы и заготовки. Следующие материалы — рабочие документы разработки; в книгу они не вошли, но хранятся в папке проекта:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Документ</th>\n<th>Что это</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><code>SRM — Движок боя (восстановленный свод).md</code></td>\n<td>Свод механик боя SRM одним документом — первая реконструкция после утраты рулбука</td>\n</tr>\n<tr>\n<td><code>Диздок/SRM — дизайн-документ для симулятора.md</code></td>\n<td>Полный дизайн-документ SRM для симулятора: все шаги, числа, прогоны движка</td>\n</tr>\n<tr>\n<td><code>Диздок/Симулятор — постановка задачи для Claude Code.md</code></td>\n<td>Постановка задачи на программный симулятор боя</td>\n</tr>\n<tr>\n<td><code>Диздок/Дальний бой — бриф для нового чата.md</code></td>\n<td>Бриф и решения по дальнему бою (входная точка главы о стрельбе)</td>\n</tr>\n<tr>\n<td><code>Дальний бой — бриф для нового чата.md</code></td>\n<td>Та же работа, вторая копия из другого чата</td>\n</tr>\n<tr>\n<td><code>Дальний SRM/модель/</code></td>\n<td>Файлы модели симуляции дальнего боя</td>\n</tr>\n<tr>\n<td><code>Диздок/Генерация и прокачка — решения.md</code></td>\n<td>Решения блока «Генерация и прокачка» по шагам Г2–Г4 (их содержание вошло в главы 8–14)</td>\n</tr>\n<tr>\n<td><code>Диздок/Пути через Тела — заметки.md</code></td>\n<td>Заметки автора о Путях (вошли в главу 19)</td>\n</tr>\n<tr>\n<td><code>Диздок/Генерация — ревизия первых правил.md</code></td>\n<td>См. приложение В</td>\n</tr>\n<tr>\n<td>Файлы-указатели <code>Бой — Такт и матрица.md</code> и др.</td>\n<td>Семь коротких файлов-указателей: главы перенесены в «05 Бой» 31.10.2026</td>\n</tr>\n</tbody>\n</table></div>\n<p>Отдельно в проекте остались графический симулятор и симуляция дальнего боя (папки с программами) — из них и была восстановлена боевая система.</p>\n"}]}]};
const aside = document.querySelector('aside');
const nav = document.getElementById('nav');
const main = document.getElementById('main');
const hitsBox = document.getElementById('hits');
const flat = [];
DATA.parts.forEach((p, pi) => p.chapters.forEach((c, ci) => flat.push({pi, ci, part: p.title, ...c})));

function renderNav(filter){
  let html = '';
  DATA.parts.forEach((p, pi) => {
    const chs = p.chapters.map((c, ci) => ({c, ci})).filter(({c}) => !filter || c.title.toLowerCase().includes(filter));
    if (!chs.length) return;
    html += `<div class="part"><div class="pt">${esc(p.title)}</div>`;
    chs.forEach(({c, ci}) => {
      html += `<a class="cl" data-pi="${pi}" data-ci="${ci}" href="#/${pi}/${ci}">${esc(c.title)}</a>`;
    });
    html += `</div>`;
  });
  nav.innerHTML = html || '<p style="padding:6px 8px;color:var(--ink-2)">Ничего не найдено</p>';
}
function esc(s){return s.replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

function show(pi, ci, anchor){
  const c = DATA.parts[pi].chapters[ci];
  const idx = flat.findIndex(f => f.pi === pi && f.ci === ci);
  const prev = flat[idx-1], next = flat[idx+1];
  main.innerHTML = `
    <div class="crumb">${esc(DATA.parts[pi].title)} · глава ${ci+1} из ${DATA.parts[pi].chapters.length}</div>
    <article><h2>${esc(c.title)}</h2>${c.html}</article>
    <div class="pn">
      ${prev ? `<a href="#/${prev.pi}/${prev.ci}">← ${esc(prev.title)}</a>` : '<span></span>'}
      ${next ? `<a href="#/${next.pi}/${next.ci}">${esc(next.title)} →</a>` : '<span></span>'}
    </div>`;
  document.querySelectorAll('nav a.cl').forEach(a => a.classList.toggle('on', a.dataset.pi == pi && a.dataset.ci == ci));
  if (anchor) {
    const el = document.getElementById(anchor);
    if (el) { el.scrollIntoView(); el.style.background='oklch(0.88 0.08 80)'; setTimeout(()=>el.style.background='', 1600); return; }
  }
  window.scrollTo(0,0);
  aside.classList.remove('open');
}

function route(){
  const m = location.hash.match(/^#\/(\d+)\/(\d+)(?:\/(.+))?/);
  if (m) show(+m[1], +m[2], m[3] ? decodeURIComponent(m[3]) : null);
  else show(0, 0, null);
}

// полнотекстовый поиск
const q = document.getElementById('q');
let t;
q.addEventListener('input', () => {
  clearTimeout(t);
  t = setTimeout(() => {
    const s = q.value.trim().toLowerCase();
    renderNav(s.length >= 2 ? s : '');
    if (s.length < 3) { hitsBox.style.display='none'; hitsBox.innerHTML=''; return; }
    const hits = [];
    flat.forEach(f => {
      const text = f.html.replace(/<[^>]+>/g, ' ');
      let i = text.toLowerCase().indexOf(s);
      if (i >= 0) {
        const snip = text.slice(Math.max(0, i-60), i+s.length+80).replace(/\s+/g,' ').trim();
        hits.push({f, snip, s});
      }
    });
    hitsBox.innerHTML = hits.length
      ? `<div style="padding:2px 8px;color:var(--ink-2)">Найдено: ${hits.length}</div>` +
        hits.slice(0,12).map(({f, snip, s}) =>
          `<div class="h" data-pi="${f.pi}" data-ci="${f.ci}"><b>${esc(f.title)}</b><br><small>…${esc(snip)}…</small></div>`).join('')
      : '<div style="padding:2px 8px;color:var(--ink-2)">Не найдено</div>';
    hitsBox.style.display = 'block';
  }, 200);
});
hitsBox.addEventListener('click', e => {
  const h = e.target.closest('.h');
  if (h) { location.hash = `#/${h.dataset.pi}/${h.dataset.ci}`; }
});
nav.addEventListener('click', e => {
  const a = e.target.closest('a.cl');
  if (a) { e.preventDefault(); location.hash = `#/${a.dataset.pi}/${a.dataset.ci}`; }
});
document.getElementById('burger').addEventListener('click', () => aside.classList.toggle('open'));
window.addEventListener('hashchange', route);
renderNav('');
route();
</script>
</body>
</html>
