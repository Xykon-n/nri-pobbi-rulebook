ет до 0 (Изнемог), сразу возвращаешь 3</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"скрытность\">Скрытность</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Требует</th>\n<th>Как работает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Тень</strong></td>\n<td>Скрытность 1 (новичок)</td>\n<td>Группа крадётся, ты прошёл бросок — один провалившийся рядом с тобой тоже считается прошедшим: ты ведёшь его за собой</td>\n</tr>\n<tr>\n<td><strong>Лицо из толпы</strong></td>\n<td>Скрытность 2 (подмастерье)</td>\n<td>Без броска: в городской толпе тебя не опознают и не запоминают, пока ты не делаешь ничего заметного</td>\n</tr>\n<tr>\n<td><strong>Замереть</strong></td>\n<td>Скрытность 2 (подмастерье)</td>\n<td>Когда тебя ищут, а ты не двигаешься, ищущему нужно перебросить тебя на 2+ успеха. Ничья и перевес в 1 успех — в твою пользу</td>\n</tr>\n<tr>\n<td><strong>Удар из тени</strong></td>\n<td>Скрытность 3 (профессионал)</td>\n<td>Первый удар по противнику, который тебя не заметил, — сразу Пробой: без выбора, без кинетики и без броска такта</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"плутовство\">Плутовство</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Требует</th>\n<th>Как работает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Срезать кошель</strong></td>\n<td>Плутовство 1 (новичок)</td>\n<td>Без броска: в толпе срезаешь кошель или снимаешь мелочь с пояса, если жертва не настороже</td>\n</tr>\n<tr>\n<td><strong>Ловкие пальцы</strong></td>\n<td>Плутовство 1 (новичок)</td>\n<td>Без броска: простые и обычные замки (сложность 1–2) открываешь сам, если есть время и инструмент</td>\n</tr>\n<tr>\n<td><strong>Подмена</strong></td>\n<td>Плутовство 2 (подмастерье)</td>\n<td>Подменяешь вещь на виду (кольцо, ключ, письмо). Встречный бросок: твоё Плутовство против Бдительности смотрящего, ничья — твоя</td>\n</tr>\n<tr>\n<td><strong>Глаз на ловушки</strong></td>\n<td>Плутовство 2 (подмастерье)</td>\n<td>Без броска: если идёшь первым и не торопишься, ГМ говорит, что впереди ловушка. Где именно и какая — не говорит</td>\n</tr>\n<tr>\n<td><strong>Шулер</strong></td>\n<td>Плутовство 2 (подмастерье)</td>\n<td>Без броска: мелкую азартную игру выигрываешь, если никто не ищет обмана. Против того, кто ищет: встречный бросок, твоё Плутовство против его Проницательности</td>\n</tr>\n<tr>\n<td><strong>Скупщик</strong></td>\n<td>Плутовство 2 (подмастерье)</td>\n<td>Без броска: в любом городе с воровским кварталом знаешь, кому сбыть краденое и за сколько</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"выживание\">Выживание</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Требует</th>\n<th>Как работает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Следопыт</strong></td>\n<td>Выживание 1 (новичок)</td>\n<td>Без броска: по свежим следам ГМ говорит, сколько их было и как давно они прошли</td>\n</tr>\n<tr>\n<td><strong>Чуять зверя</strong></td>\n<td>Выживание 2 (подмастерье)</td>\n<td>+1 кость к Бдительности против зверей (не тварей): засаду волков ты почуешь раньше</td>\n</tr>\n<tr>\n<td><strong>Ночлег</strong></td>\n<td>Выживание 2 (подмастерье)</td>\n<td>Без броска: группа под твоим руководством находит укрытие и ночует без последствий непогоды, если местность не враждебна</td>\n</tr>\n<tr>\n<td><strong>Добытчик</strong></td>\n<td>Выживание 3 (профессионал)</td>\n<td>Без броска: в обычной местности охотой и собирательством кормишь себя и ещё двоих</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"ремесло-1\">Ремесло</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Требует</th>\n<th>Как работает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Полевой ремонт</strong></td>\n<td>Ремесло 1 (новичок)</td>\n<td>Без броска: за короткий отдых чинишь повреждённое в бою снаряжение — выпрямляешь погнутый бронзовый клинок, меняешь ремни щита</td>\n</tr>\n<tr>\n<td><strong>Глаз мастера</strong></td>\n<td>Ремесло 2 (подмастерье)</td>\n<td>Без броска: глядя на вещь, знаешь её настоящую цену, материал (бронза, серебро, сталь, императорское серебро) и изъян, если он есть</td>\n</tr>\n<tr>\n<td><strong>Засека</strong></td>\n<td>Ремесло 2 (подмастерье)</td>\n<td>За сцену подготовки ставишь на месте будущего боя одну метку позиции: Теснота (завал, рогатки) или Опора (разлитое масло, скользкие доски)</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"врачевание-1\">Врачевание</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Требует</th>\n<th>Как работает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Перевязка</strong></td>\n<td>Врачевание 1 (новичок)</td>\n<td>Без броска: останавливаешь обычное Кровотечение. Сильное — бросок, как обычно</td>\n</tr>\n<tr>\n<td><strong>Обезболить</strong></td>\n<td>Врачевание 2 (подмастерье)</td>\n<td>Твой отвар снимает штраф непролеченной Тяжёлой раны в начале следующего боя (обычно +3 Давления). Рана остаётся</td>\n</tr>\n<tr>\n<td><strong>Склянки</strong></td>\n<td>Врачевание 2 (подмастерье)</td>\n<td>Ты умеешь готовить эликсиры и мутагены по рецептам: это алхимия смертных. Сильные склянки оставляют отметку на треке Тела Сердца у того, кто их выпил. Рецепты — в <a href=\"#/5/0/глава-18.-снаряжение-и-алхимия\" class=\"xref\">главе 18</a></td>\n</tr>\n<tr>\n<td><strong>Не дать умереть</strong></td>\n<td>Врачевание 3 (профессионал)</td>\n<td>Без броска: пока раненый под твоим уходом, Сильное кровотечение и Рана в живот его не убивают. Рана остаётся, а вылечить её — уже другой бросок</td>\n</tr>\n</tbody>\n</table></div>\n<hr />\n<h3 id=\"слово-и-люди\">Слово и люди</h3>\n<h4 id=\"убеждение\">Убеждение</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Требует</th>\n<th>Как работает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Торгаш</strong></td>\n<td>Убеждение 1 (новичок)</td>\n<td>Без броска: покупаешь и продаёшь по честной цене. Тебя не обманут на торге, если продавец тебе не враг</td>\n</tr>\n<tr>\n<td><strong>Обаяние</strong></td>\n<td>Убеждение 2 (подмастерье)</td>\n<td>Без броска: незнакомец, к которому ты обратился первым, выслушает тебя до конца: не прогонит и не позовёт стражу сразу</td>\n</tr>\n<tr>\n<td><strong>Голос площади</strong></td>\n<td>Убеждение 3 (профессионал)</td>\n<td>Толпу убеждаешь так же, как одного человека, без надбавки сложности за толпу</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"запугивание\">Запугивание</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Требует</th>\n<th>Как работает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Страшный крик</strong></td>\n<td>Запугивание 2 (подмастерье)</td>\n<td>Раз за бой Запугивание идёт вместе с твоим действием, а не вместо удара: ты ревёшь, нанося удар</td>\n</tr>\n<tr>\n<td><strong>Допросчик</strong></td>\n<td>Запугивание 2 (подмастерье)</td>\n<td>Без броска: пленник, которому ты нанёс Калечащую рану или на глазах которого убили его товарища, честно отвечает на один вопрос</td>\n</tr>\n<tr>\n<td><strong>Слава мясника</strong></td>\n<td>Запугивание 3 (профессионал)</td>\n<td>Без броска: враги, слышавшие о тебе, начинают бой с +2 Давления. <strong>Цена:</strong> твоё имя знают, и ты от этого уже не отмоешься.</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"обман\">Обман</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Требует</th>\n<th>Как работает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Невинный взгляд</strong></td>\n<td>Обман 1 (новичок)</td>\n<td>Когда тебя ловят на лжи (встречный бросок против Проницательности), ничья — твоя</td>\n</tr>\n<tr>\n<td><strong>Чужое лицо</strong></td>\n<td>Обман 2 (подмастерье)</td>\n<td>Без броска: переодевшись человеком своего сословия, проходишь незамеченным, пока не заговоришь с тем, кто знает оригинал</td>\n</tr>\n<tr>\n<td><strong>Подделка</strong></td>\n<td>Обман 2 (подмастерье)</td>\n<td>Без броска: твоя поддельная грамота проходит проверку стражи. Против писаря или учёного — встречный бросок: твой Обман против его Сыска</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"проницательность-1\">Проницательность</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Требует</th>\n<th>Как работает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Чую страх</strong></td>\n<td>Проницательность 1 (новичок)</td>\n<td>Без броска: ГМ говорит, боится ли собеседник, и тебя ли он боится</td>\n</tr>\n<tr>\n<td><strong>Слышу ложь</strong></td>\n<td>Проницательность 2 (подмастерье)</td>\n<td>Когда тебе лгут (встречный бросок против Обмана), ничья — твоя. Против «Невинного взгляда» оба таланта гасятся</td>\n</tr>\n<tr>\n<td><strong>Слабое место</strong></td>\n<td>Проницательность 3 (профессионал)</td>\n<td>После разговора ГМ называет одну вещь, которой человек дорожит или которой боится. Убеждение и Запугивание через неё — +1 кость</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"обычаи-1\">Обычаи</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Требует</th>\n<th>Как работает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Свой в слое</strong></td>\n<td>Обычаи 1 (новичок)</td>\n<td>Без броска: в выбранном слое (двор, улица, церковь, армия, укоты) знаешь, кто здесь главный и как к нему попасть</td>\n</tr>\n<tr>\n<td><strong>Этикет</strong></td>\n<td>Обычаи 2 (подмастерье)</td>\n<td>Без броска: в чужом слое не делаешь ошибок. Тебя не выгонят за невежество и не оскорбятся на манеры</td>\n</tr>\n<tr>\n<td><strong>Знакомцы</strong></td>\n<td>Обычаи 2 (подмастерье)</td>\n<td>Без броска: в каждом большом городе у тебя есть знакомый в выбранном слое. Он даст ночлег или слух. ГМ и ты придумываете его вместе</td>\n</tr>\n<tr>\n<td><strong>Слухи</strong></td>\n<td>Обычаи 3 (профессионал)</td>\n<td>Без броска: за вечер в кабаке узнаёшь три главных слуха места. Один из них ложный, и ты не знаешь какой</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"лидерство\">Лидерство</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Требует</th>\n<th>Как работает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Знамя</strong></td>\n<td>Лидерство 1 (новичок)</td>\n<td>Без броска: пока ты на ногах, союзники рядом получают за павшего на их глазах товарища +1 Давления, а не +3</td>\n</tr>\n<tr>\n<td><strong>Голос в бою</strong></td>\n<td>Лидерство 2 (подмастерье)</td>\n<td>Одалживаешь пул Лидерства на проверку Воли двум союзникам за такт, а не одному</td>\n</tr>\n<tr>\n<td><strong>Железная дисциплина</strong></td>\n<td>Лидерство 3 (профессионал)</td>\n<td>Союзник, которому ты одолжил пул, при недоборе 2 в проверке Воли не бежит, а только Дрогнул</td>\n</tr>\n<tr>\n<td><strong>Собрать отряд</strong></td>\n<td>Лидерство 2 (подмастерье)</td>\n<td>Наёмники и ополченцы идут за тобой. Правила отряда — в блоке групповых механик</td>\n</tr>\n</tbody>\n</table></div>\n<hr />\n<h3 id=\"ум-и-знание\">Ум и знание</h3>\n<p>Запретные таланты — отдельным семейством (Г15.4).</p>\n<h4 id=\"бдительность-1\">Бдительность</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Требует</th>\n<th>Как работает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Сон вполглаза</strong></td>\n<td>Бдительность 1 (новичок)</td>\n<td>Без броска: тебя не застать спящим. Если ты на часах, врасплох не застать и группу</td>\n</tr>\n<tr>\n<td><strong>Шестое чувство</strong></td>\n<td>Бдительность 2 (подмастерье)</td>\n<td>Без броска: «Удар из тени» и первый удар засады по тебе — не Пробой без броска, а обычный такт: ты успеваешь закрыться. Удар всё равно идёт первым</td>\n</tr>\n<tr>\n<td><strong>Чуять засаду</strong></td>\n<td>Бдительность 3 (профессионал)</td>\n<td>Без броска: входя в место засады, ты знаешь, что она есть. Где именно и сколько — не знаешь</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"сыск-1\">Сыск</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Требует</th>\n<th>Как работает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Цепкий глаз</strong></td>\n<td>Сыск 1 (новичок)</td>\n<td>Без броска: обыскивая место не торопясь, находишь всё, что спрятано небрежно (тайник сложности 1–2)</td>\n</tr>\n<tr>\n<td><strong>Архивная крыса</strong></td>\n<td>Сыск 2 (подмастерье)</td>\n<td>Без броска: в архиве, канцелярии, приходской книге находишь нужную запись, если она там есть</td>\n</tr>\n<tr>\n<td><strong>Свидетели</strong></td>\n<td>Сыск 2 (подмастерье)</td>\n<td>Без броска: среди опрошенных ГМ называет того, кто видел больше всех. Скажет ли он правду — другое дело</td>\n</tr>\n<tr>\n<td><strong>Сложить картину</strong></td>\n<td>Сыск 3 (профессионал)</td>\n<td>Раз за расследование задаёшь ГМу вопрос, связаны ли две улики или два человека, и ГМ отвечает правду</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"учёность\">Учёность</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Требует</th>\n<th>Как работает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Полиглот</strong></td>\n<td>Учёность 1 (новичок)</td>\n<td>Без броска: один живой язык Континента за каждую ступень Учёности</td>\n</tr>\n<tr>\n<td><strong>Книжное знание</strong></td>\n<td>Учёность 2 (подмастерье)</td>\n<td>Вместо Запретного можешь бросить Учёность, чтобы узнать, что о твари, Аркане или ритуале <strong>пишут книги и церковь</strong>. Отметки на Теле Разума нет. Но это всегда то, во что верит мир: правду не откроют даже лишние успехи и крит</td>\n</tr>\n<tr>\n<td><strong>Знаток права</strong></td>\n<td>Учёность 2 (подмастерье)</td>\n<td>Без броска: знаешь, что грозит за любое преступление в любой земле Триархии. В суде и перед стражей +1 кость к Убеждению, если споришь законом</td>\n</tr>\n<tr>\n<td><strong>Теория алхимии</strong></td>\n<td>Учёность 3 (профессионал), специализация «алхимия»</td>\n<td>«Склянки» можешь делать от Учёности вместо Врачевания: ты знаешь рецепты по книгам, а не по руке</td>\n</tr>\n</tbody>\n</table></div>\n<hr />\n<hr />\n"}, {"id": "глава-13.-запретные-таланты", "title": "Глава 13. Запретные таланты", "html": "<hr />\n<h4 id=\"правила-семейства\">Правила семейства</h4>\n<ul>\n<li><strong>Требование</strong> — уровень Запретного.</li>\n<li><strong>Это знание, а не магия.</strong> Смертный не колдует: он знает, как устроено колдовство, и умеет с этим жить.</li>\n<li><strong>Действуют правила Запретного:</strong> бросок на сложности 3+ оставляет отметку на треке Тела Разума; мир лжёт; узнать — значит быть узнанным. Если талант снимает одно из правил, это указано прямо.</li>\n<li><strong>Безопасная сторона знания</strong> — талант Учёности «Книжное знание»: версия мира без отметки. Запретные таланты дают правду и стоят рассудка.</li>\n</ul>\n<h4 id=\"ступень-1-новичок\">Ступень 1 (новичок)</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Как работает</th>\n<th>Цена</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Чужой след</strong></td>\n<td>Запретное вместо Сыска, если есть следы магии; +1 кость</td>\n<td>Обычная цена Запретного</td>\n</tr>\n<tr>\n<td><strong>Мёртвые языки</strong></td>\n<td>Без броска: один мёртвый язык за каждую ступень Запретного — надписи, старые книги, немёртвые старых эпох</td>\n<td>—</td>\n</tr>\n<tr>\n<td><strong>Дурной знак</strong></td>\n<td>Без броска: там, где побывали магия, Фаза или нежить, ГМ говорит, что здесь что-то не так. Что именно — не говорит</td>\n<td>—</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"ступень-2-подмастерье\">Ступень 2 (подмастерье)</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Как работает</th>\n<th>Цена</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Оберег</strong></td>\n<td>Защита от враждебной магии, направленной на тебя: встречный бросок, пул творящего против твоего Запретного, ничья — твоя. Держится с момента постановки</td>\n<td>Поставить — Запретное, сложность 3 (отметка). Один оберег за раз; проиграл встречный бросок — оберег сломан</td>\n</tr>\n<tr>\n<td><strong>Читать чары</strong></td>\n<td>Против колдующего колдуна, мага или немёртвого пул чтения — Личность × Запретное. По заклинанию или его следу называешь его аспекты</td>\n<td>Мир лжёт: аспект Аркана ГМ может назвать неверно</td>\n</tr>\n<tr>\n<td><strong>Цена вперёд</strong></td>\n<td>Прежде чем коснуться чужого ритуала, артефакта или сделки, узнаёшь их цену. О цене мир не лжёт</td>\n<td>Узнал цену — тебя заметили</td>\n</tr>\n<tr>\n<td><strong>Тайнопись</strong></td>\n<td>Читаешь шифры и знаки культов и сект; Обычаи с культистами бросаешь от Запретного</td>\n<td>—</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"ступень-3-профессионал\">Ступень 3 (профессионал)</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Как работает</th>\n<th>Цена</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Видевший худшее</strong></td>\n<td>Без броска: первый Ужас за сцену, от чего угодно, не оставляет отметку</td>\n<td>—</td>\n</tr>\n<tr>\n<td><strong>Чуять Фазу</strong></td>\n<td>ГМ предупреждает за миг до того, как откроется Фазовая прореха; +1 кость, когда бежишь или прячешься от Фазовых Странников</td>\n<td>—</td>\n</tr>\n<tr>\n<td><strong>Знать слабость</strong></td>\n<td>Изучаешь тварь броском Запретного: узнаёшь одну слабость. До конца сцены +1 кость в бросках такта против неё</td>\n<td>Обычная цена Запретного; мир лжёт</td>\n</tr>\n<tr>\n<td><strong>Тихое знание</strong></td>\n<td>«Узнать — значит быть узнанным» на тебя не действует, если ты потратил сцену на заметание следов</td>\n<td>Сцена времени</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"ступень-4-мастер\">Ступень 4 (мастер)</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Как работает</th>\n<th>Цена</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Привычка к Бездне</strong></td>\n<td>Твоё собственное Запретное оставляет отметку со сложности 4, а не 3</td>\n<td>Цену снижает талант, а не Удача</td>\n</tr>\n<tr>\n<td><strong>Сломать обряд</strong></td>\n<td>Встречный бросок Запретного против пула творящего: при победе чужой ритуал или заклинание в процессе срывается</td>\n<td>Отметка всегда, даже при победе</td>\n</tr>\n<tr>\n<td><strong>Тронутые</strong></td>\n<td>Узнаёшь тронутых Арканом или Фазой по виду, голосу, повадкам</td>\n<td>Мир лжёт: иногда это просто безумец</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"ступень-5-легенда\">Ступень 5 (легенда)</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Как работает</th>\n<th>Цена</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Истина</strong></td>\n<td>Раз за арку задаёшь ГМу один вопрос о мире. Бросок Запретного, сложность 4: успех — ГМ отвечает правду (единственное исключение из «мир лжёт»); провал — ГМ отвечает, но ответу нельзя верить</td>\n<td>Отметка всегда; то, о чём спросил, узнаёт тебя</td>\n</tr>\n<tr>\n<td><strong>Порог</strong></td>\n<td>Стать колдуном через знание, без контракта</td>\n<td>—</td>\n</tr>\n</tbody>\n</table></div>\n<hr />\n<hr />\n"}, {"id": "глава-14.-опыт-и-рост", "title": "Глава 14. Опыт и рост", "html": "<hr />\n<h4 id=\"что-как-растёт\">Что как растёт</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Что</th>\n<th>Как растёт</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Навыки</td>\n<td>Делом: отметки и бросок роста в конце сессии</td>\n</tr>\n<tr>\n<td>Таланты, специализации</td>\n<td>За уроки</td>\n</tr>\n<tr>\n<td>Телосложение, Личность</td>\n<td>Только событием и временем (см. <a href=\"#/3/6/глава-14.-опыт-и-рост\" class=\"xref\">главу 14</a>)</td>\n</tr>\n<tr>\n<td>Запретное выше 2</td>\n<td>Только событием; отметки его выше 2 не поднимают</td>\n</tr>\n<tr>\n<td>Удача</td>\n<td>Только Шуткой Шута</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"отметки\">Отметки</h4>\n<p>Когда в сцене со ставками ты <strong>проваливаешь</strong> бросок навыка или <strong>критуешь</strong> — ставь отметку у этого навыка. Не больше одной отметки на навык за сессию.</p>\n<h4 id=\"бросок-роста\">Бросок роста</h4>\n<p>В конце сессии (это и есть передышка) за каждый навык с отметкой бросаешь <strong>4 кости обычной характеристики этого навыка</strong> (Фехтование — Телосложение, Учёность — Личность).</p>\n<ul>\n<li><strong>Сложность = текущий уровень навыка.</strong> С 0 до 1 навык растёт сам.</li>\n<li><strong>Успех</strong> — навык растёт на ступень. <strong>Провал</strong> — нет.</li>\n<li>Отметка стирается в любом случае.</li>\n</ul>\n<p><strong>Совет ГМу — ручка темпа:</strong> сложность −1 для быстрой кампании, +1 для медленной.</p>\n<h4 id=\"уроки\">Уроки</h4>\n<p><strong>Урок</strong> — общее очко опыта. Приходит:</p>\n<ul>\n<li>1 за каждую пережитую сессию;</li>\n<li>1 за каждое пережитое: Калечащая рана, сожжённая Удача, принятая Шутка Шута, конец арки.</li>\n</ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Покупка</th>\n<th>Цена в уроках</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Талант</td>\n<td>ступень требования + 1 (от 2 до 6)</td>\n</tr>\n<tr>\n<td>Улучшение таланта</td>\n<td>так же, по своей ступени</td>\n</tr>\n<tr>\n<td>Специализация</td>\n<td>3</td>\n</tr>\n</tbody>\n</table></div>\n<hr />\n<hr />\n"}]}, {"title": "Часть IV. Бой", "chapters": [{"id": "глава-15.-бой", "title": "Глава 15. Бой", "html": "<p>Бой в «Континенте» — короткий и страшный. Его решают выбор, мастерство и снаряжение, а не долгий обмен ударами. Удачный выбор не прощает ошибки, а мастер почти всегда переигрывает новичка.</p>\n<h3 id=\"такт-за-минуту\">Такт за минуту</h3>\n<ol>\n<li><strong>Стойки.</strong> Оба открыто объявляют Стойку. Обладатель Инициативы объявляет вторым.</li>\n<li><strong>Тайный выбор.</strong> Каждый выбирает Интент — Удар, Заслон или Манёвр — и его дескрипторы: линию, кинетику, тип. Можно сделать Ставку. Вместо Интента можно взять дело: зажать рану, достать склянку, поджечь фитиль.</li>\n<li><strong>Вскрытие.</strong> Обе стороны открывают выбор одновременно.</li>\n<li><strong>Ярус.</strong> Слои линии, кинетики и типа плюс поправки дают S. По S получается ярус: Пробой, Попадание, Сцепка, Отбито или Брешь. Если оба ударили, это Обмен.</li>\n<li><strong>Кубы.</strong> Кубы сдвигают ярус: исполнение решает, насколько чисто вышло задуманное.</li>\n<li><strong>Последствия.</strong> Раны и теги, Борьба после Сцепки, контратака после Бреши.</li>\n<li><strong>Конец такта.</strong> Сделанные дела, Выносливость и кровотечение, затем проверка Воли.</li>\n</ol>\n<p>Подробно — в разделе 15.1.</p>\n<hr />\n<h3 id=\"такт-и-матрица\">15.1 Такт и матрица</h3>\n<hr />\n<h5 id=\"что-такое-srm\">Что такое SRM</h5>\n<p>Ближний бой решается одновременно. Каждый боец тайно выбирает, что делает, потом все выборы вскрываются разом, и исход читается по таблицам. Хитов нет: бой кончается тем, что накопилось — раны, усталость, страх, положение.</p>\n<p><strong>Попадание решает выбор, кубы решают исполнение.</strong> Выбор даёт ярус исхода. Кубы только сдвигают уже полученный ярус (см. «15.2 Кубы в бою»).</p>\n<h5 id=\"такт\">Такт</h5>\n<p>Такт — один цикл «выбор → вскрытие → разрешение», 2–3 секунды боя. Слово «раунд» оставлено для сцены.</p>\n<p><strong>Порядок такта:</strong></p>\n<ol>\n<li><strong>Открытое объявление.</strong> Каждый показывает <strong>Стойку</strong> (как держит оружие, на кого смотрит) и цель. Обладатель Инициативы объявляет вторым.</li>\n<li><strong>Тайный выбор:</strong> Интент и дескрипторы. Атакующий в Верх тайно отмечает и цель: голову или руки. Здесь же можно сделать <strong>Ставку</strong> (см. «15.3 Чтение противника»). Вместо Интента можно тайно выбрать <strong>полное дело</strong>, а к Заслону или Манёвру приписать <strong>быстрое</strong> (см. «Дело в бою»).</li>\n<li><strong>Траты жетонов</strong> — только у читающих (см. «15.3 Чтение противника»). Обладатель Инициативы тратит вторым.</li>\n<li><strong>Вскрытие</strong> всех выборов разом.</li>\n<li><strong>Сумма S</strong> по слоям и <strong>ярус исхода</strong>.</li>\n<li><strong>Бросок такта</strong>, если есть что сдвигать (см. «15.2 Кубы в бою»).</li>\n<li><strong>Последствия:</strong> раны, теги, «стерпеть», Выносливость, Давление (см. «15.6 Последствия»).</li>\n<li><strong>Конец такта:</strong> сделанные дела, Инициатива, Ответ и Выдержка, жетоны, проверка Воли, Изнеможение, кровотечение, дистанция.</li>\n</ol>\n<h5 id=\"интент-и-дескрипторы\">Интент и дескрипторы</h5>\n<p><strong>Интент</strong> — что боец делает в этот такт. Каждый Интент собирается из дескрипторов.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Интент</th>\n<th>Дескрипторы</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Удар</strong></td>\n<td>Линия + Кинетика + Тип атаки</td>\n</tr>\n<tr>\n<td><strong>Заслон</strong></td>\n<td>Линия + Кинетика + Тип защиты</td>\n</tr>\n<tr>\n<td><strong>Манёвр</strong></td>\n<td>Направление (Сблизиться, Отойти, Обойти, Выстроить) + Кинетика; см. «15.4 Дистанция и позиция»</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Меню</strong> — дескрипторы, доступные бойцу в этот такт: что позволяет оружие, дистанция и состояние (раны, теги, Сбит и так далее).</p>\n<h5 id=\"сумма-s-и-три-слоя\">Сумма S и три слоя</h5>\n<p>Удар против Заслона сравнивается по трём <strong>слоям</strong>. Каждый слой даёт атакующему +1 (выиграл), 0 или −1 (проиграл). Сумма слоёв и поправок — <strong>S</strong>.</p>\n<p><strong>Слой линии: «Перекос к защите».</strong> Высокая защита закрывает голову и корпус, центральная — корпус и ноги, низкая — только ноги.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Атака \\ Защита</th>\n<th>Верх</th>\n<th>Центр</th>\n<th>Низ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Верх</td>\n<td>−1</td>\n<td><strong>+1</strong></td>\n<td>0</td>\n</tr>\n<tr>\n<td>Центр</td>\n<td>−1</td>\n<td>−1</td>\n<td><strong>+1</strong></td>\n</tr>\n<tr>\n<td>Низ</td>\n<td><strong>+1</strong></td>\n<td>−1</td>\n<td>−1</td>\n</tr>\n</tbody>\n</table></div>\n<p>Линия атаки задаёт место раны: Верх — голова или руки, Центр — корпус, Низ — ноги.</p>\n<p><strong>Слой кинетики</strong> — как исполняется действие. Цикл: <strong>Рывок бьёт Тяжёлый, Тяжёлый бьёт Ровный, Ровный бьёт Рывок.</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Кинетика</th>\n<th>Что это</th>\n<th>Бьёт</th>\n<th>Проигрывает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Рывок</td>\n<td>быстро и коротко</td>\n<td>Тяжёлый: обгоняет медленный замах</td>\n<td>Ровный: бросок читается и встречается</td>\n</tr>\n<tr>\n<td>Ровный</td>\n<td>контролируемый темп</td>\n<td>Рывок</td>\n<td>Тяжёлый: напор ломает защиту</td>\n</tr>\n<tr>\n<td>Тяжёлый</td>\n<td>вложенное действие с инерцией</td>\n<td>Ровный</td>\n<td>Рывок</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Слой типов.</strong> Каждый тип атаки сильнее одной защиты и слабее другой.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Атака \\ Защита</th>\n<th>Парирование</th>\n<th>Щит</th>\n<th>Уклонение</th>\n<th>Встречный</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Рубящий</td>\n<td><strong>−1</strong></td>\n<td>0</td>\n<td><strong>+1</strong></td>\n<td>0</td>\n</tr>\n<tr>\n<td>Колющий</td>\n<td>0</td>\n<td><strong>−1</strong></td>\n<td>0</td>\n<td><strong>+1</strong></td>\n</tr>\n<tr>\n<td>Дробящий</td>\n<td><strong>+1</strong></td>\n<td>0</td>\n<td><strong>−1</strong></td>\n<td>0</td>\n</tr>\n<tr>\n<td>Захват</td>\n<td>0</td>\n<td><strong>+1</strong></td>\n<td>0</td>\n<td><strong>−1</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Встречный</strong> — защита ударом на опережение: силён против Захвата, уязвим к Колющему.</p>\n<h5 id=\"ярус-исхода\">Ярус исхода</h5>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>S</th>\n<th>Ярус</th>\n<th>Что даёт</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>+2 и больше</td>\n<td><strong>Пробой</strong></td>\n<td>рана с +1 к счёту, тег раны, +2 Давления цели</td>\n</tr>\n<tr>\n<td>+1</td>\n<td><strong>Попадание</strong></td>\n<td>рана по оружию и броне</td>\n</tr>\n<tr>\n<td>0</td>\n<td><strong>Сцепка</strong></td>\n<td>клинки связаны: бросок связанных клинков (см. «15.3 Чтение противника» и «15.6 Последствия»)</td>\n</tr>\n<tr>\n<td>−1</td>\n<td><strong>Отбито</strong></td>\n<td>защитник берёт Инициативу и Ответ</td>\n</tr>\n<tr>\n<td>−2 и меньше</td>\n<td><strong>Брешь</strong></td>\n<td>защитник сразу бьёт Контратаку «по открытому»</td>\n</tr>\n</tbody>\n</table></div>\n<h5 id=\"пары-интентов\">Пары Интентов</h5>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Атакующий \\ Ответ</th>\n<th>Удар</th>\n<th>Заслон</th>\n<th>Манёвр</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Удар</strong></td>\n<td>Обмен (см. ниже)</td>\n<td>три слоя → S → ярус</td>\n<td>Манёвр защищает как Уклонение (см. «15.4 Дистанция и позиция»)</td>\n</tr>\n<tr>\n<td><strong>Заслон</strong></td>\n<td>—</td>\n<td>ничего не происходит, оба тратят Выносливость</td>\n<td>Манёвр проходит свободно</td>\n</tr>\n<tr>\n<td><strong>Манёвр</strong></td>\n<td>—</td>\n<td>—</td>\n<td>решает кинетика</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Удар по открытому.</strong> Если цель не защищается от этого атакующего (бьёт другого, стоит к нему Спиной или Флангом, занята делом), S = +1 + кинетика.</p>\n<p><strong>Контратака.</strong> При Бреши защитник сразу бьёт в ответ «по открытому»: атакующий провалился в удар и не успевает защититься. S = +1 + кинетика, где сравнивают уже вскрытые кинетики: Заслона защитника против Удара атакующего. Кинетика защитника бьёт — Пробой; равна — Попадание; проигрывает — атакующий успел вернуть оружие, и ответ ничего не дал. Линию и тип ответного удара защитник называет сам, кубы не бросают. Бить можно только тем, что достаёт с текущей дистанции; штраф дистанции снижает ярус ответа (см. «15.4 Дистанция и позиция»). После этого у защитника ещё и Ответ (+1 к следующему Удару).</p>\n<h5 id=\"обмен-удар-против-удара\">Обмен: Удар против Удара</h5>\n<ul>\n<li><strong>Одна линия.</strong> Клинки встречаются: Сцепка. Победитель по кинетике берёт Инициативу.</li>\n<li><strong>Разные линии.</strong> Оба удара идут в тело как Попадание. Победитель по кинетике бьёт первым. Второй удар срывается, только если первый вывел противника из строя (смерть или проваленное «стерпеть»). При равной кинетике оба удара одновременны.</li>\n<li><strong>Кубы в Обмене.</strong> Один бросок на сторону. Победитель с перевесом 2+ усиливает свой удар на ступень или ослабляет чужой, и здесь сдвиг идёт через ноль. Перевес 4+ даёт две ступени: можно усилить свой удар и ослабить чужой или дважды что-то одно. Крит сам даёт ступень, два крита гасят друг друга. Специалист — стойкость, уклонение или натиск — сдвигает на две ступени в своей сфере.</li>\n<li><strong>Поправки состояния в Обмене.</strong> Каждый удар в Обмене считается как удар по Заслону, только ступенями. Твои штрафы к Удару ослабляют твой удар на ступень за каждую единицу. Штрафы противника к защите усиливают удар по нему. Это всё, что вне Обмена меняет S от состояния: Сбит (−2 себе, +2 по тебе), Изнемог, Оглушение, Калечащая, Слабая рука, Перелом руки, «Кровь в глаза» (только к защите). Пример: лежащий бьёт в Обмен — его удар не доходит, если кубы не вернут его, а удар по нему идёт Пробоем.</li>\n</ul>\n<p>Равные почти не сдвигают друг друга, и Обмен остаётся взаимной резнёй. Слабому против сильного лезть в Обмен нельзя: его путь — Заслон. Раненому, лежащему и изнемогшему — тоже.</p>\n<p><strong>Домашние правила для Обмена в разные линии</strong> (основа — правило выше):</p>\n<ul>\n<li><strong>«Первый срывает второй».</strong> Победитель по кинетике бьёт с Пробоем, и это срывает удар проигравшего. Быстрее и смертоноснее (смерть без брони 27% против 16%), но мастерство решает меньше.</li>\n<li><strong>«Оба доходят».</strong> Оба удара доходят всегда, удар победителя по кинетике — Пробой. Больше всего обоюдных ран: обоюдное попадание в 83% Обменов.</li>\n<li><strong>«Быстрый бьёт сильнее».</strong> Удар победителя по кинетике — Пробой, второй срывается, только если первый вывел из строя. Середина между основой и «оба доходят».</li>\n</ul>\n<h5 id=\"инициатива-и-импульсы-защиты\">Инициатива и импульсы защиты</h5>\n<ul>\n<li><strong>Инициатива</strong> — после Отбито или после победы по кинетике в Обмене одной линии. В следующем такте обладатель объявляет Стойку и траты жетонов вторым.</li>\n<li><strong>Ответ</strong> — после Отбито или Бреши защитник получает +1 к следующему Удару.</li>\n<li><strong>Выдержка</strong> — после двух Заслонов подряд +1 к следующему Удару.</li>\n<li>Ответ и Выдержка не складываются: всего не больше +1.</li>\n</ul>\n<h5 id=\"дело-в-бою\">Дело в бою</h5>\n<p>Не всё в бою — удар. Зажать рану, выхватить нож, поджечь фитиль, оттащить раненого — это <strong>дела</strong>. Дело выбирают тайно, вместе с Интентом или вместо него, и вскрывают со всеми.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дело</th>\n<th>Чего стоит</th>\n<th>Примеры</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Свободное</strong></td>\n<td>ничего, в любой такт</td>\n<td>бросить оружие или предмет, отпустить хват, выкрикнуть слово</td>\n</tr>\n<tr>\n<td><strong>Быстрое</strong></td>\n<td>такт без Удара: пометка к Заслону или Манёвру</td>\n<td>выхватить, убрать или поднять оружие; достать предмет с пояса; передать предмет; встать; утереть кровь; выпрямить клинок</td>\n</tr>\n<tr>\n<td><strong>Полное</strong></td>\n<td>весь такт вместо Интента, ты открыт</td>\n<td>зажать рану или наскоро перетянуть её ремнём; достать вещь из сумки; поджечь факел или фитиль от огня; прочесть записку; отпереть дверь ключом; тащить раненого</td>\n</tr>\n<tr>\n<td><strong>Долгое</strong></td>\n<td>несколько полных дел подряд</td>\n<td>перевязать как следует, наложить жгут, вскрыть замок, высечь огонь, выломать дверь</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Быстрое дело.</strong> Тайно выбери Заслон или Манёвр и припиши к нему дело. Защищаешься и двигаешься как обычно, только не бьёшь. Дело сделано в конце такта, если ты ещё в строю. Выносливость — как за Заслон или Манёвр. Одно быстрое дело за такт.</p>\n<p><strong>Полное дело.</strong> Тайно выбери дело вместо Интента. Ты не защищаешься и не двигаешься:</p>\n<ul>\n<li><strong>удар по тебе — «по открытому».</strong> Кинетики у тебя нет, поэтому это Попадание (S = +1). Поправки твоего состояния добавляются как обычно: по Сбитому это уже Пробой. Кубы не бросают. Достать тебя можно и с шагом: выпад по занятому — тоже Попадание;</li>\n<li><strong>Попадание и выше срывает дело.</strong> Захват по занятому — тоже Попадание: сразу Борьба, ничья у хватающего;</li>\n<li><strong>если тебя не достали,</strong> дело сделано в конце такта;</li>\n<li><strong>цена</strong> — 0,5 Выносливости, как за Заслон.</li>\n</ul>\n<p><strong>Долгое дело.</strong> Несколько полных дел подряд. Сколько тактов, называет ГМ. Сорвали — начинаешь заново, если ГМ по картине не засчитает сделанное (повязка наложена наполовину, дверь уже трещит).</p>\n<p><strong>Бросок.</strong> Если делу нужна проверка навыка (например, Врачевание для повязки), её бросают по ядру броска после вскрытия. Если в этот такт по тебе били или стреляли, даже мимо, сложность +1.</p>\n<p><strong>Стрелок и занятый.</strong> Для стрелка занятый полным делом — цель с Ритмом «Тяжёлый», и Отклика у неё нет (см. <a href=\"#/4/1/глава-16.-стрельба\" class=\"xref\">главе 16</a>). Перезарядка — по карточке оружия в той же главе.</p>\n<p><strong>На Сходе</strong> дела решаются сценой, без тактов (см. «15.4 Дистанция и позиция»).</p>\n<p><strong>Дела, которые уже есть в других главах.</strong> Это быстрые дела, их правила не меняются:</p>\n<ul>\n<li>выхватить, поднять или убрать оружие («15.5 Оружие», «Смена оружия»);</li>\n<li>выпрямить погнутый клинок (тег «Гнётся», «15.5 Оружие»);</li>\n<li>встать с земли: пока встаёшь, ты ещё лежишь, и Заслон идёт с −2 («15.6 Последствия», «Борьба и земля»);</li>\n<li>утереть кровь (тег «Кровь в глаза», «15.6 Последствия»).</li>\n</ul>\n<h5 id=\"как-это-выглядит\">Как это выглядит</h5>\n<ul>\n<li><strong>Перекос к защите:</strong> высокая защита прикрывает голову и грудь, но открывает ноги; низкая бережёт ноги, но всё выше открыто.</li>\n<li><strong>Рывок против Тяжёлого:</strong> пока противник заносит секиру, ты уже уколол.</li>\n<li><strong>Ровный против Рывка:</strong> ты видишь бросок и встречаешь его клинком.</li>\n<li><strong>Дробящий против Парирования:</strong> булава продавливает подставленный клинок.</li>\n<li><strong>Захват против Щита:</strong> борода топора цепляет край щита и рвёт его в сторону.</li>\n<li><strong>Сцепка:</strong> клинки сошлись крестом, и теперь решает сила или хитрость.</li>\n<li><strong>Брешь:</strong> противник провалился в выпад, и ты бьёшь, пока он открыт. Если ты был быстрее — прошиваешь его; если он успел вернуть клинок — ответ вязнет.</li>\n<li><strong>Обмен в разные линии:</strong> оба рубят одновременно; быстрый достаёт первым, но раненый всё равно довершает свой удар, если устоял.</li>\n<li><strong>Быстрое дело:</strong> пятишься, отводя удар клинком, а свободная рука уже тянет нож из-за пояса.</li>\n<li><strong>Полное дело:</strong> присел над раненым и затягиваешь ремень на его бедре, а за спиной уже слышны шаги.</li>\n<li><strong>Сорванное дело:</strong> удар в плечо, и склянка летит на камни.</li>\n</ul>\n<hr />\n<h3 id=\"кубы-в-бою\">15.2 Кубы в бою</h3>\n<hr />\n<h5 id=\"что-решают-кубы\">Что решают кубы</h5>\n<p>Попадание решает выбор (матрица SRM): линия, время, удар. Кубы решают исполнение: насколько чисто вышло задуманное. Поэтому кубы только сдвигают уже полученный ярус.</p>\n<h5 id=\"бросок-такта\">Бросок такта</h5>\n<p>После вскрытия и расчёта яруса обе стороны бросают свои пулы по матрице ниже и сравнивают успехи.</p>\n<ul>\n<li><strong>Перевес 2–3 успеха</strong> сдвигает ярус на одну ступень в пользу победителя. <strong>Знак не меняется:</strong> Брешь можно смягчить до Отбито, но не до попадания; Пробой можно ослабить до Попадания, но не до Отбито.</li>\n<li><strong>Перевес 4+ успеха</strong> сдвигает ярус на две ступени, и <strong>знак может смениться:</strong> мастер отводит удар, который уже шёл в цель, или достаёт противника из провального выпада.</li>\n<li><strong>Ступени сдвига идут без Сцепки:</strong> Брешь — Отбито — Попадание — Пробой. Сдвиг кубами в Сцепку не приводит: на две ступени вниз Пробой становится Отбито, а Попадание — Брешью.</li>\n<li><strong>Крит</strong> (две кости на максимуме, на d4 — три четвёрки) сдвигает ярус на ступень автоматически, если у противника крита нет. Два крита гасят друг друга, и дальше считается перевес.</li>\n<li><strong>Обмен:</strong> кубы сдвигают ярус и через ноль при любом перевесе 2+; перевес 4+ даёт две ступени (см. «15.1 Такт и матрица», раздел «Обмен»).</li>\n<li><strong>Сцепку кубы не сдвигают:</strong> она открывает бросок связанных клинков (см. «15.3 Чтение противника»).</li>\n<li><strong>Бросают, только когда есть что сдвигать.</strong> При Сцепке и при двух защитах кубы такта не бросают.</li>\n</ul>\n<h5 id=\"как-это-выглядит-1\">Как это выглядит</h5>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Сдвиг</th>\n<th>Картинка</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Пробой → Попадание (2+)</td>\n<td>успел подставить плечо, удар вскользь</td>\n</tr>\n<tr>\n<td>Попадание → Пробой (2+)</td>\n<td>довернул клинок в щель</td>\n</tr>\n<tr>\n<td>Брешь → Отбито (2+)</td>\n<td>провалился, но успел вернуть клинок</td>\n</tr>\n<tr>\n<td>Отбито → Брешь (2+)</td>\n<td>отбил так, что противник раскрылся</td>\n</tr>\n<tr>\n<td>Пробой → Отбито (4+)</td>\n<td>удар уже шёл в цель, но мастер в последний миг отвёл его</td>\n</tr>\n<tr>\n<td>Попадание → Брешь (4+)</td>\n<td>мастер не просто отвёл удар, а провалил противника в пустоту</td>\n</tr>\n<tr>\n<td>Брешь → Попадание (4+)</td>\n<td>провалился в выпад, но довернул кисть и достал</td>\n</tr>\n</tbody>\n</table></div>\n<h5 id=\"матрица-бросков\">Матрица бросков</h5>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Действие</th>\n<th>Навык</th>\n<th>Характеристика</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Удар, Обмен</td>\n<td>боевой навык оружия</td>\n<td>Телосложение</td>\n</tr>\n<tr>\n<td>Заслон: Парирование</td>\n<td>боевой навык оружия</td>\n<td>Телосложение</td>\n</tr>\n<tr>\n<td>Заслон: Щит</td>\n<td>боевой навык (специализация «щит» сдвигает кость)</td>\n<td>Телосложение</td>\n</tr>\n<tr>\n<td>Заслон: Уклонение</td>\n<td>Атлетика</td>\n<td>Телосложение</td>\n</tr>\n<tr>\n<td>Заслон: Встречный</td>\n<td>боевой навык оружия</td>\n<td>Телосложение</td>\n</tr>\n<tr>\n<td>Связанные клинки: Борьба</td>\n<td>Атлетика</td>\n<td>Телосложение</td>\n</tr>\n<tr>\n<td>Связанные клинки: Отдёрг</td>\n<td>боевой навык оружия</td>\n<td>Телосложение</td>\n</tr>\n<tr>\n<td>Манёвр, «Выстроить»</td>\n<td>Атлетика</td>\n<td>Телосложение</td>\n</tr>\n<tr>\n<td>Чтение противника</td>\n<td>боевой навык под оружие противника</td>\n<td>Личность</td>\n</tr>\n<tr>\n<td>Ложь (Финт)</td>\n<td>свой боевой навык (Обман — через прокачку)</td>\n<td>Личность</td>\n</tr>\n<tr>\n<td>«Стерпеть»</td>\n<td>лучший из боевого навыка и Атлетики</td>\n<td>Телосложение</td>\n</tr>\n<tr>\n<td>Воля</td>\n<td>боевой навык</td>\n<td>Личность</td>\n</tr>\n<tr>\n<td>Поддержка лидера</td>\n<td>Лидерство</td>\n<td>Личность</td>\n</tr>\n<tr>\n<td>Запугивание</td>\n<td>Запугивание</td>\n<td>Личность</td>\n</tr>\n<tr>\n<td>Выстрел</td>\n<td>Стрельба</td>\n<td>Телосложение (лук) / Личность (арбалет, огнестрел)</td>\n</tr>\n</tbody>\n</table></div>\n<hr />\n<h3 id=\"чтение-противника-1\">15.3 Чтение противника</h3>\n<hr />\n<h5 id=\"ставка\">Ставка</h5>\n<p>Любой боец до вскрытия может сделать <strong>Ставку</strong>: назвать одно значение кинетики противника («читаю Рывок»). Угадал — +1 к этому слою. Ошибся — −1. Ставка не требует жетона и доступна всегда.</p>\n<h5 id=\"талант-чтения-и-жетоны-прочтения\">Талант чтения и жетоны Прочтения</h5>\n<p>Жетоны Прочтения получает только персонаж с <strong>талантом чтения</strong>. Без таланта остаётся только Ставка.</p>\n<ul>\n<li><strong>Откуда:</strong> базовый талант даёт жетон, когда противник <strong>повторил Линию и Кинетику вместе</strong> два такта подряд (Читаемость). Улучшения таланта добавляют жетоны за Сцепку и за Заслон против Заслона.</li>\n<li><strong>Запас</strong> скрыт от противника и <strong>сгорает после боя</strong>.</li>\n<li><strong>Трата:</strong> не больше одного жетона за такт. Больше — через прокачку.</li>\n</ul>\n<h5 id=\"перестройка\">Перестройка</h5>\n<p>Трата жетона после скрытого выбора, до вскрытия. Читающий называет ось, противник показывает своё значение на ней, читающий может заменить свой дескриптор на той же оси.</p>\n<p><strong>Какие оси можно читать:</strong></p>\n<ul>\n<li>Кинетику — при любом Интенте.</li>\n<li>Линию — в Ударе, Заслоне и Обмене.</li>\n<li>Тип — в Ударе и Заслоне.</li>\n<li>Направление — в Манёвре.</li>\n<li>Сам Интент — только через отдельный билд.</li>\n</ul>\n<p><strong>Порядок:</strong> обладатель Инициативы объявляет трату вторым.</p>\n<h5 id=\"пул-чтения\">Пул чтения</h5>\n<p>Кость Личности × (боевой навык под <strong>оружие противника</strong> + 1). Фехтовальщик хорошо читает фехтовальщика и плохо читает алебардиста.</p>\n<h5 id=\"финты-1\">Финты</h5>\n<p>Финт — семейство обманок. Каждый Финт открывается через билд.</p>\n<p><strong>Ответ на чтение:</strong></p>\n<ul>\n<li><strong>Ложь.</strong> Ты тратишь жетон и называешь любое значение оси, читающий меняет выбор под названное. Затем бросок «кто кого перечитал»: финтующий бросает свой боевой навык + Личность, читающий — пул чтения. Если у финтующего успехов <strong>строго больше</strong>, вскрывается настоящее значение, а замена читающего остаётся. Иначе читающий видит правду и меняет выбор заново.</li>\n<li><strong>Смена.</strong> После замены читающего ты меняешь своё значение на той же оси, без броска, но теряешь темп: −1 к S своего действия.</li>\n</ul>\n<p>Ответить на Финт ещё одним жетоном может только тот, кто способен тратить больше одного жетона за такт.</p>\n<p><strong>Активные Финты</strong> <em>(Ложная атака и Приглашение убраны из базы 31.10.2026 — домашние правила; см. заметки)</em>:</p>\n<ul>\n<li><strong>Ложная атака.</strong> При объявлении Стойки открыто покажи линию. Если Заслон противника лёг на неё, а удар пошёл в другую, твой удар получает +1.</li>\n<li><strong>Приглашение.</strong> Открыто покажи «дыру». Если удар пришёл туда, твой Заслон там получает +1.</li>\n<li><strong>Ложное намерение.</strong> Ответ на чтение Интента: изображаешь атаку, стоя в защите, или наоборот.</li>\n</ul>\n<p><strong>Финты связанных клинков:</strong></p>\n<ul>\n<li><strong>Отдёрг</strong> — см. «Связанные клинки».</li>\n<li><strong>Удвоение</strong> (талант) — после Отбито атакующий сразу бьёт второй раз «по открытому»: обе стороны тайно выбирают только кинетику, S = +1 + кинетика.</li>\n</ul>\n<h5 id=\"связанные-клинки\">Связанные клинки</h5>\n<p>Сцепка не даёт последствий, и кубы её не сдвигают. Вместо этого клинки связаны, и открывается отдельный бросок:</p>\n<ul>\n<li><strong>Борьба</strong> (для всех): Атлетика + Телосложение против того же. Больше успехов — бросок, перевес 2+ — навал или обезоруживание, поровну — Клинч (подробно — «15.6 Последствия», «Борьба и земля»).</li>\n<li><strong>Отдёрг</strong> (через билд): вместо Борьбы бросаешь боевой навык + Телосложение. При победе бьёшь «по открытому» (S = +1 + кинетика) в линию по своему выбору. Это техника против силы.</li>\n</ul>\n<hr />\n<h3 id=\"дистанция-и-позиция\">15.4 Дистанция и позиция</h3>\n<hr />\n<h5 id=\"дистанция\">Дистанция</h5>\n<p>Дистанция — состояние пары бойцов. Важно не «сколько метров», а чьё оружие достаёт без шага.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дистанция</th>\n<th>Что там происходит</th>\n<th>Чья это дистанция</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Сход</td>\n<td>вне досягаемости: ждать, готовиться, менять оружие, стрелять</td>\n<td>ничья, стрелка</td>\n</tr>\n<tr>\n<td>Длинная</td>\n<td>удар с шага древковым</td>\n<td>копьё, алебарда</td>\n</tr>\n<tr>\n<td>Средняя</td>\n<td>удар с шага клинком</td>\n<td>меч, двуручный меч, цеп; булава, топор, клевец</td>\n</tr>\n<tr>\n<td>Ближняя</td>\n<td>удар без шага, длинному оружию тесно</td>\n<td>кинжал, кулак, короткий клинок, меч в полумече; булава, топор, клевец (у них две своих дистанции)</td>\n</tr>\n<tr>\n<td>Клинч</td>\n<td>тела сцеплены: борьба, нож</td>\n<td>борец, кинжал</td>\n</tr>\n</tbody>\n</table></div>\n<p>Борьба на земле — не дистанция, а состояние (Сбит, упал).</p>\n<h5 id=\"удар-и-дистанция\">Удар и дистанция</h5>\n<p>У каждого оружия своя дистанция.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Дистанция относительно своей</th>\n<th>Что бывает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Своя</td>\n<td>удар без штрафа</td>\n</tr>\n<tr>\n<td>На ступень дальше</td>\n<td>удар с шагом (выпад): −1 к S. Если удар не отбит (Сцепка и выше), ты сближаешься до своей дистанции. При Отбито или Бреши ты остаёшься, где был</td>\n</tr>\n<tr>\n<td>На две и больше дальше, или со Схода</td>\n<td>ударить нельзя, сначала Манёвр</td>\n</tr>\n<tr>\n<td>Ближе своей</td>\n<td>тесно: −1 к S за каждую ступень</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Дистанция в Обмене.</strong> Если ты бьёшь с шагом или из тесноты, твой удар в Обмене слабее на ступень за каждую ступень штрафа. Кубы Обмена могут вернуть его, как обычно. Ударил с шагом — после Обмена вы на твоей дистанции.</p>\n<p><strong>Контратака и дистанция.</strong> После Бреши защитник бьёт по открытому тем, что достаёт с текущей дистанции. Штраф дистанции снижает ярус контратаки на ступень за ступень. Если ярус упал до нуля, контратаки нет. Контратака с шагом сближает до дистанции защитника.</p>\n<p><strong>Борьба сближает.</strong> После Борьбы бросок оставляет бойцов на Ближней, навал и клинч — в Клинче.</p>\n<h5 id=\"манёвр\">Манёвр</h5>\n<p>Манёвр — Интент перемещения: <strong>Сблизиться</strong>, <strong>Отойти</strong>, <strong>Обойти</strong> или <strong>Выстроить</strong>, плюс кинетика. Бросок Манёвра — Атлетика + Телосложение.</p>\n<p><strong>Вход под остриё.</strong> Если ты сближаешься внутрь дистанции противника, а его оружие длиннее:</p>\n<ul>\n<li><strong>он бьёт:</strong> его удар разрешается первым, твой Манёвр защищает как Уклонение. Попадание и выше — ты ранен и стоишь. Сцепка и Отбито — остриё держит, ты стоишь. Только Брешь (он провалился в удар) — ты ныряешь под остриё на две ступени;</li>\n<li><strong>он в Заслоне:</strong> встречный укол по тем же правилам, но при Бреши ты проходишь на одну ступень;</li>\n<li><strong>он двигается:</strong> решает кинетика (см. ниже).</li>\n</ul>\n<p>Когда ты уже ближе его дистанции, встречного укола нет.</p>\n<p>Манёвр защищает как Уклонение <strong>без линии</strong>: движущийся не прикрывает ни Верх, ни Центр, ни Низ, и слой линии для него 0. Встречный укол из Заслона идёт в Центр с кинетикой этого Заслона, колющим, если оружие колет. Сцепка во встречном уколе не ведёт в Борьбу: остриё упёрлось, и ты стоишь.</p>\n<p><strong>Остальные Манёвры:</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Мой Манёвр</th>\n<th>Противник бьёт</th>\n<th>Противник в Заслоне</th>\n<th>Противник двигается</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Сблизиться (оружие не короче)</td>\n<td>его удар против твоего Уклонения; при Отбито или Бреши ты прошёл на ступень</td>\n<td>шаг вперёд свободно</td>\n<td>решает кинетика</td>\n</tr>\n<tr>\n<td>Отойти</td>\n<td>его удар против твоего Уклонения с +1 ему (прикрытие хуже Заслона); не ранен — дистанция +1</td>\n<td>дистанция +1 свободно</td>\n<td>против сближения — кинетика, против отхода — +2</td>\n</tr>\n<tr>\n<td>Обойти</td>\n<td>как Отойти; не ранен — в следующем такте ты у него на Фланге</td>\n<td>Фланг свободно</td>\n<td>решает кинетика</td>\n</tr>\n<tr>\n<td>Выстроить</td>\n<td>см. «Бой с несколькими противниками»</td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Один на один Фланг не держится: противник успевает развернуться. В дуэли Обойти нужен только для того, чтобы выйти из Прижат.</p>\n<p><strong>Кинетика в движении</strong> — то, <em>как</em> ты двигаешься. Цикл тот же, что и в ударе.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Кинетика</th>\n<th>Как двигаешься</th>\n<th>Побеждает</th>\n<th>Проигрывает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Рывок</td>\n<td>резкий бросок: догнать или оторваться за миг</td>\n<td>Тяжёлый: проскакивает мимо медленного напора</td>\n<td>Ровный: бросок читается, его встречают или пропускают мимо</td>\n</tr>\n<tr>\n<td>Ровный</td>\n<td>выверенные шаги, стойка не ломается</td>\n<td>Рывок</td>\n<td>Тяжёлый: напор забирает пространство</td>\n</tr>\n<tr>\n<td>Тяжёлый</td>\n<td>наступ массой: плечо, щит, теснить. Тратит Выносливость</td>\n<td>Ровный</td>\n<td>Рывок</td>\n</tr>\n</tbody>\n</table></div>\n<p>Когда оба двигаются в одну сторону, оба получают своё: оба сближаются — дистанция −2, оба отходят — +2. Когда в разные, победитель по кинетике получает свой Манёвр, проигравший — нет. При равной кинетике бросают Атлетику: перевес 2+ решает, иначе дистанция не меняется. Тяжёлый наступ, выигравший у отходящего, теснит его к стене (путь к метке Прижат).</p>\n<p><strong>Отход и бегство.</strong> Отойти — выход из схватки с прикрытием, а не бегство. Бегство — отдельный выбор (покинуть бой, подставив спину) или исход проваленной Воли (см. «15.6 Последствия»).</p>\n<p><strong>Сход.</strong> Пока обе стороны на Сходе, такты не идут: ожидание, смена оружия и подготовка решаются обычной сценой. Исключение — стрелок рядом (см. <a href=\"#/4/1/глава-16.-стрельба\" class=\"xref\">главе 16</a>: стык режимов).</p>\n<h5 id=\"метки-позиции\">Метки позиции</h5>\n<p>Позиция задаётся не картой, а метками поверх дистанции. Каждая метка меняет одно правило.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Метка</th>\n<th>Что меняет</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Угол</td>\n<td>Фронт / Фланг / Спина, см. ниже</td>\n</tr>\n<tr>\n<td>Высота</td>\n<td>тот, кто выше, получает +1 к Тяжёлой кинетике</td>\n</tr>\n<tr>\n<td>Опора</td>\n<td>на скользком Рывок и Манёвры получают −1</td>\n</tr>\n<tr>\n<td>Теснота</td>\n<td>размашистые удары древкового и двуручного (рубящий, дробящий, Захват) получают −1; укол не страдает; противники сами стоят в линию</td>\n</tr>\n<tr>\n<td>Прижат</td>\n<td>со Спины не зайти, но и Отойти нельзя. Рядом со стеной Тяжёлый наступ, выигравший у отходящего, сразу делает его Прижатым. Выйти — Обойти вдоль стены</td>\n</tr>\n</tbody>\n</table></div>\n<h5 id=\"бой-с-несколькими-противниками\">Бой с несколькими противниками</h5>\n<p>Защитник делает <strong>один</strong> выбор на такт и бьёт только того, кто перед ним.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Угол атакующего</th>\n<th>Что бывает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Фронт</td>\n<td>обычная матрица</td>\n</tr>\n<tr>\n<td>Фланг</td>\n<td>Заслон защитника работает с −1. Если защитник бьёт фронт, по нему бьют как по открытому (S = +1 + кинетика)</td>\n</tr>\n<tr>\n<td>Спина</td>\n<td>всегда как по открытому</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Выстроить</strong> — Манёвр: двигаешься к внешнему краю группы, чтобы ближний противник заслонял дальнего. Атлетика + Телосложение против Атлетики лучшего из тех, кто заходит с фланга. При успехе в этот такт бьёт только передний. Сам ты в этот такт не бьёшь.</p>\n<ul>\n<li>В чистом поле нужен перевес 2+. Против троих и больше без препятствий — невозможно.</li>\n<li>В Тесноте (дверь, мост, коридор, лестница) линия строится сама.</li>\n</ul>\n<h5 id=\"как-это-выглядит-2\">Как это выглядит</h5>\n<ul>\n<li><strong>Удар с шагом:</strong> длинный выпад, после которого ты уже вплотную. Если выпад отбили, тебя отбросило назад, туда, откуда ты шагнул.</li>\n<li><strong>Вход под остриё при Бреши:</strong> копейщик провалился в укол, и ты нырнул под древко.</li>\n<li><strong>Тяжёлый наступ:</strong> щит в щит, шаг за шагом, пока за спиной противника не окажется стена.</li>\n<li><strong>Выстроить:</strong> ты уходишь вбок так, что второй противник оказывается за спиной первого и мешает ему.</li>\n</ul>\n<h5 id=\"домашние-правила\">Домашние правила</h5>\n<ul>\n<li><strong>Упор.</strong> Копьё получает +1 к встречному уколу против того, кто входит под остриё Рывком: древко упёрто, и бросок на него — самоубийство.</li>\n</ul>\n<hr />\n<h3 id=\"оружие\">15.5 Оружие</h3>\n<hr />\n<h5 id=\"оружие-в-матрице\">Оружие в матрице</h5>\n<p>Матрица одна на весь ближний бой. Оружие её не заменяет, а <strong>сужает меню</strong> (какие типы атаки и защиты тебе доступны) и <strong>ломает в одной точке</strong> (теги). Всё, что нужно знать об оружии за столом, собрано на его <strong>карточке</strong>.</p>\n<p><strong>Карточка оружия:</strong></p>\n<ul>\n<li><strong>Навык</strong> — Фехтование (клинки, которыми фехтуют: кинжал, одноручный и полуторный меч, сабля, рапира) или Ратное (оружие длинного рычага и удара массой: древковое, дробящее, топоры, большой двуручный меч).</li>\n<li><strong>Своя дистанция</strong> — где оружие бьёт без шага (см. «15.4 Дистанция и позиция»).</li>\n<li><strong>База раны</strong> — 1 лёгкое, 2 среднее, 3 тяжёлое (см. «15.6 Последствия»).</li>\n<li><strong>Атака</strong> — доступные типы: Рубящий, Колющий, Дробящий, Захват.</li>\n<li><strong>Защита</strong> — доступные типы: Парирование, Щит, Уклонение, Встречный.</li>\n<li><strong>Стойки</strong> — какие стойки можно объявлять с этим оружием.</li>\n<li><strong>Вес и теги</strong> — что оружие делает иначе, чем остальные.</li>\n<li><strong>Раны по броне</strong> — готовая табличка ступеней для каждой брони и линии, чтобы за столом не складывать счёт.</li>\n</ul>\n<h5 id=\"таблица-оружия\">Таблица оружия</h5>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Оружие</th>\n<th>Навык</th>\n<th>Дистанция</th>\n<th>База</th>\n<th>Атака</th>\n<th>Защита</th>\n<th>Стойки</th>\n<th>Вес и теги</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Кинжал</td>\n<td>Фехтование</td>\n<td>Ближняя</td>\n<td>1</td>\n<td>Колющий, Рубящий, Захват</td>\n<td>Парирование, Уклонение; Встречный только на своей дистанции</td>\n<td>Острие, Нижняя</td>\n<td>лёгкое</td>\n</tr>\n<tr>\n<td>Меч</td>\n<td>Фехтование</td>\n<td>Средняя</td>\n<td>2</td>\n<td>Рубящий, Колющий, Захват</td>\n<td>Парирование, Уклонение, Встречный</td>\n<td>Верхняя, Острие, Нижняя</td>\n<td>полумеч</td>\n</tr>\n<tr>\n<td>Булава</td>\n<td>Ратное</td>\n<td>Средняя и Ближняя</td>\n<td>2</td>\n<td>Дробящий, Захват</td>\n<td>Парирование, Уклонение</td>\n<td>Верхняя, Нижняя</td>\n<td>Сокрушающий, Коронный (дробящий)</td>\n</tr>\n<tr>\n<td>Булава с шипами</td>\n<td>Ратное</td>\n<td>Средняя и Ближняя</td>\n<td>2</td>\n<td>Дробящий, Колющий</td>\n<td>Парирование, Уклонение</td>\n<td>Верхняя, Нижняя</td>\n<td>дороже обычной</td>\n</tr>\n<tr>\n<td>Топор</td>\n<td>Ратное</td>\n<td>Средняя и Ближняя</td>\n<td>2</td>\n<td>Рубящий, Дробящий, Захват</td>\n<td>Парирование, Уклонение</td>\n<td>Верхняя, Нижняя</td>\n<td>—</td>\n</tr>\n<tr>\n<td>Клевец</td>\n<td>Ратное</td>\n<td>Средняя и Ближняя</td>\n<td>2</td>\n<td>Дробящий, Колющий</td>\n<td>Парирование, Уклонение</td>\n<td>Верхняя, Нижняя</td>\n<td>Бронебойный, Коронный (колющий)</td>\n</tr>\n<tr>\n<td>Цеп</td>\n<td>Ратное</td>\n<td>Средняя</td>\n<td>2</td>\n<td>Дробящий</td>\n<td>Уклонение</td>\n<td>Верхняя, Нижняя</td>\n<td>Огибающий, Коронный (дробящий)</td>\n</tr>\n<tr>\n<td>Копьё</td>\n<td>Ратное</td>\n<td>Длинная</td>\n<td>2</td>\n<td>Колющий, Дробящий</td>\n<td>Парирование, Уклонение, Встречный</td>\n<td>Острие, Нижняя</td>\n<td>Точный укол</td>\n</tr>\n<tr>\n<td>Алебарда</td>\n<td>Ратное</td>\n<td>Длинная</td>\n<td>3</td>\n<td>Рубящий, Колющий, Захват</td>\n<td>Парирование, Уклонение, Встречный</td>\n<td>Верхняя, Острие, Нижняя</td>\n<td>тяжёлое, Точный укол</td>\n</tr>\n<tr>\n<td>Двуручный меч</td>\n<td>Ратное</td>\n<td>Средняя</td>\n<td>3</td>\n<td>Рубящий, Колющий</td>\n<td>Парирование, Уклонение, Встречный</td>\n<td>Верхняя, Острие, Нижняя</td>\n<td>тяжёлое</td>\n</tr>\n<tr>\n<td>Без оружия</td>\n<td>Рукопашный бой</td>\n<td>Ближняя и Клинч</td>\n<td>0</td>\n<td>Дробящий, Захват</td>\n<td>Уклонение</td>\n<td>Свободная</td>\n<td>кулак ранит только в голову или на Пробой</td>\n</tr>\n</tbody>\n</table></div>\n<p>Щит, баклер и второе оружие меняют карточку основного оружия (см. «Щит и вторая рука»).</p>\n<h5 id=\"доступ-к-защитам\">Доступ к защитам</h5>\n<p>Защита доступна, если у снаряжения есть часть, которая её выполняет.</p>\n<ul>\n<li><strong>Уклонение</strong> — всем: уйти телом может каждый.</li>\n<li><strong>Парирование</strong> — оружием, которым можно принять удар: клинком, древком, рукоятью. Цеп не парирует: цепь не держит удар.</li>\n<li><strong>Встречный</strong> — оружием, у которого остриё выходит вперёд: меч, копьё, алебарда, двуручный. Кинжал — только на своей дистанции. Булава, топор, клевец и цеп встречного укола не дают.</li>\n<li><strong>Щит</strong> — только со щитом.</li>\n</ul>\n<h5 id=\"стойки\">Стойки</h5>\n<p>Стойку объявляют <strong>открыто</strong> в начале каждого такта, до тайного выбора (см. «15.1 Такт и матрица»). Обладатель Инициативы объявляет вторым. Стойка готовит одну кинетику и открывает одну линию.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Стойка</th>\n<th>Что готовит</th>\n<th>Что открывает</th>\n<th>Как выглядит</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Верхняя</td>\n<td>+1 к своим действиям с Тяжёлой кинетикой</td>\n<td>удар противника в Низ +1</td>\n<td>оружие над головой или у плеча, готово рушиться вниз</td>\n</tr>\n<tr>\n<td>Острие</td>\n<td>+1 к своим действиям с Ровной кинетикой</td>\n<td>удар противника в Верх +1</td>\n<td>остриё смотрит в лицо, руки у пояса</td>\n</tr>\n<tr>\n<td>Нижняя</td>\n<td>+1 к своим действиям с Рывком</td>\n<td>удар противника в Верх +1</td>\n<td>оружие опущено, голова открыта, удар снизу вылетает мгновенно</td>\n</tr>\n<tr>\n<td>Свободная</td>\n<td>ничего</td>\n<td>ничего</td>\n<td>для статистов и быстрой игры</td>\n</tr>\n</tbody>\n</table></div>\n<p>«Свои действия» — и Удар, и Заслон с этой кинетикой. Какие стойки доступны, написано на карточке оружия.</p>\n<h5 id=\"вес\">Вес</h5>\n<ul>\n<li><strong>Лёгкое</strong> оружие (кинжал): +1 к своим действиям с Рывком.</li>\n<li><strong>Тяжёлое</strong> оружие (алебарда, двуручный): −1 к своим действиям с Рывком.</li>\n<li><strong>Щит</strong> — тяжёлое снаряжение: тот же −1 к Рывку.</li>\n</ul>\n<h5 id=\"захват\">Захват</h5>\n<p>Захват — атака, которая не ранит, а хватает: рукой, крюком алебарды, бородой топора, гардой меча. Попав Захватом, ты сразу начинаешь Борьбу (см. «15.6 Последствия»):</p>\n<ul>\n<li><strong>Попадание</strong> — Борьба, ничья в твою пользу: противник Сбит.</li>\n<li><strong>Пробой</strong> — Борьба, ничья даёт навал: противник Удержан.</li>\n</ul>\n<p>Захват против щита: Пробой Захватом <strong>вырывает щит</strong>. Дальше противник бьётся без щита, а Борьба идёт как при Попадании.</p>\n<h5 id=\"щит-и-вторая-рука\">Щит и вторая рука</h5>\n<p><strong>Щит.</strong></p>\n<ul>\n<li><strong>Укрытие.</strong> Щит всегда прикрывает Верх и Центр: удары туда получают −1. «Всегда» — значит и в Обмене (удар туда на ступень слабее), и против контратаки. Укрытие не действует против Захвата, тяжёлого оружия (алебарда, двуручный) и оружия с тегом «Огибающий».</li>\n<li><strong>Защита Щитом</strong> добавляется в меню.</li>\n<li><strong>Вес:</strong> −1 к своим действиям с Рывком.</li>\n<li><strong>Рука занята:</strong> со щитом нет Захвата.</li>\n<li><strong>Вырван:</strong> Пробой Захватом по щиту вырывает его (см. «Захват»).</li>\n</ul>\n<p><strong>Баклер</strong> — малый кулачный щит: +1 к Парированию. Укрытия нет, вес не мешает.</p>\n<p><strong>Кинжал в левой руке.</strong> В Обмене удар противника на ступень слабее: левая рука отводит его, пока правая бьёт. Удар тяжёлого оружия (алебарда, двуручный) кинжалом не отвести: против него это правило не действует.</p>\n<p><strong>Два оружия</strong> (два меча, меч и топор): свой Удар +1, и в Обмене тоже; свой Заслон −1.</p>\n<h5 id=\"смена-оружия\">Смена оружия</h5>\n<ul>\n<li><strong>Бросить</strong> оружие — свободно.</li>\n<li><strong>Выхватить</strong> другое или <strong>поднять</strong> с земли — быстрое дело (см. «15.1 Такт и матрица», «Дело в бою»): такт без Удара, защищаться и двигаться можно. Обезоруженный (см. «15.6 Последствия») защищается в этом такте только Уклонением или щитом.</li>\n<li><strong>Убрать в ножны</strong> — тоже такт без Удара.</li>\n<li>На Сходе смена идёт в сцене, без тактов.</li>\n</ul>\n<p>Сменить оружие быстрее — талант (см. «Места для талантов»).</p>\n<h5 id=\"полумеч\">Полумеч</h5>\n<p>Мечник может перехватить клинок второй рукой за середину. Хват выбирают <strong>тайно в каждом действии</strong>, вместе с остальными дескрипторами. Левая рука для этого должна быть свободна: со щитом, баклером, кинжалом или вторым оружием полумеча нет.</p>\n<p>Хват за середину клинка (полумеч):</p>\n<ul>\n<li><strong>Колющий с «Точным уколом»</strong> — остриё идёт в щель лат.</li>\n<li><strong>Дробящий</strong> — удар гардой или навершием, держа меч за клинок.</li>\n<li><strong>Захват</strong> — гардой, как крюком.</li>\n<li><strong>Защита:</strong> Парирование и Уклонение.</li>\n<li><strong>Своя дистанция:</strong> Ближняя.</li>\n</ul>\n<p>Обычный хват — по карточке меча.</p>\n<h5 id=\"теги-оружия\">Теги оружия</h5>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Тег</th>\n<th>Что делает</th>\n<th>У кого</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Точный укол</td>\n<td>Колющий Пробой на своей дистанции идёт в щель лат (броня щели −1)</td>\n<td>копьё, алебарда, меч в полумече</td>\n</tr>\n<tr>\n<td>Коронный</td>\n<td>+1 к S Ударом своего главного типа; в Обмене не действует</td>\n<td>булава и цеп (дробящий), клевец (колющий)</td>\n</tr>\n<tr>\n<td>Сокрушающий</td>\n<td>Дробящий снимает на 1 меньше брони</td>\n<td>булава</td>\n</tr>\n<tr>\n<td>Бронебойный</td>\n<td>Колющий по латам считается как по кольчуге</td>\n<td>клевец</td>\n</tr>\n<tr>\n<td>Огибающий</td>\n<td>Укрытие щита не действует</td>\n<td>цеп</td>\n</tr>\n<tr>\n<td>Гнётся</td>\n<td>Если в Сцепке противник бил Дробящим, клинок гнётся, без броска. Погнутый клинок: −1 к S всех его действий. Выпрямить — такт без Удара</td>\n<td>бронзовые клинки</td>\n</tr>\n</tbody>\n</table></div>\n<h5 id=\"материал-лат\">Материал лат</h5>\n<p>Латы в мире делают в основном из бронзы и серебра: железо и сталь — редкость. Материал меняет, что латы держат. Рубящий латы не проходит никогда.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Материал</th>\n<th>Колющий</th>\n<th>Дробящий</th>\n<th>Особое</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Обычное серебро</td>\n<td>любой колющий Пробой проходит, как в щель (−1)</td>\n<td>−1</td>\n<td>—</td>\n</tr>\n<tr>\n<td>Бронза (кованая)</td>\n<td>только щель</td>\n<td>−1</td>\n<td>—</td>\n</tr>\n<tr>\n<td>Императорское серебро (с медью и оловом, состаренное, холодной ковки)</td>\n<td>только щель</td>\n<td>−2</td>\n<td>огонь отпускает его до обычного серебра</td>\n</tr>\n<tr>\n<td>Сталь (редкость)</td>\n<td>только щель</td>\n<td>−2</td>\n<td>—</td>\n</tr>\n</tbody>\n</table></div>\n<h5 id=\"карточки-ран\">Карточки ран</h5>\n<p>Ступень раны готова для каждой брони, типа удара и места: <strong>Попадание / Пробой</strong>. За столом ничего не складывают: строка — твой удар, столбец — броня противника.</p>\n<p>Обозначения: Л — Лёгкая, Т — Тяжёлая, К — Калечащая, С — Смертельная, «—» — не ранит.</p>\n<ul>\n<li><strong>*</strong> — щель лат: на своей дистанции (Точный укол) или по Сбитому латнику.</li>\n<li><strong>†</strong> — щель лат только по Сбитому латнику.</li>\n<li><strong>Голова или руки</strong> — атакующий тайно выбирает вместе с линией Верх.</li>\n<li><strong>Захват</strong> не ранит, он начинает Борьбу.</li>\n<li>Дробящий в голову латника оглушает уже на Попадание.</li>\n<li>Домашнее правило «Укол в голову» поднимает строку колющего в голову на ступень.</li>\n</ul>\n<p><strong>Кинжал</strong> (база 1)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Удар</th>\n<th>Без брони</th>\n<th>Стёганка</th>\n<th>Кольчуга</th>\n<th>Латы: бронза</th>\n<th>Латы: обычное серебро</th>\n<th>Латы: сталь, имп. серебро</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Колющий в корпус</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n<td>— / Т†</td>\n<td>— / Т</td>\n<td>— / Т†</td>\n</tr>\n<tr>\n<td>Колющий в голову, руки, ноги</td>\n<td>Л / Т</td>\n<td>Л / Т</td>\n<td>— / Л</td>\n<td>— / Л†</td>\n<td>— / Л</td>\n<td>— / Л†</td>\n</tr>\n<tr>\n<td>Рубящий в голову</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n<td>— / Л</td>\n<td>— / —</td>\n<td>— / —</td>\n<td>— / —</td>\n</tr>\n<tr>\n<td>Рубящий в руки, корпус, ноги</td>\n<td>Л / Т</td>\n<td>— / Л</td>\n<td>— / —</td>\n<td>— / —</td>\n<td>— / —</td>\n<td>— / —</td>\n</tr>\n</tbody>\n</table></div>\n<p>По Удержанному кинжал бьёт в щель, и любое попадание — Пробой.</p>\n<p><strong>Меч</strong> (база 2)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Удар</th>\n<th>Без брони</th>\n<th>Стёганка</th>\n<th>Кольчуга</th>\n<th>Латы: бронза</th>\n<th>Латы: обычное серебро</th>\n<th>Латы: сталь, имп. серебро</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Рубящий в голову</td>\n<td>К / С</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n<td>— / —</td>\n<td>— / —</td>\n<td>— / —</td>\n</tr>\n<tr>\n<td>Рубящий в руки, корпус, ноги</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n<td>— / Л</td>\n<td>— / —</td>\n<td>— / —</td>\n<td>— / —</td>\n</tr>\n<tr>\n<td>Колющий в корпус</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>Т / К</td>\n<td>— / К†</td>\n<td>— / К</td>\n<td>— / К†</td>\n</tr>\n<tr>\n<td>Колющий в голову, руки, ноги</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n<td>— / Т†</td>\n<td>— / Т</td>\n<td>— / Т†</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Меч в полумече</strong> (база 2, Точный укол)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Удар</th>\n<th>Без брони</th>\n<th>Стёганка</th>\n<th>Кольчуга</th>\n<th>Латы: бронза</th>\n<th>Латы: обычное серебро</th>\n<th>Латы: сталь, имп. серебро</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Колющий в корпус</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>Т / К</td>\n<td>— / К*</td>\n<td>— / К</td>\n<td>— / К*</td>\n</tr>\n<tr>\n<td>Колющий в голову, руки, ноги</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n<td>— / Т*</td>\n<td>— / Т</td>\n<td>— / Т*</td>\n</tr>\n<tr>\n<td>Дробящий в голову</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td  в голову</td>\n<td>К / С</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n<td>— / —</td>\n<td>— / —</td>\n<td>— / —</td>\n</tr>\n<tr>\n<td>Рубящий в руки, корпус, ноги</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n<td>— / Л</td>\n<td>— / —</td>\n<td>— / —</td>\n<td>— / —</td>\n</tr>\n<tr>\n<td>Дробящий в голову</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n</tr>\n<tr>\n<td>Дробящий в руки, корпус, ноги</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n<td>Л / Т</td>\n<td>— / Л</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Клевец</strong> (база 2, Бронебойный)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Удар</th>\n<th>Без брони</th>\n<th>Стёганка</th>\n<th>Кольчуга</th>\n<th>Латы: бронза</th>\n<th>Латы: обычное серебро</th>\n<th>Латы: сталь, имп. серебро</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Дробящий в голову</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n</tr>\n<tr>\n<td>Дробящий в руки, корпус, ноги</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n<td>Л / Т</td>\n<td>— / Л</td>\n</tr>\n<tr>\n<td>Колющий в корпус</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Т / К</td>\n</tr>\n<tr>\n<td>Колющий в голову, руки, ноги</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n<td>Л / Т</td>\n<td>Л / Т</td>\n<td>Л / Т</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Цеп</strong> (база 2)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Удар</th>\n<th>Без брони</th>\n<th>Стёганка</th>\n<th>Кольчуга</th>\n<th>Латы: бронза</th>\n<th>Латы: обычное серебро</th>\n<th>Латы: сталь, имп. серебро</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Дробящий в голову</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n</tr>\n<tr>\n<td>Дробящий в руки, корпус, ноги</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n<td>Л / Т</td>\n<td>— / Л</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Копьё</strong> (база 2, Точный укол)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Удар</th>\n<th>Без брони</th>\n<th>Стёганка</th>\n<th>Кольчуга</th>\n<th>Латы: бронза</th>\n<th>Латы: обычное серебро</th>\n<th>Латы: сталь, имп. серебро</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Колющий в корпус</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>Т / К</td>\n<td>— / К*</td>\n<td>— / К</td>\n<td>— / К*</td>\n</tr>\n<tr>\n<td>Колющий в голову, руки, ноги</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n<td>— / Т*</td>\n<td>— / Т</td>\n<td>— / Т*</td>\n</tr>\n<tr>\n<td>Дробящий в голову</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n</tr>\n<tr>\n<td>Дробящий в руки, корпус, ноги</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n<td>Л / Т</td>\n<td>— / Л</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Алебарда</strong> (база 3, Точный укол)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Удар</th>\n<th>Без брони</th>\n<th>Стёганка</th>\n<th>Кольчуга</th>\n<th>Латы: бронза</th>\n<th>Латы: обычное серебро</th>\n<th>Латы: сталь, имп. серебро</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Рубящий в голову</td>\n<td>С / С</td>\n<td>К / С</td>\n<td>Т / К</td>\n<td>— / —</td>\n<td>— / —</td>\n<td>— / —</td>\n</tr>\n<tr>\n<td>Рубящий в руки, корпус, ноги</td>\n<td>К / С</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n<td>— / —</td>\n<td>— / —</td>\n<td>— / —</td>\n</tr>\n<tr>\n<td>Колющий в корпус</td>\n<td>С / С</td>\n<td>С / С</td>\n<td>К / С</td>\n<td>— / С*</td>\n<td>— / С</td>\n<td>— / С*</td>\n</tr>\n<tr>\n<td>Колющий в голову, руки, ноги</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>Т / К</td>\n<td>— / К*</td>\n<td>— / К</td>\n<td>— / К*</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Двуручный меч</strong> (база 3)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Удар</th>\n<th>Без брони</th>\n<th>Стёганка</th>\n<th>Кольчуга</th>\n<th>Латы: бронза</th>\n<th>Латы: обычное серебро</th>\n<th>Латы: сталь, имп. серебро</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Рубящий в голову</td>\n<td>С / С</td>\n<td>К / С</td>\n<td>Т / К</td>\n<td>— / —</td>\n<td>— / —</td>\n<td>— / —</td>\n</tr>\n<tr>\n<td>Рубящий в руки, корпус, ноги</td>\n<td>К / С</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n<td>— / —</td>\n<td>— / —</td>\n<td>— / —</td>\n</tr>\n<tr>\n<td>Колющий в корпус</td>\n<td>С / С</td>\n<td>С / С</td>\n<td>К / С</td>\n<td>— / С†</td>\n<td>— / С</td>\n<td>— / С†</td>\n</tr>\n<tr>\n<td>Колющий в голову, руки, ноги</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>Т / К</td>\n<td>— / К†</td>\n<td>— / К</td>\n<td>— / К†</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Без оружия</strong> (база 0)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Удар</th>\n<th>Без брони</th>\n<th>Стёганка</th>\n<th>Кольчуга</th>\n<th>Латы: бронза</th>\n<th>Латы: обычное серебро</th>\n<th>Латы: сталь, имп. серебро</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Дробящий в голову</td>\n<td>Л / Т</td>\n<td>Л / Т</td>\n<td>Л / Т</td>\n<td>— / Л</td>\n<td>— / Л</td>\n<td>— / —</td>\n</tr>\n<tr>\n<td>Дробящий в руки, корпус, ноги</td>\n<td>— / Л</td>\n<td>— / Л</td>\n<td>— / Л</td>\n<td>— / —</td>\n<td>— / —</td>\n<td>— / —</td>\n</tr>\n</tbody>\n</table></div>\n<p>Кулак ранит только в голову или на Пробой.</p>\n<h5 id=\"как-это-выглядит-3\">Как это выглядит</h5>\n<ul>\n<li><strong>Кинжал:</strong> нож в обратном хвате ищет щель под мышкой, пока вторая рука держит запястье.</li>\n<li><strong>Меч:</strong> длинный клинок держит противника на острие, а вблизи мечник перехватывает его за середину и бьёт гардой в шлем.</li>\n<li><strong>Булава:</strong> фланцы сминают наплечник, рука под ним немеет.</li>\n<li><strong>Булава с шипами:</strong> удар, который и дробит, и рвёт.</li>\n<li><strong>Топор:</strong> борода цепляет край щита и рвёт его в сторону.</li>\n<li><strong>Клевец:</strong> клюв пробивает пластину там, где меч соскальзывает.</li>\n<li><strong>Цеп:</strong> било перехлёстывает через край щита и бьёт в затылок.</li>\n<li><strong>Копьё:</strong> остриё держит дистанцию, древко бьёт по ногам.</li>\n<li><strong>Алебарда:</strong> крюк стаскивает латника с ног, остриё входит в щель забрала.</li>\n<li><strong>Двуручный меч:</strong> удар, который нельзя поймать щитом, — его можно только пропустить мимо.</li>\n<li><strong>Щит:</strong> стена, из-за которой выглядывает короткий клинок.</li>\n<li><strong>Баклер:</strong> кулачный щит подбивает клинок противника, меч тут же отвечает.</li>\n<li><strong>Меч и кинжал:</strong> левая рука отводит удар, правая уже колет.</li>\n</ul>\n<hr />\n<h3 id=\"последствия\">15.6 Последствия</h3>\n<hr />\n<h5 id=\"рана-ступень-и-тег\">Рана: ступень и тег</h5>\n<p>У каждой раны две оси: <strong>ступень</strong> (насколько тяжело) и <strong>тег</strong> (что она ломает).</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Счёт</th>\n<th>Ступень</th>\n<th>Что значит</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>0 и меньше</td>\n<td>без раны</td>\n<td>удар не прошёл броню или ушёл вскользь</td>\n</tr>\n<tr>\n<td>1</td>\n<td>Лёгкая</td>\n<td>порез, ушиб. Отдельный счётчик, не растёт по цепи</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Тяжёлая</td>\n<td>рана, с которой можно стоять, но надо «стерпеть»</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Калечащая</td>\n<td>рана, которая отнимает руку, ногу, глаз</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Смертельная</td>\n<td>боец выбыл и умирает</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Счёт раны</strong> = база оружия по весу + поправка типа × локации + 1 за Пробой − броня по типу.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>База</th>\n<th>Оружие</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>лёгкое: кинжал, нож</td>\n</tr>\n<tr>\n<td>2</td>\n<td>среднее: меч, булава, топор, клевец, цеп, копьё</td>\n</tr>\n<tr>\n<td>3</td>\n<td>тяжёлое: алебарда, двуручное</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Тип \\ Локация</th>\n<th>Верх (голова, руки)</th>\n<th>Центр (корпус)</th>\n<th>Низ (ноги)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Рубящий</td>\n<td>голова +1</td>\n<td>—</td>\n<td>—</td>\n</tr>\n<tr>\n<td>Колющий</td>\n<td>—</td>\n<td>+1 (полость)</td>\n<td>—</td>\n</tr>\n<tr>\n<td>Дробящий</td>\n<td>голова +1</td>\n<td>—</td>\n<td>—</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Голова или руки.</strong> Выбирая линию Верх, атакующий тайно отмечает и цель: голова или руки. Голова тяжелее для рубящего и дробящего, руки дают теги Слабая рука и Перелом.</p>\n<p><strong>Штраф Калечащей.</strong> Покалеченная часть тела работает хуже: рука — −1 к Удару и Заслону, нога — −1 к кинетике в Обмене и к защите, корпус или голова — −1 к S во всём. Тяжёлая рана сама штрафа не даёт.</p>\n<p><strong>Вторая рана в то же место</strong> даёт большее из двух: старая ступень + 1 или новая.</p>\n<p>Карточка оружия заранее считает ступень для каждой брони и локации: за столом счёт не складывают, а смотрят в карточку.</p>\n<h5 id=\"броня\">Броня</h5>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Броня</th>\n<th>Рубящий</th>\n<th>Колющий</th>\n<th>Дробящий</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Стёганка</td>\n<td>−1</td>\n<td>0</td>\n<td>0</td>\n</tr>\n<tr>\n<td>Кольчуга</td>\n<td>−2</td>\n<td>−1</td>\n<td>0</td>\n</tr>\n<tr>\n<td>Латы</td>\n<td>не проходит</td>\n<td>не проходит, кроме щели (в щели −1)</td>\n<td>−1 или −2 по материалу</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Щель в латах.</strong> Колющий удар проходит в щель с бронёй −1: под латами поддоспешник с кольчужными вставками. Щель находят только Пробоем:</p>\n<ul>\n<li>на своей дистанции — оружием с тегом «Точный укол» (копьё, алебарда, меч в полумече; см. «15.5 Оружие»);</li>\n<li>по Сбитому латнику — любым колющим оружием;</li>\n<li>по Удержанному — кинжалом держащего, который и так бьёт Пробоем (см. «Борьба и земля»).</li>\n</ul>\n<p>Дробящий удар через латы гасят шлем, подшлемник и стёганка: бронза и обычное серебро держат его на −1, сталь и императорское серебро — на −2. Обычное серебро пропускает в щель и любой колющий Пробой (см. «15.5 Оружие», «Материал лат»).</p>\n<p><strong>Латы в Борьбе.</strong> Латник получает +1 куб в Борьбе против противника с более лёгкой бронёй: латы весят 15–25 кг, а бездоспешный не может бить его в клинче коленом и локтем.</p>\n<p>Дробящий удар в голову латника оглушает уже на Попадание, без броска: латы передают удар в голову. Пробой дробящим в голову оглушает всегда.</p>\n<h5 id=\"теги-ран\">Теги ран</h5>\n<p>Тег появляется только на Пробой или крит.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Тег</th>\n<th>Откуда</th>\n<th>В бою</th>\n<th>После боя</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Кровотечение</td>\n<td>рубящий в корпус, колющий в бедро</td>\n<td>−0,5 Выносливости за такт</td>\n<td>без перевязки рана растёт на ступень</td>\n</tr>\n<tr>\n<td>Сильное кровотечение</td>\n<td>укол в корпус, бедро, шею; укол в щель</td>\n<td>−1 Выносливости за такт</td>\n<td>без помощи — смерть за минуты</td>\n</tr>\n<tr>\n<td>Хромота</td>\n<td>рубящий или дробящий в ноги</td>\n<td>Манёвры −1, Рывок в движении нельзя</td>\n<td>медленный ход, бегство труднее</td>\n</tr>\n<tr>\n<td>Слабая рука</td>\n<td>рубящий в руку</td>\n<td>−1 к Заслону и удару этой рукой</td>\n<td>проходит с отдыхом</td>\n</tr>\n<tr>\n<td>Перелом</td>\n<td>дробящий в руку, рёбра, ногу</td>\n<td>рука: двуручным и щитом нельзя; нога: только Ровный в движении; рёбра: Тяжёлая кинетика нельзя</td>\n<td>недели, нужно Врачевание</td>\n</tr>\n<tr>\n<td>Оглушение</td>\n<td>дробящий в голову</td>\n<td>следующий такт −1 к S</td>\n<td>—</td>\n</tr>\n<tr>\n<td>Сбит</td>\n<td>дробящий Пробой в Низ, бросок</td>\n<td>см. «Борьба и земля»</td>\n<td>—</td>\n</tr>\n<tr>\n<td>Выронил оружие</td>\n<td>рубящий или дробящий в руки</td>\n<td>Обезоружен</td>\n<td>—</td>\n</tr>\n<tr>\n<td>Кровь в глаза</td>\n<td>рубящий в голову</td>\n<td>−1 к Заслону, пока не потратишь такт, чтобы утереть</td>\n<td>—</td>\n</tr>\n<tr>\n<t
