d>Отсечение</td>\n<td>рубящий Калечащая в руку или ногу тяжёлым оружием</td>\n<td>Калечащая + Сильное кровотечение</td>\n<td>часть тела потеряна навсегда</td>\n</tr>\n<tr>\n<td>Сбито дыхание</td>\n<td>дробящий в корпус</td>\n<td>−1 Выносливости сразу</td>\n<td>—</td>\n</tr>\n<tr>\n<td>Рана в живот</td>\n<td>колющий Калечащая в корпус, если выжил</td>\n<td>—</td>\n<td>без Врачевания смерть через несколько дней</td>\n</tr>\n</tbody>\n</table></div>\n<h5 id=\"стерпеть\">Стерпеть</h5>\n<p>При каждой <strong>новой</strong> Тяжёлой или Калечащей ране боец бросает «стерпеть».</p>\n<ul>\n<li><strong>Пул:</strong> кость Телосложения, костей — лучший из боевого навыка и Атлетики + 1.</li>\n<li><strong>Сложность:</strong> Тяжёлая — 1, Калечащая — 2; +1 за каждые две Лёгкие.</li>\n<li><strong>Провал:</strong> боец выбыл — упал, потерял сознание или больше не может драться. Он жив и в руках победителя.</li>\n<li><strong>Смертельная</strong> рана выводит без броска.</li>\n</ul>\n<h5 id=\"выносливость\">Выносливость</h5>\n<p><strong>Запас</strong> = 7 + модификатор Телосложения (Отвратно −3 … Стандартно 0 … Образцово +3), то есть от 4 до 10.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Трата</th>\n<th>Сколько</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Удар, Обмен</td>\n<td>1 за такт</td>\n</tr>\n<tr>\n<td>Заслон</td>\n<td>0,5 за такт</td>\n</tr>\n<tr>\n<td>Манёвр</td>\n<td>0,5; Тяжёлый наступ — 1</td>\n</tr>\n<tr>\n<td>Полное дело</td>\n<td>0,5 за такт</td>\n</tr>\n<tr>\n<td>Связанные клинки, Борьба</td>\n<td>1</td>\n</tr>\n<tr>\n<td>Лёгкая рана</td>\n<td>1 сразу</td>\n</tr>\n<tr>\n<td>Кровотечение / Сильное</td>\n<td>0,5 / 1 за такт</td>\n</tr>\n</tbody>\n</table></div>\n<p>Траты продолжаются и ниже нуля. Броня запас в дуэли не трогает: Усталость от брони — правило долгого и массового боя.</p>\n<p><strong>Изнемог</strong> — запас 0 и ниже:</p>\n<ul>\n<li>−1 к S;</li>\n<li>каждый такт +1 Давления;</li>\n<li>на −2 боец рухнул без броска: выбыл, жив. До этого игрок сам решает, держаться ли дальше, отойти или сдаться.</li>\n</ul>\n<p><strong>На одной воле.</strong> Один раз за бой изнемогший может сдвинуть порог падения с −2 на −3, получив +2 Давления.</p>\n<p><strong>Восстановление.</strong> В бою запас не возвращается. Передышка на Сходе, когда никто не давит, возвращает половину. Короткий отдых после боя возвращает весь запас, но каждая неперевязанная Лёгкая держит потолок на 1 ниже.</p>\n<h5 id=\"давление-и-воля\">Давление и Воля</h5>\n<p><strong>Воля</strong> = 7 + модификатор Личности (4–10). Воля не тратится: это порог, к которому растёт <strong>Давление</strong>.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Источник Давления</th>\n<th>Сколько</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Лёгкая рана</td>\n<td>+1</td>\n</tr>\n<tr>\n<td>Тяжёлая / Калечащая</td>\n<td>+3 / +4</td>\n</tr>\n<tr>\n<td>Пробой по тебе</td>\n<td>+2</td>\n</tr>\n<tr>\n<td>Такт в Изнеможении</td>\n<td>+1</td>\n</tr>\n<tr>\n<td>На глазах пал союзник</td>\n<td>+3</td>\n</tr>\n<tr>\n<td>Врагов больше</td>\n<td>+1 за такт, пока их больше</td>\n</tr>\n<tr>\n<td>Жестокость на глазах: добили сдавшегося, изуродовали</td>\n<td>+2</td>\n</tr>\n<tr>\n<td>Запугивание</td>\n<td>перевес успехов (см. ниже)</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Запугивание</strong> — действие вместо удара: Запугивание + Личность против Воли цели. Перевес успехов идёт в Давление цели.</p>\n<p><strong>Снижение Давления:</strong></p>\n<ul>\n<li>свалил противника на глазах у своих — −2 тебе и союзникам, которые это видели;</li>\n<li>лидер одалживает пул Лидерства на проверку Воли;</li>\n<li>после боя Давление сбрасывается, но каждая непролеченная Тяжёлая рана даёт +3 в начале следующего боя.</li>\n</ul>\n<p><strong>Проверка Воли.</strong> Когда Давление ≥ Воли, боец каждый такт бросает Личность × (боевой навык + 1). Сложность = 1 + (Давление − Воля) / 2, с округлением вниз.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Недобор</th>\n<th>Исход</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Дрогнул: следующий такт без Удара</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Бегство: свободный противник бьёт по Спине</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Сдача: судьбу решает победитель</td>\n</tr>\n<tr>\n<td>4 и больше</td>\n<td>Оцепенение</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Хоумбрю: Воля без броска.</strong> Стол может заменить проверку выбором игрока: держаться с −1 к S за каждые 2 Давления сверх Воли (минимум −1) или уступить — Отход, Сдача, Бегство на выбор. Угроза при этом слабеет: упрямый боец гибнет вдвое чаще, а бежит, только когда сам решит.</p>\n<p><strong>Ужас</strong> приходит только от сверхъестественного и оставляет метки на Теле Разума (см. главы о магии и существах).</p>\n<h5 id=\"борьба-и-земля\">Борьба и земля</h5>\n<p><strong>Борьба</strong> — после Сцепки или в Клинче. Атлетика + Телосложение против того же, стоит 1 Выносливость.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Итог</th>\n<th>Что происходит</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Больше успехов</td>\n<td>бросок: противник Сбит. Вместо броска можно разорвать клинч</td>\n</tr>\n<tr>\n<td>Перевес 2+</td>\n<td>бросок с навалом: противник Удержан. Вместо него можно обезоружить</td>\n</tr>\n<tr>\n<td>Поровну</td>\n<td>стоите в Клинче</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Сбит.</strong> Пока ты на земле, противник бьёт тебя с +2, а по Сбитому латнику колющий Пробой идёт в щель. Каждый такт выбираешь:</p>\n<ul>\n<li><strong>встать</strong> — без броска, такт уходит на подъём, ты не бьёшь. Это быстрое дело к Заслону (см. «15.1», «Дело в бою»): в этот такт ты ещё лежишь;</li>\n<li><strong>драться лёжа</strong> — Удар или Заслон с −2, ты остаёшься на земле.</li>\n</ul>\n<p><strong>Удержан.</strong> Встать нельзя. Каждый такт выбираешь:</p>\n<ul>\n<li><strong>вырваться</strong> — Борьба, больше успехов у тебя — вырвался, но ещё Сбит;</li>\n<li><strong>бить снизу</strong> — кинжалом с −2, если рука свободна; по латнику сверху — в щель только на Пробой.</li>\n</ul>\n<p>Если ты не вырвался, держащий бьёт кинжалом в щель, и любое попадание считается Пробоем.</p>\n<p><strong>Обезоружен.</strong> Оружие на земле. Выхватить кинжал или поднять оружие — такт без Удара (см. «15.5 Оружие», «Смена оружия»); защититься в нём можно только Уклонением или щитом.</p>\n<h5 id=\"удача-в-бою\">Удача в бою</h5>\n<p><em>Предварительно; окончательно — в главе «03 Удача».</em> Удачу жгут по правилам главы «03 Удача». В бою покупки значат вот что:</p>\n<ul>\n<li><strong>Уйти от смерти</strong> (до вскрытия, когда угроза объявлена смертельной): Смертельная рана становится Калечащей. «Стерпеть» по ней бросают как обычно: можно выбыть, но живым.</li>\n<li><strong>Отвести последствие</strong> (после исхода): рана становится на ступень легче (Калечащая → Тяжёлая → Лёгкая) или снимается один тег.</li>\n</ul>\n<h5 id=\"как-это-выглядит-4\">Как это выглядит</h5>\n<ul>\n<li><strong>Лёгкая:</strong> клинок рассёк рукав, кровь, но рука работает.</li>\n<li><strong>Тяжёлая и «стерпеть»:</strong> удар в бок, боец сгибается, но не падает.</li>\n<li><strong>Калечащая:</strong> кисть повисла, глаз залит кровью.</li>\n<li><strong>Изнемог:</strong> руки налились свинцом, каждый замах — через силу.</li>\n<li><strong>Дрогнул:</strong> боец пятится и только закрывается.</li>\n<li><strong>Бегство:</strong> бросил строй и побежал, подставив спину.</li>\n<li><strong>Бросок:</strong> подсечка через бедро, противник гремит латами о землю.</li>\n<li><strong>Навал:</strong> колено на грудь, рука прижимает шлем, кинжал ищет забрало.</li>\n</ul>\n<h5 id=\"домашние-правила-1\">Домашние правила</h5>\n<ul>\n<li><strong>Укол в голову.</strong> Колющий в голову получает +1 к ране, как снаряд в <a href=\"#/4/1/глава-16.-стрельба\" class=\"xref\">главе 16</a>. Без правила укол бьёт сильнее всего в корпус, а голову рубят и дробят.</li>\n</ul>\n<hr />\n<hr />\n"}, {"id": "глава-16.-стрельба", "title": "Глава 16. Стрельба", "html": "<hr />\n<h4 id=\"часть-1.-выстрел\">Часть 1. Выстрел</h4>\n<h5 id=\"выстрел\">Выстрел</h5>\n<p>Стрелок тайно выбирает три вещи: <strong>Темп</strong>, <strong>Упреждение</strong> и <strong>Прицел</strong>. Цель ничего специально не выбирает: стрелок читает её обычное действие.</p>\n<p><strong>S выстрела</strong> = Темп против Отклика + Упреждение против Ритма + Прицел против Линии цели + дальность + поправки (Изготовка, укрытие, угол, высота, видимость, огнестрел вблизи, Ставка, раны).</p>\n<p><strong>Ярус</strong> по S — как в ближнем бою: +2 и выше — Пробой, +1 — Попадание, 0 — Впритирку, −1 — Мимо, −2 и ниже — Брешь. Кубы: Стрельба против пула цели, сдвиг по правилам «Кубов в бою». Впритирку кубы не сдвигают. Перевес 4+ сдвигает на две ступени по шкале без Впритирку и может сменить знак: Попадание → Брешь, Мимо → Пробой. Что дают ярусы:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ярус</th>\n<th>Что даёт</th>\n<th>Как выглядит</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Пробой (+2)</td>\n<td>рана с +1 к счёту, тег, +2 Давления цели</td>\n<td>стрела вошла в щель, пуля раздробила кость</td>\n</tr>\n<tr>\n<td>Попадание (+1)</td>\n<td>рана по оружию и броне</td>\n<td>стрела засела в плече</td>\n</tr>\n<tr>\n<td>Впритирку (0)</td>\n<td>+1 Давления цели; кубы не бросают</td>\n<td>пуля свистнула у уха, стрела дрогнула в щите у самого лица</td>\n</tr>\n<tr>\n<td>Мимо (−1)</td>\n<td>цель получает Инициативу</td>\n<td>промах выдал стрелка: цель видит, откуда бьют</td>\n</tr>\n<tr>\n<td>Брешь (−2)</td>\n<td>цель получает Ответ: +1 к следующему действию против этого стрелка. Если стрелок в досягаемости её оружия — сразу Контратака «по открытому»</td>\n<td>тетива хлестнула по руке, порох пыхнул на полке, а враг уже рядом</td>\n</tr>\n</tbody>\n</table></div>\n<p>Контратака против стрелка — как в ближнем бою: S = +1 + кинетика, где кинетика цели сравнивается с Темпом стрелка (Навскидку — Рывок, Прицельно — Ровный, Выждать — Тяжёлый), без кубов.</p>\n<p><strong>Дальность.</strong> У оружия своя полоса (Близко до ~15 м, Средне 15–60 м, Далеко 60–200 м). Каждая полоса дальше своей — −1.</p>\n<h5 id=\"как-стрелок-читает-цель\">Как стрелок читает цель</h5>\n<p>Каждая ось действия бойца ложится ровно на один слой выстрела. Мечнику ничего учить не нужно.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Что делает цель</th>\n<th>Что видит стрелок</th>\n<th>Слой</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Интент и тип действия</td>\n<td><strong>Отклик:</strong> Укрыться / Сместиться / Перехватить</td>\n<td>Темп</td>\n</tr>\n<tr>\n<td>Кинетика</td>\n<td><strong>Ритм:</strong> Тяжёлый — встал, Ровный — идёт ровно, Рывок — сорвался с места</td>\n<td>Упреждение</td>\n</tr>\n<tr>\n<td>Линия</td>\n<td><strong>где закрыта:</strong> Верх / Центр / Низ</td>\n<td>Прицел</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Отклики:</strong></p>\n<ul>\n<li><strong>Укрыться</strong> — Заслон щитом, уйти за укрытие, Залечь;</li>\n<li><strong>Сместиться</strong> — уклон, отход, перебежка;</li>\n<li><strong>Перехватить</strong> — удар, сближение, бег на стрелка.</li>\n</ul>\n<p><strong>Кто открыт для стрелка</strong>. Боец, чей Удар направлен на другого, от стрелка не защищается: выстрел идёт <strong>«по открытому»</strong>, S = +1 + Упреждение против Ритма. Темп и Прицел не считаются, как линия и тип в ближнем бою; точка прицела выбирает только место раны.</p>\n<p><strong>Защиты читаются по типу</strong>:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Тип защиты</th>\n<th>Отклик</th>\n<th>Как выглядит</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Щит, Парирование</td>\n<td>Укрыться</td>\n<td>закрылся щитом или клинком и плечом: навскидку не взять, прицельный найдёт щель</td>\n</tr>\n<tr>\n<td>Уклонение, Манёвр</td>\n<td>Сместиться</td>\n<td>уходит телом с линии</td>\n</tr>\n<tr>\n<td>Встречный</td>\n<td>Перехватить</td>\n<td>бросок вперёд с уколом: навскидку ловит выпад</td>\n</tr>\n</tbody>\n</table></div>\n<p>Удар, сближение или бег на самого стрелка — Перехватить.</p>\n<p>Цель вне ближнего боя (бегущий, другой стрелок) выбирает Отклик, Ритм и Линию сама, тайно, как боец выбирает Интент, кинетику и линию.</p>\n<h5 id=\"слой-1.-темп-против-отклика\">Слой 1. Темп против Отклика</h5>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Темп \\ Отклик</th>\n<th>Укрыться</th>\n<th>Сместиться</th>\n<th>Перехватить</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Навскидку (быстрый)</td>\n<td>−1</td>\n<td>0</td>\n<td>+1</td>\n</tr>\n<tr>\n<td>Прицельно (средний)</td>\n<td>+1</td>\n<td>−1</td>\n<td>0</td>\n</tr>\n<tr>\n<td>Выждать (медленный)</td>\n<td>0</td>\n<td>+1</td>\n<td>−1</td>\n</tr>\n</tbody>\n</table></div>\n<p>Навскидку ловит бегущего на тебя, но не берёт укрывшегося. Прицельно находит щель у укрывшегося, но сбивается на смещающемся. Выждать ловит конец перебежки, но пока ждёшь, тебя достают.</p>\n<h5 id=\"слой-2.-упреждение-против-ритма\">Слой 2. Упреждение против Ритма</h5>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Упреждение \\ Ритм</th>\n<th>Тяжёлый</th>\n<th>Ровный</th>\n<th>Рывок</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>В точку</td>\n<td>+1</td>\n<td>0</td>\n<td>−1</td>\n</tr>\n<tr>\n<td>По ходу</td>\n<td>−1</td>\n<td>+1</td>\n<td>0</td>\n</tr>\n<tr>\n<td>На срыв</td>\n<td>0</td>\n<td>−1</td>\n<td>+1</td>\n</tr>\n</tbody>\n</table></div>\n<p>«В точку» ловит того, кто встал, идущего ровно задевает вскользь, а сорвавшийся уходит. «По ходу» ловит ровный ход, но перед тем, кто встал, стрела проходит мимо. «На срыв» ловит рывок и задевает край стоящего, а идущий ровно проходит мимо этой точки.</p>\n<h5 id=\"слой-3.-прицел-против-линии-цели\">Слой 3. Прицел против Линии цели</h5>\n<p>Та же таблица «Перекос к защите», что в ближнем бою.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Прицел \\ Цель закрыта</th>\n<th>Верх</th>\n<th>Центр</th>\n<th>Низ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Голова</td>\n<td>−1</td>\n<td>+1</td>\n<td>0</td>\n</tr>\n<tr>\n<td>Корпус</td>\n<td>−1</td>\n<td>−1</td>\n<td>+1</td>\n</tr>\n<tr>\n<td>Ноги</td>\n<td>+1</td>\n<td>−1</td>\n<td>−1</td>\n</tr>\n</tbody>\n</table></div>\n<p>«Закрылся щитом высоко — бей по ногам.» Линия цели — линия её действия: где щит, клинок, руки. Цель без оружия выбирает Линию как позу: где закрылась плечом и руками.</p>\n<h5 id=\"что-даёт-точка-прицела\">Что даёт точка прицела</h5>\n<ul>\n<li><strong>Голова:</strong> +1 к ране от любого снаряда.</li>\n<li><strong>Корпус:</strong> колющий и огнестрельный +1 (полость), как в ближнем бою.</li>\n<li><strong>Ноги:</strong> надбавки нет, но <strong>Хромота уже на Попадании</strong> — исключение из правила «теги только на Пробой». Хромой бежит вдвое медленнее и не может Рывок.</li>\n<li><strong>Щит</strong> против стрел, болтов и метательного — −1 к ране при любой точке прицела. Пулю щит не держит.</li>\n</ul>\n<h4 id=\"часть-2.-такт-стрелка\">Часть 2. Такт стрелка</h4>\n<h5 id=\"интенты-дальнего-боя\">Интенты дальнего боя</h5>\n<p>Участник дальнего боя каждый такт тайно выбирает одно:</p>\n<ul>\n<li><strong>Выстрел</strong> — Темп, Упреждение, Прицел;</li>\n<li><strong>Отклик</strong> — Укрыться, Сместиться или Перехватить, с Ритмом и Линией;</li>\n<li><strong>Перезарядка</strong> — такт уходит на заряд;</li>\n<li><strong>Держать</strong> — заряжен, целится, но не стреляет.</li>\n</ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>A \\ B</th>\n<th>Выстрел</th>\n<th>Отклик</th>\n<th>Перезарядка или Держать</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Выстрел</strong></td>\n<td>Перестрелка (см. ниже)</td>\n<td>три слоя выстрела</td>\n<td>«по открытому»; за щитом или укрытием — как Укрыться</td>\n</tr>\n<tr>\n<td><strong>Отклик</strong></td>\n<td>—</td>\n<td>выстрела нет, только движение</td>\n<td>—</td>\n</tr>\n</tbody>\n</table></div>\n<p>Перезаряжающий и держащий прицел в открытую не защищаются: они заняты своим делом. Поэтому арбалетчик заряжает из-за павезы.</p>\n<h5 id=\"перехват\">Перехват</h5>\n<p>Когда выстрел и удар (или два выстрела) разрешаются в одном такте, порядок задаёт <strong>Темп</strong>: Навскидку = Рывок, Прицельно = Ровный, Выждать = Тяжёлый.</p>\n<ul>\n<li>Быстрое разрешается первым. Его Попадание или лучше <strong>срывает</strong> медленное.</li>\n<li>Равный Темп — одновременно, никто не срывает.</li>\n<li>Несорванное медленное получает <strong>+1 к ярусу</strong>, если быстрое пыталось его сорвать и не смогло.</li>\n<li><strong>Удар по стреляющему</strong> идёт «по открытому»: S = +1 + кинетика удара против Темпа стрелка (как против кинетики), без кубов.</li>\n<li><strong>Выстрел по бьющему</strong> считает его Отклик как Перехватить; огнестрел вблизи получает +1.</li>\n</ul>\n<p>Цикл кинетики решает, кто кого, когда действия встречаются; Темп решает, кто первым, когда не встречаются (ружьё 11).</p>\n<h5 id=\"перестрелка\">Перестрелка</h5>\n<p>Когда оба стреляют друг в друга в одном такте — это <strong>Перестрелка</strong>, Обмен выстрелов:</p>\n<ul>\n<li>каждый выстрел: <strong>S = Упреждение против Ритма противника</strong> (+1 огнестрелу вблизи, Ответ, штрафы ран). Ритм противника — его Темп как кинетика: Навскидку — Рывок, Прицельно — Ровный, Выждать — Тяжёлый. Слои Темпа и Прицела не считаются, прицел выбирает только место раны;</li>\n<li>один бросок Стрельбы на сторону: перевес 2–3 — ступень своему выстрелу вверх или чужому вниз (через ноль), 4+ — две, крит — ступень;</li>\n<li>порядок — по Темпу (Перехват ниже): быстрый первым, его Попадание срывает медленный выстрел, несорванный медленный +1.</li>\n</ul>\n<p><strong>Срыв и осечка.</strong> Сорванный выстрел уходит впустую: стрелка ранили или сбили раньше, и пуля (стрела) ушла в сторону — заряд потрачен. Осечка — другое: оружие не выстрелило, заряд остался в стволе (см. «Осечка, нагар, дождь»).</p>\n<h5 id=\"пистоль-в-ближнем-бою\">Пистоль в ближнем бою</h5>\n<p>Выстрел в упор считается по общим правилам выстрела, без отдельной строки в таблице типов: действие противника читается по Откликам (удар по пистольеру и Встречный — Перехватить, Парирование и Щит — Укрыться, Уклонение — Сместиться), порядок с ударом по стрелку решает Перехват, огнестрел вблизи +1. Выстрел заменяет Удар этого такта.</p>\n<p><strong>Пистоль в левой руке</strong> занимает руку: нет щита, кинжала в левой и полумеча. После выстрела пистоль бросают свободно (см. «15.5 Оружие», «Смена оружия»).</p>\n<h5 id=\"огнестрел-вблизи\">Огнестрел вблизи</h5>\n<p>Огнестрельное оружие получает <strong>+1 к S на полосе Близко</strong> (до ~15 м). Гладкий ствол неточен на дистанции, но вблизи пуля почти не уходит мимо.</p>\n<p><strong>Домашнее правило: картечь прощает упреждение.</strong> У мушкетона −1 слоя Упреждения становится 0: заряд картечи накрывает и то место, куда цель дёрнулась.</p>\n<h5 id=\"залечь\">Залечь</h5>\n<p>Цель без щита и укрытия может <strong>Укрыться</strong> — лечь или пригнуться, на любой полосе. В этот такт она не продвигается; встать — половина движения следующего такта. Вблизи навскидку промахиваешься по тому, кто падает, а прицельный выстрел находит лежащего (+1 Прицельно по таблице стрелка). Добежавший враг бьёт лежащего как Сбитого. В упор «Залечь» нет: лечь самому — значит стать Сбитым.</p>\n<h5 id=\"чтение-стрелка\">Чтение стрелка</h5>\n<p><strong>Ставка</strong> — как в ближнем бою (см. «15.3 Чтение противника»): до вскрытия назови одно значение у противника. Угадал — +1 себе, ошибся — −1.</p>\n<ul>\n<li><strong>Стрелок</strong> ставит на Ритм цели: «он побежит Рывком».</li>\n<li><strong>Цель</strong> ставит на Темп стрелка: «он держит натяг — ждёт».</li>\n</ul>\n<p><strong>Талант чтения</strong> даёт жетоны Прочтения, как в 15.3:</p>\n<ul>\n<li><strong>Читаемость:</strong> цель два такта подряд повторила Линию и Ритм; стрелок — Прицел и Темп.</li>\n<li><strong>Перестройка:</strong> назови ось противника, он показывает значение, ты меняешь свою парную ось. Пары: Отклик ↔ Темп, Ритм ↔ Упреждение, Линия ↔ Прицел.</li>\n<li><strong>Пул чтения</strong> у обеих сторон — Личность × (Стрельба + 1).</li>\n<li><strong>Ложь и Смена</strong> — как в 15.3.</li>\n</ul>\n<h4 id=\"часть-3.-позиция\">Часть 3. Позиция</h4>\n<h5 id=\"изготовка\">Изготовка</h5>\n<p>Изготовка — как стрелок держит оружие: состояние, а не тайный выбор. Начальную выбирают до боя.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Изготовка</th>\n<th>Что даёт</th>\n<th>Чем платит</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Стоя</td>\n<td>можно всё, выстрел в упор</td>\n<td>на полосе Далеко −1: без опоры дальний выстрел хуже</td>\n</tr>\n<tr>\n<td>С колена</td>\n<td>без штрафа на Далеко</td>\n<td>встать — такт без выстрела; вплотную выстрела нет</td>\n</tr>\n<tr>\n<td>С упора или лёжа</td>\n<td>Выждать +1</td>\n<td>Навскидку нельзя; встать — такт без выстрела; вплотную выстрела нет, лежащего бьют как Сбитого</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Сменить Изготовку</strong> — такт без выстрела (держать прицел и перезаряжаться можно).</p>\n<h5 id=\"укрытия\">Укрытия</h5>\n<ul>\n<li><strong>Спрятался — не видно.</strong> Кто укрылся за укрытием, того не видно: выстрел в него уходит впустую (для однозарядного — потерянный заряд).</li>\n<li><strong>Высунулся — видна голова.</strong> Кто стреляет или держит прицел из-за укрытия, открыт по классу укрытия; рана — в голову (+1).</li>\n</ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Укрытие</th>\n<th>Что видно, когда высунулся</th>\n<th>Поправка к выстрелу по нему</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Низкое (бруствер, телега, плетень), с колена</td>\n<td>голова и плечи</td>\n<td>0</td>\n</tr>\n<tr>\n<td>Высокое (стена, дерево, угол дома)</td>\n<td>голова и плечо сбоку</td>\n<td>−1</td>\n</tr>\n<tr>\n<td>Бойница (окно, амбразура)</td>\n<td>голова в проёме</td>\n<td>−2</td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li><strong>Стоя за низким укрытием</strong> ноги закрыты: видны корпус и голова.</li>\n<li><strong>Павеза</strong> — переносное высокое укрытие спереди; за ней можно перезаряжаться, не показываясь.</li>\n<li><strong>Броска за укрытием нет:</strong> спрятанного не видно, высунувшийся стреляет (Перестрелка, бросок Стрельбы), перебегающий смещается (Атлетика).</li>\n</ul>\n<h5 id=\"угол-обход-высота-видимость\">Угол, обход, высота, видимость</h5>\n<p><strong>Угол к стрелку</strong> — как в ближнем бою, но против укрытия и щита:</p>\n<ul>\n<li><strong>Фронт</strong> — укрытие и щит работают;</li>\n<li><strong>Фланг</strong> — укрытие и щит не закрывают (и −1 щита к ране не действует);</li>\n<li><strong>Спина</strong> — выстрел «по открытому».</li>\n</ul>\n<p><strong>Обход</strong> — перебежка из-за укрытия во Фланг противнику: на полосе Средне около 2 тактов, всё это время обходящий открыт как Сместиться. По голому полю под заряженным стволом обход — самоубийство; прикрытый путь (дым, кусты, канава) делает его выходом из застоя.</p>\n<p><strong>Высота.</strong> Стрелку сверху низкое укрытие не прячет: того, кто спрятался или перезаряжается за ним, видно. Сверху Выждать +1 — как Тяжёлая кинетика с высоты в ближнем бою.</p>\n<p><strong>Видимость:</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Условие</th>\n<th>Что меняет</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Дым, сумерки</td>\n<td>дальше полосы Близко −1</td>\n</tr>\n<tr>\n<td>Темнота, густой дым</td>\n<td>стрелять можно только на полосе Близко, −1; Прицельно нельзя — целиться не во что</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"часть-4.-броня-и-раны\">Часть 4. Броня и раны</h4>\n<h5 id=\"броня-против-снарядов\">Броня против снарядов</h5>\n<ul>\n<li><strong>Кольчуга</strong> (с поддоспешником): стрела −2, болт −1. Пулю кольчуга не держит.</li>\n<li><strong>Латы:</strong> стрела и болт не проходят, кроме щели. Длинный лук находит щель Прицельно и Пробоем, арбалет — Пробоем. Броня щели −1: под латами поддоспешник с кольчужными вставками (как в ближнем бою).</li>\n<li><strong>Пуля против лат:</strong> бронза и обычное серебро −1; сталь и императорское серебро −2 для пищали и мушкета; пистоль их не пробивает.</li>\n<li><strong>Стёганка без кольчуги:</strong> стрела −1, болт и пуля 0, картечь и камень −1.</li>\n<li><strong>Картечь:</strong> кольчуга −1, латы не пробивает. <strong>Камень пращи:</strong> броня держит его на ступень лучше, чем булаву (стёганка и кольчуга −1, бронза и обычное серебро −2, сталь не пробивает).</li>\n<li><strong>Метательное:</strong> дротик и плюмбата — как болт, нож — как стрела, топор — как рубящий; латы не пробивает.</li>\n<li><strong>Щит</strong> — −1 к ране от стрелы, болта, картечи, камня и метательного. Пулю щит не держит.</li>\n</ul>\n<p>Всё это уже посчитано в карточках ран.</p>\n<h5 id=\"карточки-ран-1\">Карточки ран</h5>\n<p>Ступень раны готова для каждой брони и точки прицела: <strong>Попадание / Пробой</strong>. Обозначения: Л — Лёгкая, Т — Тяжёлая, К — Калечащая, С — Смертельная, «—» — не ранит.</p>\n<ul>\n<li><strong>Ноги:</strong> любая рана — ещё и Хромота.</li>\n<li><strong>Щит</strong> против стрелы, болта, картечи и камня — рана на ступень легче. Пулю щит не держит.</li>\n<li><strong>*</strong> — только Прицельно: стрела длинного лука находит щель.</li>\n</ul>\n<p><strong>Короткий лук</strong> (база 1, стрела)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Броня</th>\n<th>Голова</th>\n<th>Корпус</th>\n<th>Ноги</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Без брони</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n</tr>\n<tr>\n<td>Стёганка</td>\n<td>Л / Т</td>\n<td>Л / Т</td>\n<td>— / Л</td>\n</tr>\n<tr>\n<td>Кольчуга</td>\n<td>— / Л</td>\n<td>— / Л</td>\n<td>— / —</td>\n</tr>\n<tr>\n<td>Латы: бронза</td>\n<td>— / —</td>\n<td>— / —</td>\n<td>— / —</td>\n</tr>\n<tr>\n<td>Латы: обычное серебро</td>\n<td>— / Т</td>\n<td>— / Т</td>\n<td>— / Л</td>\n</tr>\n<tr>\n<td>Латы: сталь, имп. серебро</td>\n<td>— / —</td>\n<td>— / —</td>\n<td>— / —</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Длинный лук</strong> (база 2, стрела)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Броня</th>\n<th>Голова</th>\n<th>Корпус</th>\n<th>Ноги</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Без брони</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>Т / К</td>\n</tr>\n<tr>\n<td>Стёганка</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n</tr>\n<tr>\n<td>Кольчуга</td>\n<td>Л / Т</td>\n<td>Л / Т</td>\n<td>— / Л</td>\n</tr>\n<tr>\n<td>Латы: бронза</td>\n<td>— / К*</td>\n<td>— / К*</td>\n<td>— / Т*</td>\n</tr>\n<tr>\n<td>Латы: обычное серебро</td>\n<td>— / К</td>\n<td>— / К</td>\n<td>— / Т</td>\n</tr>\n<tr>\n<td>Латы: сталь, имп. серебро</td>\n<td>— / К*</td>\n<td>— / К*</td>\n<td>— / Т*</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Ручной арбалет</strong> (база 1, болт)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Броня</th>\n<th>Голова</th>\n<th>Корпус</th>\n<th>Ноги</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Без брони</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n</tr>\n<tr>\n<td>Стёганка</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n</tr>\n<tr>\n<td>Кольчуга</td>\n<td>Л / Т</td>\n<td>Л / Т</td>\n<td>— / Л</td>\n</tr>\n<tr>\n<td>Латы: бронза</td>\n<td>— / Т</td>\n<td>— / Т</td>\n<td>— / Л</td>\n</tr>\n<tr>\n<td>Латы: обычное серебро</td>\n<td>— / Т</td>\n<td>— / Т</td>\n<td>— / Л</td>\n</tr>\n<tr>\n<td>Латы: сталь, имп. серебро</td>\n<td>— / Т</td>\n<td>— / Т</td>\n<td>— / Л</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Арбалет</strong> (база 2, болт)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Броня</th>\n<th>Голова</th>\n<th>Корпус</th>\n<th>Ноги</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Без брони</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>Т / К</td>\n</tr>\n<tr>\n<td>Стёганка</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>Т / К</td>\n</tr>\n<tr>\n<td>Кольчуга</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n</tr>\n<tr>\n<td>Латы: бронза</td>\n<td>— / К</td>\n<td>— / К</td>\n<td>— / Т</td>\n</tr>\n<tr>\n<td>Латы: обычное серебро</td>\n<td>— / К</td>\n<td>— / К</td>\n<td>— / Т</td>\n</tr>\n<tr>\n<td>Латы: сталь, имп. серебро</td>\n<td>— / К</td>\n<td>— / К</td>\n<td>— / Т</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Пистоль</strong> (база 2, пуля)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Броня</th>\n<th>Голова</th>\n<th>Корпус</th>\n<th>Ноги</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Без брони</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>Т / К</td>\n</tr>\n<tr>\n<td>Стёганка</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>Т / К</td>\n</tr>\n<tr>\n<td>Кольчуга</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>Т / К</td>\n</tr>\n<tr>\n<td>Латы: бронза</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n</tr>\n<tr>\n<td>Латы: обычное серебро</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n</tr>\n<tr>\n<td>Латы: сталь, имп. серебро</td>\n<td>— / —</td>\n<td>— / —</td>\n<td>— / —</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Пищаль, мушкет</strong> (база 3, пуля)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Броня</th>\n<th>Голова</th>\n<th>Корпус</th>\n<th>Ноги</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Без брони</td>\n<td>С / С</td>\n<td>С / С</td>\n<td>К / С</td>\n</tr>\n<tr>\n<td>Стёганка</td>\n<td>С / С</td>\n<td>С / С</td>\n<td>К / С</td>\n</tr>\n<tr>\n<td>Кольчуга</td>\n<td>С / С</td>\n<td>С / С</td>\n<td>К / С</td>\n</tr>\n<tr>\n<td>Латы: бронза</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>Т / К</td>\n</tr>\n<tr>\n<td>Латы: обычное серебро</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>Т / К</td>\n</tr>\n<tr>\n<td>Латы: сталь, имп. серебро</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Мушкетон</strong> (база 2, картечь)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Броня</th>\n<th>Голова</th>\n<th>Корпус</th>\n<th>Ноги</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Без брони</td>\n<td>К / С</td>\n<td>Т / К</td>\n<td>Т / К</td>\n</tr>\n<tr>\n<td>Стёганка</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n<td>Л / Т</td>\n</tr>\n<tr>\n<td>Кольчуга</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n<td>Л / Т</td>\n</tr>\n<tr>\n<td>Латы: бронза</td>\n<td>— / —</td>\n<td>— / —</td>\n<td>— / —</td>\n</tr>\n<tr>\n<td>Латы: обычное серебро</td>\n<td>— / —</td>\n<td>— / —</td>\n<td>— / —</td>\n</tr>\n<tr>\n<td>Латы: сталь, имп. серебро</td>\n<td>— / —</td>\n<td>— / —</td>\n<td>— / —</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Праща</strong> (база 1, камень)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Броня</th>\n<th>Голова</th>\n<th>Корпус</th>\n<th>Ноги</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Без брони</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n<td>Л / Т</td>\n</tr>\n<tr>\n<td>Стёганка</td>\n<td>Л / Т</td>\n<td>— / Л</td>\n<td>— / Л</td>\n</tr>\n<tr>\n<td>Кольчуга</td>\n<td>Л / Т</td>\n<td>— / Л</td>\n<td>— / Л</td>\n</tr>\n<tr>\n<td>Латы: бронза</td>\n<td>— / Л</td>\n<td>— / —</td>\n<td>— / —</td>\n</tr>\n<tr>\n<td>Латы: обычное серебро</td>\n<td>— / Л</td>\n<td>— / —</td>\n<td>— / —</td>\n</tr>\n<tr>\n<td>Латы: сталь, имп. серебро</td>\n<td>— / —</td>\n<td>— / —</td>\n<td>— / —</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Дротик (сулица)</strong> (база 2)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Броня</th>\n<th>Голова</th>\n<th>Корпус</th>\n<th>Ноги</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Без брони</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>Т / К</td>\n</tr>\n<tr>\n<td>Стёганка</td>\n<td>К / С</td>\n<td>К / С</td>\n<td>Т / К</td>\n</tr>\n<tr>\n<td>Кольчуга</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n</tr>\n<tr>\n<td>Латы</td>\n<td>— / —</td>\n<td>— / —</td>\n<td>— / —</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Плюмбата</strong> (база 1)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Броня</th>\n<th>Голова</th>\n<th>Корпус</th>\n<th>Ноги</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Без брони</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n</tr>\n<tr>\n<td>Стёганка</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n</tr>\n<tr>\n<td>Кольчуга</td>\n<td>Л / Т</td>\n<td>Л / Т</td>\n<td>— / Л</td>\n</tr>\n<tr>\n<td>Латы</td>\n<td>— / —</td>\n<td>— / —</td>\n<td>— / —</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Метательный топор</strong> (база 2)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Броня</th>\n<th>Голова</th>\n<th>Корпус</th>\n<th>Ноги</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Без брони</td>\n<td>К / С</td>\n<td>Т / К</td>\n<td>Т / К</td>\n</tr>\n<tr>\n<td>Стёганка</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n<td>Л / Т</td>\n</tr>\n<tr>\n<td>Кольчуга</td>\n<td>Л / Т</td>\n<td>— / Л</td>\n<td>— / Л</td>\n</tr>\n<tr>\n<td>Латы</td>\n<td>— / —</td>\n<td>— / —</td>\n<td>— / —</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Метательный нож</strong> (база 1)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Броня</th>\n<th>Голова</th>\n<th>Корпус</th>\n<th>Ноги</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Без брони</td>\n<td>Т / К</td>\n<td>Т / К</td>\n<td>Л / Т</td>\n</tr>\n<tr>\n<td>Стёганка</td>\n<td>Л / Т</td>\n<td>Л / Т</td>\n<td>— / Л</td>\n</tr>\n<tr>\n<td>Кольчуга</td>\n<td>— / Л</td>\n<td>— / Л</td>\n<td>— / —</td>\n</tr>\n<tr>\n<td>Латы</td>\n<td>— / —</td>\n<td>— / —</td>\n<td>— / —</td>\n</tr>\n</tbody>\n</table></div>\n<p>Карточка гранаты — в разделе «Граната».</p>\n<h4 id=\"часть-5.-ресурсы\">Часть 5. Ресурсы</h4>\n<h5 id=\"выносливость-в-дальнем-бою\">Выносливость в дальнем бою</h5>\n<p>Бег под обстрелом утомляет, и это видно в ближнем бою, когда бегущий добежит. Траты идут из той же Выносливости, что и в ближнем бою (см. «15.6 Последствия»: Изнемог).</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Действие</th>\n<th>Выносливость</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Бег, перебежка, уклон (Сместиться)</td>\n<td>0,5 за такт</td>\n</tr>\n<tr>\n<td>Шаг — на четверть такта вперёд; стрелок читает его как Перехватить</td>\n<td>бесплатно</td>\n</tr>\n<tr>\n<td>Лечь, спрятаться, стоять</td>\n<td>бесплатно</td>\n</tr>\n<tr>\n<td>Выстрел из длинного лука</td>\n<td>0,5</td>\n</tr>\n<tr>\n<td>Выстрел из короткого лука</td>\n<td>бесплатно</td>\n</tr>\n<tr>\n<td>Бросок метательного</td>\n<td>0,5</td>\n</tr>\n<tr>\n<td>Держать натянутый лук</td>\n<td>0,5 за такт</td>\n</tr>\n<tr>\n<td>Взвести арбалет рычагом</td>\n<td>0,5; воротом — бесплатно</td>\n</tr>\n<tr>\n<td>Огнестрел: выстрел и перезарядка</td>\n<td>бесплатно</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Опциональное правило, обычно используется: Рывок дальше.</strong> Бег или перебежка с Ритмом Рывок продвигает на четверть такта дальше и стоит ещё 0,5 Выносливости (бег Рывком — 1 за такт, как Удар в ближнем бою). Это выбор между скоростью и дыханием.</p>\n<h5 id=\"осечка-нагар-дождь\">Осечка, нагар, дождь</h5>\n<p><strong>Кость замка.</strong> К каждому выстрелу из огнестрела бросается один d6 другого цвета — даже если пул не бросают (Впритирку). На <strong>1</strong> выстрела нет: заряд остаётся в стволе, подсыпать на полку — такт без выстрела.</p>\n<p>Каждая беда расширяет осечку на одну грань:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Беда</th>\n<th>Осечка на</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Чистый сухой ствол</td>\n<td>1</td>\n</tr>\n<tr>\n<td>Нагар: 3 выстрела и больше без чистки (чистка — сцена)</td>\n<td>+1 грань</td>\n</tr>\n<tr>\n<td>Сырость: туман, брод, отсыревший порох</td>\n<td>+1 грань</td>\n</tr>\n<tr>\n<td>Дождь (кремнёвый замок)</td>\n<td>+2 грани</td>\n</tr>\n</tbody>\n</table></div>\n<p>Беды складываются: кремнёвый с нагаром под дождём осекается на 1–4. <strong>Фитильный под открытым дождём не стреляет</strong> — фитиль гаснет; под навесом или плащом — как сырость.</p>\n<p>Работа мастера снимает грани: «Чистый ствол» — за нагар, «Сухой замок» — за дождь и сырость. Осечка сигильного ствола — бросок d100 по таблице фазовых прорывов (см. «Магия на оружии»).</p>\n<p><strong>Опциональное правило: нагар тормозит заряжание.</strong> Вместо грани осечки: каждый третий выстрел без чистки — перезарядка на такт дольше.</p>\n<p><strong>Опциональное правило: осечка от руки стрелка.</strong> Вместо кости замка: осечка — бросок Стрельбы без единого успеха. Новичок осекается часто, мастер почти никогда; при Впритирку куба нет — нет и осечки.</p>\n<p><strong>Опциональное правило: без осечек.</strong> Кости замка нет; осекаются только в дождь и сырость (кремнёвый — на 1–2 и 1–3 по таблице, бросок только тогда).</p>\n<h5 id=\"колчан-и-заряды\">Колчан и заряды</h5>\n<p><strong>В бою стрелы не считают.</strong> Сноп в 24 стрелы в одном бою не кончается: раньше кончается Выносливость.</p>\n<p><strong>Запас — ступенями:</strong> полон → початый → пуст.</p>\n<ul>\n<li>Бой, в котором стрелок выстрелил 6 раз и больше, опускает колчан на ступень.</li>\n<li>Огнестрел: перевязь на 12 зарядов; бой с 3 выстрелами и больше — ступень вниз.</li>\n<li>Собрать стрелы после боя или пополнить запас — сцена, ступень вверх.</li>\n<li>С пустым колчаном не стреляют.</li>\n</ul>\n<p>Метательное (дротики, ножи, топоры) считают поштучно: их 1–3.</p>\n<h4 id=\"часть-6.-группа\">Часть 6. Группа</h4>\n<h5 id=\"залп\">Залп</h5>\n<p>Несколько стрелков с одинаковым оружием бьют одну цель в один такт — это <strong>один выстрел</strong>: Темп, Упреждение и Прицел выбирает старший, бросок — пул лучшего стрелка. Сверху бонус к S:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Стрелков в залпе</th>\n<th>Бонус к S</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2–3</td>\n<td>+1</td>\n</tr>\n<tr>\n<td>4–5</td>\n<td>+2</td>\n</tr>\n<tr>\n<td>6 и больше</td>\n<td>+3</td>\n</tr>\n</tbody>\n</table></div>\n<p>Разное оружие — разные залпы. Залп по группе — стрелки делят цели, по каждой цели свой залп.</p>\n<p><strong>Точный режим (опционально):</strong> каждый стрелок выбирает и бросает сам.</p>\n<h5 id=\"прикрытие\">Прикрытие</h5>\n<p>Новой механики нет — работают Держать и «по открытому».</p>\n<ul>\n<li><strong>Держать на укрытие врага:</strong> стрелок целится туда, откуда враг может высунуться. Высунулся и стреляет в держащего — Перестрелка. Высунулся и стреляет в другого — держащий бьёт его «по открытому» (S = +1 + Упреждение против Ритма) сразу после его выстрела.</li>\n<li><strong>Залп по укрытию</strong> даёт Давление один раз: Давление оружия (стрелы +1, огнестрел +3) плюс бонус залпа (+1 / +2 / +3). Пять мушкетов по одной телеге — +5, а не +15.</li>\n</ul>\n<h5 id=\"подавление\">Подавление</h5>\n<p><strong>Огонь по укрытию.</strong> Выстрел в того, кто спрятался за укрытием, не ранит, но даёт ему Давление, без броска: стрела или болт — <strong>+1</strong>, огнестрел — <strong>+3</strong> (грохот, дым, щепа). Выстрел или заряд тратится. Дальше работают Давление и Воля (см. «15.6 Последствия»): кто долго прячется под огнём, ломается — Дрогнул, бегство, сдача.</p>\n<h5 id=\"стрельба-в-свалку\">Стрельба в свалку</h5>\n<p>Цель рубится с кем-то (дистанция рубки) — значит, вокруг неё свалка. Промах по такой цели уходит в свалку и <strong>ищет неудачника</strong>: достаётся самому неудачливому из тех, кто рубится рядом с целью (свой или чужой — решает Удача; при равной — жребий). Саму цель промах не находит.</p>\n<ul>\n<li><strong>Брешь</strong> — неудачник получает Попадание в корпус по карточке оружия.</li>\n<li><strong>Мимо</strong> — неудачнику +1 Давления: стрела свистнула у самого уха.</li>\n</ul>\n<p><strong>Опциональное правило: жестокая свалка.</strong> Попадание неудачнику даёт и Мимо, и Брешь.</p>\n<h5 id=\"граната\">Граната</h5>\n<ul>\n<li><strong>Бросок.</strong> Поджечь и бросить — такт. Бросают Стрельбу против сложности: Близко 1, Средне 2. Кубы цели не бросают.</li>\n<li><strong>Недобор</strong> — недолёт или перелёт: граната рвётся в стороне, всем рядом с целью +1 Давления.</li>\n<li><strong>Критический провал</strong> (ни одного успеха и две единицы; на d4 — три) — граната падает у ног бросающего.</li>\n<li><strong>Беда ищет неудачника.</strong> При недоборе у бросающего с Удачей Ужасно и ниже граната падает у его ног. Это исход, а не бросок: Удача кости не трогает (см. «03 Удача»).</li>\n<li><strong>Разрыв</strong> — в конце такта. Каждый рядом с местом падения (та же схватка, около 3 м) получает ярус по своему Отклику:</li>\n</ul>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Отклик</th>\n<th>Ярус</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Сместиться — отпрыгнул, отбежал</td>\n<td>Мимо</td>\n</tr>\n<tr>\n<td>Укрыться — лёг, за низким укрытием, под щитом</td>\n<td>Впритирку</td>\n</tr>\n<tr>\n<td>Перехватить, стоял, бил другого</td>\n<td>Попадание</td>\n</tr>\n</tbody>\n</table></div>\n<ul>\n<li><strong>Точный бросок:</strong> хотя бы один успех сверх сложности поднимает ярус всем на одну ступень (больше не бывает): граната легла под ноги. Пробой ещё и сбивает с ног (Сбит). Отпрыгнувшего точный бросок только пугает (Впритирку).</li>\n<li><strong>В свалке</strong> Отклик рубящихся берётся из их действия (как для стрельбы, ружьё 13): Удар и Встречный — «стоял, бил», Щит и Парирование — Укрыться, Уклонение и Манёвр — Сместиться. Свои в радиусе получают то же, что чужие.</li>\n<li><strong>Давление:</strong> каждый, кто был рядом и не ранен, получает +3 (как огонь из огнестрела по укрытию).</li>\n<li><strong>Укрытие.</strong> Низкое от гранаты не прячет: спрятавшийся за ним считается Укрывшимся. За высокое укрытие и в дом граната попадает только через проём (окно, дверь): сложность +1.</li>\n</ul>\n<p><strong>Граната</strong> (база 2, осколки; место не выбирают — считается корпус)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Броня</th>\n<th>Попадание / Пробой</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Без брони</td>\n<td>Т / К</td>\n</tr>\n<tr>\n<td>Стёганка</td>\n<td>Л / Т</td>\n</tr>\n<tr>\n<td>Кольчуга</td>\n<td>Л / Т</td>\n</tr>\n<tr>\n<td>Латы</td>\n<td>— / —</td>\n</tr>\n</tbody>\n</table></div>\n<p>Щит укрывшемуся — рана на ступень легче.</p>\n<h4 id=\"часть-7.-оружие\">Часть 7. Оружие</h4>\n<h5 id=\"профили-стрелкового-оружия\">Профили стрелкового оружия</h5>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Оружие</th>\n<th>Навык</th>\n<th>Своя полоса</th>\n<th>Перезарядка, тактов</th>\n<th>Выносливость</th>\n<th>База</th>\n<th>Снаряд</th>\n<th>Особое</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Короткий лук</td>\n<td>Стрельба (Т)</td>\n<td>Средне</td>\n<td>каждый такт</td>\n<td>—</td>\n<td>1</td>\n<td>стрела</td>\n<td>—</td>\n</tr>\n<tr>\n<td>Длинный лук</td>\n<td>Стрельба (Т)</td>\n<td>Далеко</td>\n<td>через такт</td>\n<td>0,5 за выстрел</td>\n<td>2</td>\n<td>стрела</td>\n<td>щель лат: Прицельно и Пробой</td>\n</tr>\n<tr>\n<td>Ручной арбалет</td>\n<td>Стрельба (Л)</td>\n<td>Близко</td>\n<td>1</td>\n<td>—</td>\n<td>1</td>\n<td>болт</td>\n<td>можно держать взведённым</td>\n</tr>\n<tr>\n<td>Арбалет</td>\n<td>Стрельба (Л)</td>\n<td>Далеко</td>\n<td>4 рычагом или 8 воротом</td>\n<td>рычаг 0,5 за взвод</td>\n<td>2</td>\n<td>болт</td>\n<td>можно держать взведённым; щель лат на Пробой любым Темпом</td>\n</tr>\n<tr>\n<td>Пистоль</td>\n<td>Стрельба (Л)</td>\n<td>Близко</td>\n<td>6</td>\n<td>—</td>\n<td>2</td>\n<td>пуля</td>\n<td>стреляет и в ближнем бою</td>\n</tr>\n<tr>\n<td>Пищаль (фитильная)</td>\n<td>Стрельба (Л)</td>\n<td>Средне</td>\n<td>8</td>\n<td>—</td>\n<td>3</td>\n<td>пуля</td>\n<td>фитиль</td>\n</tr>\n<tr>\n<td>Мушкет</td>\n<td>Стрельба (Л)</td>\n<td>Далеко</td>\n<td>10 фитильный (с сошкой, Навскидку нельзя) или 6 кремнёвый</td>\n<td>—</td>\n<td>3</td>\n<td>пуля</td>\n<td>—</td>\n</tr>\n<tr>\n<td>Мушкетон</td>\n<td>Стрельба (Л)</td>\n<td>Близко</td>\n<td>8</td>\n<td>—</td>\n<td>2</td>\n<td>картечь</td>\n<td>картечь прощает упреждение (−1 слоя Упреждения становится 0)</td>\n</tr>\n<tr>\n<td>Праща</td>\n<td>Стрельба (Т)</td>\n<td>Средне</td>\n<td>1</td>\n<td>—</td>\n<td>1</td>\n<td>камень (дробящий)</td>\n<td>попадание в голову оглушает: следующий такт −1 к S</td>\n</tr>\n<tr>\n<td>Дротики (сулица)</td>\n<td>Стрельба (Т)</td>\n<td>Близко</td>\n<td>каждый такт, запас 3</td>\n<td>0,5 за бросок</td>\n<td>2</td>\n<td>дротик (колющий)</td>\n<td>вязнет в щите</td>\n</tr>\n<tr>\n<td>Плюмбата</td>\n<td>Стрельба (Т)</td>\n<td>Средне</td>\n<td>каждый такт, запас до 5 (во внутренней стороне щита)</td>\n<td>0,5 за бросок</td>\n<td>1</td>\n<td>дротик (колющий)</td>\n<td>—</td>\n</tr>\n<tr>\n<td>Метательный топор</td>\n<td>Стрельба (Т)</td>\n<td>Близко</td>\n<td>запас 1</td>\n<td>0,5 за бросок</td>\n<td>2</td>\n<td>рубящий</td>\n<td>—</td>\n</tr>\n<tr>\n<td>Метательные ножи</td>\n<td>Стрельба (Т)</td>\n<td>Близко</td>\n<td>каждый такт, запас 3</td>\n<td>0,5 за бросок</td>\n<td>1</td>\n<td>колющий</td>\n<td>—</td>\n</tr>\n<tr>\n<td>Штуцер (нарезной)</td>\n<td>Стрельба (Л)</td>\n<td>Далеко</td>\n<td>12</td>\n<td>—</td>\n<td>3</td>\n<td>пуля</td>\n<td>Прицельно +1 к S; редкий и дорогой</td>\n</tr>\n<tr>\n<td>Двуствольный пистоль</td>\n<td>Стрельба (Л)</td>\n<td>Близко</td>\n<td>10 (оба ствола)</td>\n<td>—</td>\n<td>2</td>\n<td>пуля</td>\n<td>два выстрела до перезарядки, по одному за такт</td>\n</tr>\n<tr>\n<td>Крепостное ружьё [набросок]</td>\n<td>Стрельба (Л)</td>\n<td>Далеко</td>\n<td>12</td>\n<td>—</td>\n<td>4</td>\n<td>пуля</td>\n<td>только с упора (сошка, стена); сталь и императорское серебро держат −1</td>\n</tr>\n<tr>\n<td>«Утиная лапа» [набросок]</td>\n<td>Стрельба (Л)</td>\n<td>Близко</td>\n<td>12</td>\n<td>—</td>\n<td>2</td>\n<td>пуля</td>\n<td>залп веером: до трёх соседних целей в одной схватке, каждая как выстрел пистоля с −1</td>\n</tr>\n<tr>\n<td>Ручная граната</td>\n<td>Стрельба (Т)</td>\n<td>Близко</td>\n<td>поджечь и бросить — такт</td>\n<td>0,5 за бросок</td>\n<td>2</td>\n<td>осколки</td>\n<td>см. «Граната»</td>\n</tr>\n<tr>\n<td>Ручная мортирка [набросок]</td>\n<td>Стрельба (Л)</td>\n<td>Средне</td>\n<td>8</td>\n<td>—</td>\n<td>2</td>\n<td>граната</td>\n<td>мечет гранату: сложность броска Средне 1, Далеко 2</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Вязнет в щите.</strong> Дротик, давший щитоносцу Впритирку или выше, застревает в щите. Пока он там, щит бесполезен: не режет рану, не даёт Укрытия в рубке, под ним нельзя Укрыться. Бросить щит — свободно, выдернуть дротик — такт без Удара.</p>\n<p><strong>Метательное вплотную.</strong> На дистанции рубки дротик не мечут, а колют им как коротким копьём; топор и нож — по карточкам топора и кинжала.</p>\n<p><strong>«Широкий раструб»</strong> (работа мастера) даёт мушкетону ещё +1 к S на полосе Близко, всего +2.</p>\n<h5 id=\"магия-на-оружии\">Магия на оружии</h5>\n<p><strong>Работа мастера</strong> — магия ремесла, без риска:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Тег</th>\n<th>Что даёт</th>\n<th>Какому оружию</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Верный бой</td>\n<td>своя полоса на одну дальше: штраф дальности начинается на полосу позже</td>\n<td>лук, арбалет, огнестрел</td>\n</tr>\n<tr>\n<td>Лёгкий заряд</td>\n<td>перезарядка на такт короче</td>\n<td>арбалет, огнестрел</td>\n</tr>\n<tr>\n<td>Чистый ствол</td>\n<td>нет грани осечки за нагар</td>\n<td>огнестрел</td>\n</tr>\n<tr>\n<td>Сухой замок</td>\n<td>нет граней осечки за дождь и сырость; фитильный под дождём стреляет, как в сырость</td>\n<td>огнестрел</td>\n</tr>\n<tr>\n<td>Широкий раструб</td>\n<td>ещё +1 к S на полосе Близко</td>\n<td>мушкетон</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Сигильная работа</strong> — зачарование, армейское серийное или индивидуальное дорогое. Риск: когда сигильный ствол даёт осечку (кость замка), бросают d100 по таблице фазовых прорывов. У сигильного лука и арбалета прорыв вызывает критический провал броска.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Тег</th>\n<th>Что даёт</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Разрывной</td>\n<td>+1 к счёту раны; сосед цели получает +1 Давления, на Пробое — ещё и Лёгкую рану</td>\n</tr>\n<tr>\n<td>Фазовый ствол</td>\n<td>укрытие на ступень слабее против его выстрелов: поправка высунувшемуся на 1 лучше, но не выше 0 (высокое 0, бойница −1)</td>\n</tr>\n<tr>\n<td>Второй заряд</td>\n<td>сигил держит ещё один выстрел, как второй ствол</td>\n</tr>\n<tr>\n<td>Картечный ствол</td>\n<td>ствол можно зарядить картечью: выстрел по правилам мушкетона (картечь прощает упреждение, без +1 за корпус, кольчуга −1), база ствола</td>\n</tr>\n<tr>\n<td>Прошивающий</td>\n<td>пуля идёт дальше по линии: каждый за целью на линии выстрела (в колонне, в строю) получает тот же ярус, рана — по своей броне; пуля проходит всех бездоспешных и останавливается на третьем латнике</td>\n</tr>\n<tr>\n<td>Пуля души</td>\n<td>бьёт нежить и духов по душе (глава о нежити)</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Сигильные боеприпасы</strong> — разовые стрелы, болты и пули, дорогие:</p>\n<ul>\n<li><strong>разрывные</strong> — Разрывной на один выстрел;</li>\n<li><strong>фазовые</strong> — только из фазового ствола: укрытие и щит не помогают вовсе. По спрятавшемуся можно стрелять, если знаешь, где он, — как по стоящему, без поправки укрытия; щит не режет рану. Из обычного ствола фазовая пуля — обычная;</li>\n<li><strong>зажигательные</strong> — когда появятся правила огня.</li>\n</ul>\n<h4 id=\"часть-8.-опциональные-правила\">Часть 8. Опциональные правила</h4>\n<p>Основа книги — правила выше. Эти варианты стол включает по вкусу; у каждого есть числа в заметках.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Правило</th>\n<th>Что меняет</th>\n<th>Где</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Рывок дальше (обычно используется)</td>\n<td>бег Рывком — на ¼ такта дальше за +0,5 Выносливости</td>\n<td>«Выносливость в дальнем бою»</td>\n</tr>\n<tr>\n<td>Осечка от руки стрелка</td>\n<td>осечка — бросок Стрельбы без успехов, вместо кости замка</td>\n<td>«Осечка, нагар, дождь»</td>\n</tr>\n<tr>\n<td>Без осечек</td>\n<td>осечки только в дождь и сырость</td>\n<td>«Осечка, нагар, дождь»</td>\n</tr>\n<tr>\n<td>Нагар тормозит заряжание</td>\n<td>каждый третий выстрел без чистки — перезарядка +1 такт, вместо грани осечки</td>\n<td>«Осечка, нагар, дождь»</td>\n</tr>\n<tr>\n<td>Жестокая свалка</td>\n<td>Мимо по свалке тоже даёт неудачнику Попадание</td>\n<td>«Стрельба в свалку»</td>\n</tr>\n<tr>\n<td>Точный залп</td>\n<td>каждый стрелок залпа выбирает и бросает сам</td>\n<td>«Залп»</td>\n</tr>\n<tr>\n<td>Ложная перебежка</td>\n<td>цель открыто показывает Ритм; упреждение под него при другом Ритме — S −1</td>\n<td>«Чтение стрелка»</td>\n</tr>\n<tr>\n<td>Сверху Выждать +1</td>\n<td>принято, но ценность не проверена полной моделью</td>\n<td>«Угол, обход, высота, видимость»</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"как-это-выглядит-5\">Как это выглядит</h4>\n<ul>\n<li><strong>Прицельно в голову:</strong> щитоносец пригнулся под щит, над кромкой виден один шлем. Стрела находит щель между шлемом и краем.</li>\n<li><strong>Навскидку на срыв в ноги:</strong> бегущий рванул вбок, стрела догнала его в бедро, и он упал на колено.</li>\n<li><strong>По ходу в корпус:</strong> бежал ровно — ровно и получил.</li>\n<li><strong>Мимо:</strong> стрелок бил «в точку», туда, где враг стоял, а тот уже сорвался с места.</li>\n<li><strong>Залечь:</strong> арбалетчик вскинул арбалет — бегущий падает в траву и ждёт, пока болт уйдёт в сторону или стрелок опустит оружие.</li>\n<li><strong>Шагом под стрелами:</strong> латник в кольчуге не бежит, а идёт, — бережёт дыхание для рубки. Лучник успевает выстрелить лишний раз, но до мечей латник доходит свежим.</li>\n<li><strong>Осечка:</strong> курок щёлкнул, на полке пыхнуло — выстрела нет. Мушкетёр сыплет порох на полку, а бегущий съедает дистанцию. В дождь кремнёвые прячут замки под полы плащей, фитильщики берутся за клинки.</li>\n<li><strong>Подавление:</strong> арбалетчик прижался за телегой. Стрелы раз за разом стучат в борт, щепа летит в лицо. Он не ранен, но после десятой стрелы бросает арбалет и бежит в лес. Мушкетная пуля, выбившая кусок бруса у самой головы, стоит трёх таких стрел.</li>\n<li><strong>Колчан:</strong> после стычки лучник ходит по полю, выдёргивает стрелы из земли и щитов, половина сломана. Ко второму бою за день в колчане шуршит пучок, а не сноп.</li>\n<li><strong>Стрельба в свалку:</strong> лучник бьёт в спину врагу, который рубится с его товарищем. Враг дёрнулся — и стрела вошла товарищу под ключицу.</li>\n<li><strong>Прикрытие:</strong> «Иди, я держу его!» Мушкетёр лёг на бруствер и целит в край забора. Товарищ бежит вдоль ограды. Из-за забора высовывается ствол — и тут же падает.</li>\n<li><strong>Ждать до белков глаз:</strong> у мушкетёра один выстрел, и вблизи он вернее. Мушкетёр не тратит его на лежащего вдалеке и ждёт последнего броска, когда лечь уже некуда.</li>\n</ul>\n<hr />\n<hr />\n"}, {"id": "глава-17.-твари", "title": "Глава 17. Твари", "html": "<hr />\n<h4 id=\"тварь--тот-же-боец\">Тварь — тот же боец</h4>\n<p>Тварь дерётся по тем же правилам, что и человек: такт, Интенты, матрица, кубы, раны. Отдельной системы боя для тварей нет. Всё, что у твари иначе, записано в её <strong>карточке</strong>: природное оружие, шкура, размер, природа, повадка и теги. Это тот же принцип, что у оружия: карточка сужает меню и ломает правила в отдельных точках.</p>\n<h4 id=\"карточка-твари\">Карточка твари</h4>\n<ul>\n<li><strong>Характеристики и навыки</strong> — как у бойца: Телосложение (кость), боевой навык (кубы удара), Атлетика (Уклонение, Манёвр, Борьба), Личность (Воля, если она есть).</li>\n<li><strong>Природное оружие</strong> — строки, как у оружия: укус (Колющий), когти (Рубящий), рога (Колющий), таран или копыта (Дробящий). У каждой строки своя база раны.</li>\n<li><strong>Защита</strong> — обычно только Уклонение: зверь не парирует.</li>\n<li><strong>Шкура</strong> — броня по типу удара, как стёганка или кольчуга.</li>\n<li><strong>Размер</strong> — см. ниже.</li>\n<li><strong>Природа</strong> — что у твари с болью, усталостью и страхом.</li>\n<li><strong>Повадка</strong> — 2–4 действия, которые тварь делает чаще всего.</li>\n<li><strong>Теги</strong> — каждый меняет одно правило.</li>\n</ul>\n<h4 id=\"размер\">Размер</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Размер</th>\n<th>Пример</th>\n<th>Броня тела</th>\n<th>Что ещё</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Мелкий</td>\n<td>каймур</td>\n<td>0</td>\n<td>удар в Низ +1, в Верх −1 (см. тег «Мелкий»); в Борьбе −1 куб против человека</td>\n</tr>\n<tr>\n<td>Человек</td>\n<td>тиньгой, сюпсю в трупе</td>\n<td>0</td>\n<td>ничего</td>\n</tr>\n<tr>\n<td>Крупный</td>\n<td>баргест, кабан</td>\n<td>1</td>\n<td>в Борьбе +1 куб за каждую ступень размера сверх противника</td>\n</tr>\n<tr>\n<td>Огромный</td>\n<td>тур</td>\n<td>2</td>\n<td>Парирование и Щит его удар не держат, только Уклонение и Манёвр. Захвата и Борьбы с ним нет: Сцепка ничего не даёт. Голова в досягаемости, только когда он бьёт сам: удар в Верх по Огромному получает −2, кроме Обмена и контратаки. Удар Огромного «сметает» (см. теги)</td>\n</tr>\n<tr>\n<td>Исполин</td>\n<td>пока нет</td>\n<td>3</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Броня тела</strong> вычитается из счёта любой раны после шкуры. Поэтому тура мечом почти не ранить: рубящий удар его шкура и тело гасят целиком, а укол в бок даёт лишь Лёгкую. Нужны копья, Пробои, раны в ноги и численность.</p>\n<h4 id=\"природа\">Природа</h4>\n<p>Природа записана в карточке каждой твари отдельно:</p>\n<ul>\n<li><strong>Боль:</strong> есть или нет. Без боли нет «стерпеть» и нет Давления от ран.</li>\n<li><strong>Усталость:</strong> есть или нет. Без неё нет Выносливости и Изнеможения.</li>\n<li><strong>Воля:</strong> число или «нет». Зверь копит Давление, как человек: раненый бежит. Разумная тварь понимает обстановку: отступает, хитрит, ждёт подмоги.</li>\n</ul>\n<h4 id=\"повадка\">Повадка</h4>\n<p>У твари короткое меню, и ГМ выбирает из него быстро. Повадка — то, что тварь делает чаще: «баргест начинает Рывком в ноги», «тур бьёт Тяжёлым, когда видит спину». Игроки читают повадку Ставкой на кинетику. Тот, кто знает тварь, знает повадку заранее (как именно знание открывает повадку —, решается в навыках).</p>\n<h4 id=\"теги-тварей\">Теги тварей</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Тег</th>\n<th>Что меняет</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Хватка</strong></td>\n<td>Попадание укусом — и рана, и сразу Борьба, ничья у твари. Пробой — ничья даёт навал</td>\n</tr>\n<tr>\n<td><strong>Натиск</strong></td>\n<td>Тяжёлый удар с разбега: удар с шагом без −1</td>\n</tr>\n<tr>\n<td><strong>Упор против Натиска</strong></td>\n<td>пока копейщик в Заслоне Встречным, тварь с Натиском не может к нему сблизиться: ни Манёвром, ни ударом с разбега</td>\n</tr>\n<tr>\n<td><strong>Серебро</strong></td>\n<td>серебро ранит тварь на ступень тяжелее: всё серебро кармически связано с Колесом Судьбы. Тег есть у многих тварей, но не у всех</td>\n</tr>\n<tr>\n<td><strong>Две формы</strong></td>\n<td>тиньгой: бесплотный или во плоти. Бесплотного оружие не берёт совсем, серебро тоже; но и сам он ранить не может — чтобы убить, он должен облечься плотью. Смена формы — полное дело [смена формы — предложено]</td>\n</tr>\n<tr>\n<td><strong>Мелкий</strong></td>\n<td>тварь ростом по колено: её удар в Низ +1, в Верх −1 (прыжок), в Центр без поправки; и в Обмене так же, ступенью. Рана — по линии, как обычно. Бить её можно любой линией; в Борьбе человек получает +1 куб, как крупный против мелкого</td>\n</tr>\n<tr>\n<td><strong>Из-под земли</strong></td>\n<td>первый удар из засады идёт «по открытому»</td>\n</tr>\n<tr>\n<td><strong>Стая</strong></td>\n<td>звери сами заходят с Фланга и Спины по правилам Угла; без вожака стая бежит [вожак не проверен]</td>\n</tr>\n<tr>\n<td><strong>Без боли</strong></td>\n<td>нет «стерпеть», нет Давления от ран, Лёгкие не ранят</td>\n</tr>\n<tr>\n<td><strong>Без крови</strong></td>\n<td>нет кровотечений</td>\n</tr>\n<tr>\n<td><strong>Гнездо</strong></td>\n<td>раны тела твари не выводят из строя: разбитая часть тела просто хуже работает. Выводит только Тяжёлая и выше в часть тела, где гнездо</td>\n</tr>\n<tr>\n<td><strong>Чужая плоть</strong></td>\n<td>обычное оружие ранит на ступень слабее; то, что твари чуждо (серебро, огонь), — полностью</td>\n</tr>\n<tr>\n<td><strong>Сметает</strong></td>\n<td>удар Огромного задевает и того, кто зашёл к нему с Фланга: по нему — «по открытому»</td>\n</tr>\n<tr>\n<td><strong>Без рук</strong></td>\n<td>у твари нет рук: удар в Верх идёт только в голову</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"первые-карточки\">Первые карточки</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th></th>\n<th>Баргест</th>\n<th>Тур</th>\n<th>Сюпсю</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Что это</td>\n<td>инопланарный волк о пяти лапах</td>\n<td>северный зверь ростом в 3–4 человека</td>\n<td>червь, поселившийся в трупе</td>\n</tr>\n<tr>\n<td>Размер</td>\n<td>Крупный</td>\n<td>Огромный</td>\n<td>Человек</td>\n</tr>\n<tr>\n<td>Телосложение</td>\n<td>Хорошо (d12)</td>\n<td>Образцово (d16)</td>\n<td>Стандартно (d10)</td>\n</tr>\n<tr>\n<td>Боевой навык / Атлетика</td>\n<td>2 / 3</td>\n<td>2 / 1</td>\n<td>1 / 1</td>\n</tr>\n<tr>\n<td>Оружие</td>\n<td>Укус (Колющий, Хватка), Когти (Рубящий); база 2; лёгкий: +1 к Рывку</td>\n<td>Рога (Колющий), Таран (Дробящий); база 3; тяжёлый: −1 к Рывку</td>\n<td>то, что было в руке у мертвеца</td>\n</tr>\n<tr>\n<td>Своя дистанция</td>\n<td>Средняя и Ближняя</td>\n<td>Средняя и Ближняя; Натиском бьёт и с Длинной</td>\n<td>по оружию</td>\n</tr>\n<tr>\n<td>Защита</td>\n<td>Уклонение</td>\n<td>Уклонение</td>\n<td>по оружию</td>\n</tr>\n<tr>\n<td>Шкура</td>\n<td>нет</td>\n<td>как стёганка</td>\n<td>нет</td>\n</tr>\n<tr>\n<td>Природа</td>\n<td>боль есть, усталость есть, Воля по Личности (Плохо)</td>\n<td>боль, усталость, Воля — как у зверя</td>\n<td>без боли, без усталости, Воли нет</td>\n</tr>\n<tr>\n<td>Теги</td>\n<td>Хватка, Стая, Без рук</td>\n<td>Натиск, Сметает, Без рук</td>\n<td>Без боли, Без крови, Гнездо (корпус)</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Тиньгой</strong>: Человек; две формы (см. тег); во плоти дерётся как человек тем, что взял в руки; Серебро; Воля и разум есть — хитёр, отступает, когда проигрывает.</p>\n<p><strong>Каймур</strong>: Мелкий (по колено, самые большие — по пояс); Телосложение Стандартно, боевой навык 2, Атлетика 3; костяная шкура как кольчуга; Укус (Колющий, Хватка), база 1, лёгкий (+1 к Рывку); своя дистанция Ближняя и Клинч; Из-под земли, Без рук; хладнокровен — лезет к огню; ходят по нескольку. Опасен не в открытом бою, а засадой, укусом в ноги и числом: Хромота и кровотечение делают из путника лёгкую добычу.</p>\n<h4 id=\"как-это-выглядит-6\">Как это выглядит</h4>\n<ul>\n<li><strong>Тур:</strong> опустил рога для удара — и только тогда голова в досягаемости.</li>\n<li><strong>Баргест:</strong> пятая лапа даёт бросок, от которого не уйти. Он вцепляется в ногу и валит.</li>\n<li><strong>Сюпсю:</strong> рубишь мертвеца, а он идёт дальше. Пока не попадёшь в грудь, где сидит червь, он не остановится.</li>\n<li><strong>Каймур:</strong> земля у костра вспучивается — и ты уже лежишь.</li>\n<li><strong>Стая:</strong> один баргест держит тебя за ногу, второй заходит со спины.</li>\n</ul>\n<hr />\n<hr />\n"}]}, {"title": "Часть V. Снаряжение", "chapters": [{"id": "глава-18.-снаряжение-и-алхимия", "title": "Глава 18. Снаряжение и алхимия", "html": "<hr />\n<h4 id=\"колёса\">Колёса</h4>\n<p>Деньги Триархии называются <strong>Колёсами</strong> — в честь Аркана Колеса Судьбы, который помог первому императору основать Триархию.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Монета</th>\n<th>Курс</th>\n<th>Что на неё купишь</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Серебряное Колесо</strong></td>\n<td>10 бронзовых = 100 медных</td>\n<td>меч, корова, полгода хлеба на семью</td>\n</tr>\n<tr>\n<td><strong>Бронзовое Колесо</strong></td>\n<td>10 медных</td>\n<td>кинжал, хорошие сапоги, месяц угла в городе</td>\n</tr>\n<tr>\n<td><strong>Медное Колесо</strong></td>\n<td>—</td>\n<td>день работы подёнщика, обед в трактире</td>\n</tr>\n</tbody>\n</table></div>\n<p>Ориентир: довольно успешный лично зависимый крестьянин живёт на 4–5 серебряных Колёс в год, то есть на 1–2 медных в день.</p>\n<p><strong>Золота в мире немного, и драгоценным оно не считается.</strong> Ценность и символ — серебро.</p>\n<h4 id=\"уровень-цены\">Уровень цены</h4>\n<p>У каждой вещи не цена, а <strong>уровень цены</strong>.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Уровень</th>\n<th>Примерно в Колёсах</th>\n<th>Примеры</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Грош</strong></td>\n<td>меньше медного</td>\n<td>кружка пива, ночлежка, краюха хлеба</td>\n</tr>\n<tr>\n<td><strong>Медь</strong></td>\n<td>несколько медных</td>\n<td>нож, факел, простая одежда, ночь в трактире</td>\n</tr>\n<tr>\n<td><strong>Бронза</strong></td>\n<td>несколько бронзовых</td>\n<td>кинжал, копьё, стёганка, отмычки, лук</td>\n</tr>\n<tr>\n<td><strong>Серебро</strong></td>\n<td>несколько серебряных</td>\n<td>меч, арбалет, пищаль, хирургический набор, лошадь</td>\n</tr>\n<tr>\n<td><strong>Много серебра</strong></td>\n<td>десятки серебряных</td>\n<td>кольчуга, бронзовые латы, хорошая лошадь, дом</td>\n</tr>\n<tr>\n<td><strong>Состояние</strong></td>\n<td>сотни серебряных</td>\n<td>стальные латы, латы из императорского серебра, поместье</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"достаток\">Достаток</h4>\n<p>Достаток идёт от положения в обществе.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Положение</th>\n<th>Достаток</th>\n<th>Покупаешь свободно</th>\n<th>На ступень выше — трата</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Изгой</td>\n<td>Нищета</td>\n<td>Грош</td>\n<td>Медь</td>\n</tr>\n<tr>\n<td>Отребье</td>\n<td>Бедность</td>\n<td>Грош</td>\n<td>Медь</td>\n</tr>\n<tr>\n<td>Простой люд</td>\n<td>Скромно</td>\n<td>Медь</td>\n<td>Бронза</td>\n</tr>\n<tr>\n<td>Почтенный</td>\n<td>Достаток</td>\n<td>Бронза</td>\n<td>Серебро</td>\n</tr>\n<tr>\n<td>Элитарии</td>\n<td>Богатство</td>\n<td>Серебро</td>\n<td>Много серебра</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"покупка\">Покупка</h4>\n<ol>\n<li><strong>Своего уровня и ниже — свободно.</strong> Монеты не считаем.</li>\n<li><strong>На ступень выше — трата.</strong> Купить можно, но достаток падает на ступень до конца арки или пока не заработаешь.</li>\n<li><strong>На две ступени и выше — нельзя</strong> без особого источника: добычи, долга, кражи, клейма «Должник».</li>\n</ol>\n<h4 id=\"добыча\">Добыча</h4>\n<p>Найденные деньги ГМ выдаёт <strong>кошелём уровня</strong>: «кошель бронзы» — одна покупка уровня Бронза без траты. Кошели можно копить.</p>\n<h4 id=\"счёт-монет-по-желанию-стола\">Счёт монет (по желанию стола)</h4>\n<p>В таблицах снаряжения рядом с уровнем стоит примерная цена в Колёсах. Кто хочет считать, считает; кто не хочет, смотрит только на уровень.</p>\n<hr />\n<h4 id=\"оружие-1\">Оружие</h4>\n<p>Боевые свойства — в карточках оружия (<a href=\"#/4/0/оружие\" class=\"xref\">раздел 15.5 главы 15</a>). Здесь — цена, материал и право носить.</p>\n<p><strong>Материал клинка.</strong> Клинки куют в основном из бронзы, как и латы. Сталь — редкость.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Материал</th>\n<th>Правило</th>\n<th>Цена</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Бронза</strong> (обычный)</td>\n<td>Тег «Гнётся»: если в Сцепке противник бил Дробящим, клинок гнётся (−1 к S всех действий; выпрямить — такт без удара)</td>\n<td>по таблице</td>\n</tr>\n<tr>\n<td><strong>Сталь</strong> (редкость; в речи персонажей — «железо»)</td>\n<td>Не гнётся</td>\n<td>на ступень дороже</td>\n</tr>\n</tbody>\n</table></div>\n<p>Дробящее, древковое и топоры не гнутся при любом материале: тег касается только клинков.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Оружие</th>\n<th>Уровень</th>\n<th>Колёса</th>\n<th>Заметка</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Нож</td>\n<td>Медь</td>\n<td>3–5 медных</td>\n<td>инструмент, не оружие</td>\n</tr>\n<tr>\n<td>Кинжал</td>\n<td>Бронза</td>\n<td>2–3 бронзовых</td>\n<td></td>\n</tr>\n<tr>\n<td>Меч</td>\n<td>Серебро</td>\n<td>1–2 серебряных</td>\n<td>стальной — Много серебра</td>\n</tr>\n<tr>\n<td>Двуручный меч</td>\n<td>Много серебра</td>\n<td>5–8 серебряных</td>\n<td></td>\n</tr>\n<tr>\n<td>Булава</td>\n<td>Бронза</td>\n<td>5–8 бронзовых</td>\n<td></td>\n</tr>\n<tr>\n<td>Булава с шипами</td>\n<td>Серебро</td>\n<td>1 серебряное</td>\n<td></td>\n</tr>\n<tr>\n<td>Топор</td>\n<td>Медь (рабочий) / Бронза (боевой)</td>\n<td>5 медных / 3 бронзовых</td>\n<td></td>\n</tr>\n<tr>\n<td>Клевец</td>\n<td>Бронза</td>\n<td>6–8 бронзовых</td>\n<td></td>\n</tr>\n<tr>\n<td>Цеп</td>\n<td>Медь (крестьянский) / Бронза (боевой)</td>\n<td>5 медных / 4 бронзовых</td>\n<td></td>\n</tr>\n<tr>\n<td>Копьё</td>\n<td>Бронза</td>\n<td>2–4 бронзовых</td>\n<td></td>\n</tr>\n<tr>\n<td>Алебарда</td>\n<td>Бронза</td>\n<td>8 бронзовых</td>\n<td></td>\n</tr>\n<tr>\n<td>Щит</td>\n<td>Бронза</td>\n<td>2–4 бронзовых</td>\n<td></td>\n</tr>\n<tr>\n<td>Баклер</td>\n<td>Бронза</td>\n<td>3 бронзовых</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Стрелковое оружие — в <a href=\"#/4/1/глава-16.-стрельба\" class=\"xref\">главе 16</a>. Ориентиры: лук — Бронза, арбалет и пищаль — Серебро.</p>\n<p><strong>Право клинка</strong> (правило мира). Меч был знаком положения, а не только оружием.</p>\n<ul>\n<li>Меч и двуручный меч в городе открыто носят Почтенные и Элитарии, а наёмники и солдаты — с грамотой нанимателя.</li>\n<li>У Отребья и Изгоя клинок — повод для стражи: остановят, отберут, спросят, у кого украл.</li>\n<li>Топор, нож, дубина и копьё носит кто угодно: это инструмент.</li>\n</ul>\n<h4 id=\"броня-1\">Броня</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Броня</th>\n<th>Уровень</th>\n<th>Колёса</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Стёганка</td>\n<td>Бронза</td>\n<td>3–5 бронзовых</td>\n</tr>\n<tr>\n<td>Кольчуга</td>\n<td>Много серебра</td>\n<td>8–15 серебряных</td>\n</tr>\n<tr>\n<td>Латы из бронзы</td>\n<td>Много серебра</td>\n<td>20–40 серебряных</td>\n</tr>\n<tr>\n<td>Латы из обычного серебра</td>\n<td>Много серебра</td>\n<td>30–50 серебряных</td>\n</tr>\n<tr>\n<td>Латы из императорского серебра</td>\n<td>Состояние</td>\n<td>100+ серебряных</td>\n</tr>\n<tr>\n<td>Латы из стали</td>\n<td>Состояние</td>\n<td>150+ серебряных</td>\n</tr>\n<tr>\n<td>Шлем отдельно</td>\n<td>Бронза (простой) / Серебро (закрытый)</td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p>Кольчуга — годы заработка крестьянина; латы — богатство. Доспех чаще добывают, чем покупают.</p>\n<p><strong>Материал лат</strong> (боевые свойства — в 15.5 и 15.6):</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Материал</th>\n<th>Колющий</th>\n<th>Дробящий</th>\n<th>Особое</th>\n<th>Уровень</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Обычное серебро</td>\n<td>любой колющий Пробой проходит, как в щель</td>\n<td>−1</td>\n<td>—</td>\n<td>Много серебра</td>\n</tr>\n<tr>\n<td>Бронза</td>\n<td>только щель</td>\n<td>−1</td>\n<td>—</td>\n<td>Много серебра</td>\n</tr>\n<tr>\n<td>Императорское серебро</td>\n<td>только щель</td>\n<td>−2</td>\n<td>огонь отпускает его до обычного серебра</td>\n<td>Состояние</td>\n</tr>\n<tr>\n<td>Сталь</td>\n<td>только щель</td>\n<td>−2</td>\n<td>—</td>\n<td>Состояние</td>\n</tr>\n</tbody>\n</table></div>\n<p>Латы из обычного серебра дороже бронзовых, но защищают хуже: серебро — символ, в нём ходят ради статуса.</p>\n<hr />\n<h4 id=\"инструменты\">Инструменты</h4>\n<p><strong>Качество инструмента:</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Качество</th>\n<th>Правило</th>\n<th>Цена</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Без инструмента</strong></td>\n<td>Сложность +1. Где без инструмента никак (вскрыть замок, отпилить ногу) — нельзя</td>\n<td>—</td>\n</tr>\n<tr>\n<td><strong>Обычный</strong></td>\n<td>Как написано в правилах</td>\n<td>по таблице</td>\n</tr>\n<tr>\n<td><strong>Мастерский</strong></td>\n<td>+1 кость</td>\n<td>на ступень дороже</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Лимит костей:</strong> от таланта и вещи вместе — не больше +1 кости на бросок.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Набор</th>\n<th>Уровень</th>\n<th>Нужен для</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Отмычки</td>\n<td>Бронза</td>\n<td>замки (Плутовство)</td>\n</tr>\n<tr>\n<td>Сумка лекаря: бинты, отвары, нитки</td>\n<td>Медь, расходуется</td>\n<td>перевязка, «Обезболить»</td>\n</tr>\n<tr>\n<td>Хирургический набор: пилы, щипцы, иглы</td>\n<td>Серебро</td>\n<td>хирургия, «Не дать умереть»</td>\n</tr>\n<tr>\n<td>Инструменты ремесла: кузнечный, плотницкий, кожевенный</td>\n<td>Бронза (походный) / Серебро (мастерская)</td>\n<td>«Полевой ремонт», изготовление</td>\n</tr>\n<tr>\n<td>Алхимическая посуда: реторта, перегонный куб, ступка</td>\n<td>Серебро</td>\n<td>«Склянки»</td>\n</tr>\n<tr>\n<td>Писчий набор: перо, чернила, бумага, сургуч</td>\n<td>Бронза</td>\n<td>письмо, «Подделка»</td>\n</tr>\n<tr>\n<td>Грим и чужая одежда</td>\n<td>Бронза</td>\n<td>маскировка, «Чужое лицо»</td>\n</tr>\n<tr>\n<td>Верёвка, кошка, крюки</td>\n<td>Медь</td>\n<td>лазание</td>\n</tr>\n<tr>\n<td>Фонарь, огниво, факелы</td>\n<td>Медь</td>\n<td>свет</td>\n</tr>\n<tr>\n<td>Капканы</td>\n<td>Медь</td>\n<td>охота, «Засека»</td>\n</tr>\n<tr>\n<td>Палатка, котёл, одеяла</td>\n<td>Бронза</td>\n<td>ночлег (до блока «Выживание»)</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Расход без счёта.</strong></p>\n<ul>\n<li><strong>Не расходуется:</strong> отмычки, хирургический набор, инструменты, посуда. Ломаются только по сюжету: ГМ может сломать их при крите противника или провале с катастрофой.</li>\n<li><strong>Расходуется:</strong> сумка лекаря, факелы, грим, чернила. После тяжёлой сцены (бой с ранеными, долгий спуск в подземелье) ГМ говорит «сумка пуста». Пополнить — по уровню цены.</li>\n</ul>\n<hr />\n<h4 id=\"алхимия-смертных\">Алхимия смертных</h4>\n<p>Алхимики расцвели вместе с приходом магии в мир: магия породила множество невиданных растений, а самые ценные ингредиенты дают инопланарные твари. Склянки варят смертные: это знание рук и книг, а не магия. Сильные склянки меняют тело и оставляют на нём след.</p>\n<p><strong>Кто варит:</strong></p>\n<ul>\n<li><strong>снадобья</strong> — любой с Врачеванием 1;</li>\n<li><strong>эликсиры</strong> — с талантом «Склянки» (Врачевание 2);</li>\n<li><strong>мутагены</strong> — «Склянки» и Врачевание 3;</li>\n<li>с талантом «Теория алхимии» (Учёность 3, специализация «алхимия») всё это можно варить от Учёности;</li>\n<li><strong>яды</strong> — Врачевание со специализацией «яды».</li>\n</ul>\n<p><strong>Три ступени склянок:</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ступень</th>\n<th>Сложность</th>\n<th>Ингредиенты</th>\n<th>Действует</th>\n<th>Цена для тела</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Снадобье</strong></td>\n<td>1</td>\n<td>Медь</td>\n<td>до утра или по делу</td>\n<td>нет</td>\n</tr>\n<tr>\n<td><strong>Эликсир</strong></td>\n<td>2</td>\n<td>Бронза</td>\n<td>одна сцена или бой</td>\n<td><strong>откат:</strong> после сцены −2 Выносливости</td>\n</tr>\n<tr>\n<td><strong>Мутаген</strong></td>\n<td>3</td>\n<td>Серебро</td>\n<td>сутки</td>\n<td><strong>отметка на треке Тела Сердца</strong></td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Варка:</strong></p>\n<ul>\n<li>Нужна алхимическая посуда. Без неё сложность +1; мутагены без неё варить нельзя.</li>\n<li>Провал — склянка испорчена, ингредиенты потеряны.</li>\n<li>Готовую склянку можно купить на ступень цены дороже ингредиентов. Мутагены и яды продают из-под полы: Церкви их не любят, а стража за них сажает.</li>\n</ul>\n<p><strong>Отметки на Теле Сердца</strong> — что они делают, решится в работе над треками Тел.</p>\n<h4 id=\"рецепты\">Рецепты</h4>\n<p><em>Ингредиенты в рецептах — из мира Континента или народные. В мире они работают; в нашем — нет. Рецепты нужны для колорита: игрок, которому нравится ведьмовство, может разыграть варку целиком, остальные просто бросают кубы.</em></p>\n<p>«Могила» — Могила Создателя, спутник, занимающий треть неба. Её фазы — главный часослов алхимика.</p>\n<h5 id=\"снадобья\">Снадобья</h5>\n<p><strong>Жаропонижающий отвар</strong> · Медь · сл. 1</p>\n<ul>\n<li><em>Состав:</em> ивовая кора, липовый цвет, ложка мёда.</li>\n<li><em>Варка:</em> кору томить в горшке до вечера, цвет бросить, когда вода потемнеет; мёд — в остывший отвар, иначе он «убьёт силу».</li>\n<li><em>Признаки:</em> горький, пахнет летом.</li>\n<li><em>Действие:</em> последствие-болезнь на ступень короче по лестнице длительности.</li>\n</ul>\n<p><strong>Сонное зелье</strong> · Медь · сл. 1</p>\n<ul>\n<li><em>Состав:</em> дрёма-корень, ромашка, тёплое молоко.</li>\n<li><em>Варка:</em> корень растереть с щепотью соли, залить молоком, держать у печи, пока не уснёт кошка в доме (так говорят знахарки; на деле — около часа).</li>\n<li><em>Признаки:</em> сладковатое, без запаха.</li>\n<li><em>Действие:</em> в питьё — человек спит до утра. Подлить незаметно — Плутовство.</li>\n</ul>\n<p><strong>Нюхательная соль</strong> · Медь · сл. 1</p>\n<ul>\n<li><em>Состав:</em> соль с перекрёстка трёх дорог, толчёный рог тура, крепкий уксус.</li>\n<li><em>Варка:</em> смешать в ступке, залить уксусом, высушить на ветру в ночь новой Могилы.</li>\n<li><em>Признаки:</em> бьёт в нос до слёз.</li>\n<li><em>Действие:</em> выбывший без Смертельной раны приходит в себя после боя.</li>\n</ul>\n<p><strong>Припарка</strong> · Медь · сл. 1</p>\n<ul>\n<li><em>Состав:</em> подорожник, еловая смола, воск.</li>\n<li><em>Варка:</em> смолу и воск растопить, листья мять в них, пока не позеленеет.</li>\n<li><em>Действие:</em> неперевязанная Лёгкая рана не снижает потолок Выносливости на отдыхе.</li>\n</ul>\n<p><strong>Кровяной порошок</strong> · Медь · сл. 1</p>\n<ul>\n<li><em>Состав:</em> сухой белый стебель гъвеста, пепел крапивы.</li>\n<li><em>Варка:</em> стебель срезать там, где гъвест поднялся за ночь, высушить и растереть с пеплом в пыль; хранить сухим.</li>\n<li><em>Признаки:</em> розовый порошок, пахнет железом.</li>\n<li><em>Действие:</em> одна порция — обычное Кровотечение останавливается без броска, даже без таланта «Перевязка». Кровь, поднявшая дерево, запирает кровь.</li>\n</ul>\n<p><strong>Рассол</strong> · Грош · сл. 1</p>\n<ul>\n<li><em>Состав:</em> капустный рассол, хрен, чёрный хлеб.</li>\n<li><em>Варка:</em> настоять ночь.</li>\n<li><em>Действие:</em> снимает последствие «на сцену» после попойки. Варят все, кто хоть раз пил.</li>\n</ul>\n<h5 id=\"эликсиры-откат-после-сцены-2-выносливости\">Эликсиры (откат: после сцены −2 Выносливости)</h5>\n<p><strong>Турья кровь</strong> · Бронза · сл. 2</p>\n<ul>\n<li><em>Состав:</em> сушёная кровь тура (её везут с Севера, из земель Сатура, плитками), медвежий жир, корень железняка.</li>\n<li><em>Варка:</em> плитку растворить в тёплой воде, не кипятить — греть до пара и мешать против хода солнца, пока не потемнеет; жир и корень — с первым паром.</li>\n<li><em>Признаки:</em> густая, солёная, пахнет шерстью и железом.</li>\n<li><em>Действие:</em> Выносливость +3 на бой.</li>\n</ul>\n<p><strong>Холодная голова</strong> · Бронза · сл. 2</p>\n<ul>\n<li><em>Состав:</em> снег с северного склона, мята, роса с могильной травы.</li>\n<li><em>Варка:</em> снег растопить без огня — на груди, под рубахой; росу собирать на рассвете, пока Могила ещё на небе.</li>\n<li><em>Признаки:</em> ледяной, немеет язык.</li>\n<li><em>Действие:</em> Воля +2 на бой.</li>\n</ul>\n<p><strong>Слёзы мака</strong> · Бронза · сл. 2</p>\n<ul>\n<li><em>Состав:</em> маковые головки, собранные в ночь новой Могилы, вино, полынь.</li>\n<li><em>Варка:</em> головки томить в вине три дня, полынь — в последний вечер.</li>\n<li><em>Признаки:</em> мутное, горько-сладкое, клонит в сон.</li>\n<li><em>Действие:</em> на бой Тяжёлая рана не требует «стерпеть».</li>\n</ul>\n<p><strong>Ясный глаз</strong> · Бронза · сл. 2</p>\n<ul>\n<li><em>Состав:</em> очанка, совиное перо, колодезная вода.</li>\n<li><em>Варка:</em> перо сжечь над водой, чтобы пепел упал в неё; очанку настоять на этой воде до темноты.</li>\n<li><em>Действие:</em> +1 кость к Бдительности до утра.</li>\n</ul>\n<p><strong>Лёгкая нога</strong> · Бронза · сл. 2</p>\n<ul>\n<li><em>Состав:</em> заячий жир, хвоя, крепкое вино.</li>\n<li><em>Варка:</em> растереть жир с хвоей, втирать в ногу, вино — внутрь.</li>\n<li><em>Действие:</em> на сцену Хромота не мешает двигаться.</li>\n</ul>\n<p><strong>Медовый язык</strong> · Бронза · сл. 2</p>\n<ul>\n<li><em>Состав:</em> липовый мёд, лепестки шиповника, капля крови того, кто был любим.</li>\n<li><em>Варка:</em> мёд разогреть на свече, лепестки бросать по одному, считая до семи.</li>\n<li><em>Действие:</em> +1 кость к Убеждению на сцену. Откат вдобавок: после сцены язык заплетается до утра.</li>\n</ul>\n<p><strong>Твёрдая рука</strong> · Бронза · сл. 2</p>\n<ul>\n<li><em>Состав:</em> валериана, ржавый гвоздь из гроба, вода из кузнечной бадьи.</li>\n<li><em>Варка:</em> гвоздь держать в настое ночь; утром вынуть и закопать.</li>\n<li><em>Действие:</em> +1 кость к Стрельбе или Плутовству на сцену: рука не дрожит.</li>\n</ul>\n<p><strong>Глоток храбрости</strong> · Бронза · сл. 2</p>\n<ul>\n<li><em>Состав:</em> крепкая водка, перец, клок шерсти баргеста.</li>\n<li><em>Варка:</em> шерсть опалить и бросить пепел в водку, перец — по вкусу и по храбрости.</li>\n<li><em>Действие:</em> первая проверка Воли в бою — успех без броска.</li>\n</ul>\n<h5 id=\"мутагены-отметка-на-треке-тела-сердца\">Мутагены (отметка на треке Тела Сердца)</h5>\n<p><strong>Кровавый сок</strong> · Серебро · сл. 3</p>\n<ul>\n<li><em>Состав:</em> сок гъвеста, кровь варящего, корень мандрагоры, выкопанный в ночь полной Могилы.</li>\n<li><em>Варка:</em> белый стебель надрезать на рассвете после битвы, пока дерево ещё растёт; собрать сок, смешать с кровью и корнем, семь дней держать в закопанном горшке и в последнюю ночь уварить на углях до чёрной смолы.</li>\n<li><em>Признаки:</em> тянется, как дёготь; после глотка горят вены.</li>\n<li><em>Действие:</em> на сутки Телосложение +1 ступень.</li>\n</ul>\n<p><strong>Каменная кожа</strong> · Серебро · сл. 3</p>\n<ul>\n<li><em>Состав:</em> костяная чешуя каймура, известь, кровь ящерицы.</li>\n<li><em>Варка:</em> чешую истолочь с известью, смочить кровью, обжечь в горне. Чешую лучше брать с каймура, которого поймали у костра: говорят, тёплая кость крепче.</li>\n<li><em>Признаки:</em> после приёма кожа сереет и шелушится.</li>\n<li><em>Действие:</em> на сутки Лёгкие раны не отнимают Выносливость и не дают Давления.</li>\n</ul>\n<p><strong>Кошачий глаз</strong> · Серебро · сл. 3</p>\n<ul>\n<li><em>Состав:</em> глаз
