<style>
:root{
  --paper: oklch(0.965 0.015 90); --paper-2: oklch(0.94 0.02 90);
  --ink: oklch(0.30 0.02 60); --ink-2: oklch(0.45 0.03 60);
  --bordo: oklch(0.40 0.08 30); --bordo-2: oklch(0.48 0.09 32);
  --line: oklch(0.86 0.02 80); --head-bg: oklch(0.90 0.025 85);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font:17px/1.7 "EB Garamond",Georgia,"Times New Roman",serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,h5{font-family:"Spectral",Georgia,serif;line-height:1.25;text-wrap:balance}
a{color:var(--bordo-2)}
:focus-visible{outline:2px solid var(--bordo-2);outline-offset:2px}
button{cursor:pointer;font:inherit}
.layout{display:grid;grid-template-columns:320px 1fr;min-height:100dvh}
/* ---------- sidebar ---------- */
aside{border-right:1px solid var(--line);background:var(--paper-2);padding:18px 14px;height:100dvh;overflow-y:auto;position:sticky;top:0}
aside h1{font-size:19px;color:var(--bordo);margin-bottom:4px}
aside .sub{font-size:13px;color:var(--ink-2);margin-bottom:12px}
#q{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);font:inherit;font-size:15px;margin-bottom:6px}
#q:focus{border-color:var(--bordo-2);outline:none}
nav .part{margin-top:14px}
nav .pt{font-family:"Spectral",serif;font-size:13.5px;font-weight:600;letter-spacing:.04em;text-transform:small-caps;color:var(--bordo);border-bottom:1px solid var(--line);padding-bottom:3px;margin-bottom:4px}
nav a.cl{display:block;padding:5px 8px;border-radius:6px;text-decoration:none;color:var(--ink);font-size:15px;line-height:1.35}
nav a.cl:hover{background:var(--head-bg)}
nav a.cl.on{background:var(--bordo);color:var(--paper)}
nav a.cl .n{color:var(--bordo-2);font-family:"Spectral",serif;font-size:13px;margin-right:5px}
nav a.cl.on .n{color:var(--paper)}
#hits{display:none;margin:8px 0 4px;font-size:14px}
#hits .h{padding:6px 8px;border-radius:6px;cursor:pointer}
#hits .h:hover{background:var(--head-bg)}
#hits .h b{color:var(--bordo)}
#hits .h small{color:var(--ink-2)}
#hits .h mark{background:oklch(0.88 0.08 80);padding:0 1px;border-radius:2px}
/* ---------- content ---------- */
main{padding:26px 40px 80px;max-width:860px}
.crumb{font-family:"Spectral",serif;font-size:13px;color:var(--ink-2);margin-bottom:6px}
article h2{font-size:27px;color:var(--bordo);margin:0 0 14px;padding-bottom:8px;border-bottom:2px solid var(--bordo)}
article h3{font-size:20px;color:var(--bordo-2);margin:26px 0 8px}
article h4{font-size:16.5px;color:var(--ink);margin:20px 0 6px;font-weight:600}
article h5{font-size:15px;color:var(--ink-2);margin:16px 0 4px;font-style:italic}
article p{margin:10px 0;max-width:72ch}
article ul,article ol{margin:10px 0 10px 22px;max-width:70ch}
article li{margin:4px 0}
article blockquote{border-left:3px solid var(--bordo-2);padding:4px 14px;margin:14px 0;color:var(--bordo);font-style:italic;background:var(--paper-2);border-radius:0 8px 8px 0}
article hr{border:none;border-top:1px solid var(--line);margin:22px 0}
article a.xref{border-bottom:1px dotted var(--bordo-2);text-decoration:none}
.tw{overflow-x:auto;margin:12px 0}
table{border-collapse:collapse;font-size:14.5px;line-height:1.45;min-width:60%}
th{font-family:"Spectral",serif;font-weight:600;background:var(--head-bg);color:var(--bordo);text-align:left}
th,td{border:1px solid var(--line);padding:6px 10px;vertical-align:top}
tbody tr:nth-child(even){background:oklch(0.955 0.018 90)}
code{font-family:ui-monospace,Consolas,monospace;font-size:.9em;background:var(--paper-2);padding:1px 5px;border-radius:4px}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:36px;padding-top:16px;border-top:1px solid var(--line)}
.pn a{font-family:"Spectral",serif;font-size:14.5px;text-decoration:none;color:var(--bordo-2)}
.pn a:hover{color:var(--bordo)}
.burger{display:none}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  aside{position:fixed;inset:0 25% 0 0;z-index:20;transform:translateX(-105%);transition:transform .25s ease-out;box-shadow:4px 0 24px oklch(0.3 0.02 60 / .25)}
  aside.open{transform:none}
  .burger{display:block;position:fixed;top:12px;left:12px;z-index:30;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px;font-family:"Spectral",serif}
  main{padding:64px 18px 60px}
  article h2{font-size:23px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  <div class="sub">Книга правил · игровая редакция 14.11.2026</div>

<main id="main"></main>

<script>
const DATA = {"parts": [{"title": "Вступление", "chapters": [{"id": "как-читать-эту-книгу", "title": "Как читать эту книгу", "html": "<p>В этой книге только то, что нужно за столом, — мир, правила, главы создания персонажа, бой, снаряжение.</p>\n<p><strong>Ссылки.</strong> Упоминания других глав оформлены как ссылки — по ним можно перейти (в Word: Ctrl + клик). Полная карта того, что где искать, — в приложении Б.</p>\n<hr />\n"}]}, {"title": "Часть I. Мир и мастер", "chapters": [{"id": "глава-1.-мир-континента", "title": "Глава 1. Мир Континента", "html": "<h3 id=\"могила-создателя\">Могила Создателя</h3>\n<p>Над миром висит Могила Создателя — естественный спутник планеты, занимающий добрую треть неба. Благодаря её постоянному присутствию ночи на Континенте довольно светлые. Фазы Могилы — главный часослов алхимика: многие снадобья варятся «в ночь новой Могилы» или «ночью полной Могилы».</p>\n<p>На Могиле заперт Безликий — полуфункционирующее божество. До него можно добраться — и такая встреча сама по себе станет историей.</p>\n<h3 id=\"шут-и-судьба\">Шут и Судьба</h3>\n<p>Шут — Бог Историй, и мастер играет его роль. Удача персонажа — это то, насколько он нравится Шуту и насколько крепко его держит Судьба: высокая Удача значит, что ты интересен Шуту и Колесо тебя бережёт; низкая — что ты массовка, и тебя не жалко.</p>\n<blockquote>\n<p>«Удача — это то, что есть только у живых. Если ты уже умер, то какая ж может быть удача?»</p>\n</blockquote>\n<p>Под ступенью «Отвратно» лежит ступень <strong>Обречённо</strong>: обречённый почти бессмертен — Шут не отпускает тех, кто нужен ему для финала, — но его смерть уже назначена и принадлежит Шуту.</p>\n<h3 id=\"эпохи\">Эпохи</h3>\n<p>Время, в которое происходит история, — важная часть нарратива. Если играть во времена становления Триархии, в мире обычно не встретить представителей зора'. Если история повествует о прошлых эпохах или о будущем в рамках двух тысячелетий после Второго Расхождения Планов, зора' будет пруд пруди. От эпохи зависят и доступная миру магия, и действия Арканов и Планов Бытия.</p>\n<p>Канонически события НРИ происходят в момент изобретения возможности массового производства удобного в использовании огнестрельного оружия (казнозарядного).</p>\n<h3 id=\"триархия-и-её-земли\">Триархия и её земли</h3>\n<p>Держава людей — <strong>Триархия</strong>, основанная первым императором при помощи Аркана Колеса Судьбы. Её земли и соседи, известные по происхождениям персонажей:</p>\n<ul>\n<li><strong>Земли Сатура</strong> — дикий север, родина туров.</li>\n<li><strong>Провинции Триархии</strong> — земли, захваченные более века назад, смешение культур и этносов.</li>\n<li><strong>Столица Триархии</strong> — светлейшее из когда-либо существовавших мест на Континенте.</li>\n<li><strong>Западные королевства</strong> — вечно раздираемые междоусобицами и враждой.</li>\n<li><strong>Восточные земли</strong> — мятежные земли, издревле сопротивлявшиеся любому контролю.</li>\n<li><strong>Пустыни Ютона</strong> — руины былого, где личи и архиличи ведут редкие войны, а искатели сокровищ рыскают среди руин; редкие людские поселения.</li>\n<li><strong>Дохлобог</strong> — земли немёртвых. Единственный некромант, достигший своей заветной цели, открыл секрет создания искусственной души. В Дохлобоге живут немёртвые всех эпох — и люди, чьи предки обосновались там ещё до этого и не захотели уходить.</li>\n</ul>\n<p>Дворяне в мире называются <strong>элитариями</strong>. Деньги Триархии — <strong>Колёса</strong>, в честь Аркана Колеса Судьбы: серебряные, бронзовые и медные (1 : 10 : 100). Золота в мире немного, и драгоценным оно не считается — ценность и символ здесь серебро. Меч — знак положения: в городе открыто его носят Почтенные и Элитарии; у Отребья и Изгоя клинок — повод для стражи.</p>\n<h3 id=\"души-и-смерть\">Души и смерть</h3>\n<p>Души после смерти почти сразу исчезают, и труп — просто труп. Воскрешения нет, разговоров с мёртвыми нет. Немёртвые — в большинстве случаев искусственно созданные души. Это ограничение мира действует и для магии.</p>\n<h3 id=\"планы-арканы-фаза\">Планы, Арканы, Фаза</h3>\n<p>Мир соприкасается с <strong>Планами Бытия</strong>. Над событиями стоят <strong>Арканы</strong> — среди них Шут, Сила, Колесо Судьбы, Смерть. Знание о Планах, тварях Расхождений, Арканах и их знаках — это навык Запретное: знание без силы, за которое платят рассудком.</p>\n<p><strong>Фаза</strong> — прореха в самом пространстве, источающая темноту трещина, способная призвать Фазовых Странников. В обычном мире Фаза почти не проявляется, но после Расхождений её шанс растёт.</p>\n<h3 id=\"магия-в-мире\">Магия в мире</h3>\n<p>Магия пришла в мир и породила множество невиданных растений, а самые ценные алхимические ингредиенты дают инопланарные твари. Алхимики расцвели вместе с магией, но склянки варят смертные — это знание рук и книг, а не магия. Истинная магия не принадлежит смертным: <strong>колдун</strong> связал душу контрактом с магом, Богом или Арканом ради силы; <strong>маг</strong> — «альбинос», чьё Тело Духа аномально восприимчиво к энергии от рождения. Сила, взятая не у Шута, оплачивается Удачей.</p>\n<hr />\n"}, {"id": "глава-2.-памятка-мастеру", "title": "Глава 2. Памятка мастеру", "html": "<p>Ключевые нарративные опоры для мастера игры:</p>\n<ol>\n<li><strong>У мира есть тайна.</strong> На Могиле Создателя заперт Безликий, и до него можно добраться. Кто он такой на самом деле — вопрос, на который ваша история вольна ответить сама. Продумайте этот факт заранее.</li>\n<li><strong>Мастер играет Шута.</strong> Удача, Шутка Шута, финалы обречённых — это инструменты мастера в роли Бога Историй (см. главу 6).</li>\n<li><strong>Ночи светлые.</strong> Могила занимает треть неба — учитывайте это в сценах ночи, засад и стражи.</li>\n<li><strong>Эпоха имеет значение.</strong> Выберите время истории заранее: от него зависят присутствие зора', доступная магия и действия Арканов. Каноническая эпоха — изобретение казнозарядного огнестрела.</li>\n</ol>\n<h3 id=\"советы-по-удаче-выжимка-главы-6\">Советы по Удаче (выжимка главы 6)</h3>\n<p><strong>Шутка Шута</strong> — единственный обычный способ вернуть Удачу:</p>\n<ul>\n<li>Шутка — последствие, которое останется <strong>надолго или навсегда</strong>. Всё, что короче, — не Шутка.</li>\n<li>Шутка меняет историю, а не штрафует: предатель получает имя и мотив; сожжённый дом значит, что возвращаться некуда.</li>\n<li>Не смерть и не потеря персонажа: он остаётся игровым и под контролем игрока.</li>\n<li>Можно через характер: персонаж срывается по своей природе. Если это неправда про персонажа, игрок вправе отказаться.</li>\n<li>Не утешение: не предлагать сразу после сожжённой Удачи как компенсацию. Обычно не чаще раза за сюжетную арку (3–6 сессий) на персонажа. Отказанную Шутку не повторять.</li>\n</ul>\n<p><strong>Финал обречённого:</strong></p>\n<ul>\n<li>Обычно в той же арке, где персонаж стал обречённым, или в следующей — иначе отложенная смерть превращается в бессмертие.</li>\n<li>В кульминации, там, где смерть меняет историю, а не в случайной стычке.</li>\n<li>Смерть что-то покупает (спасает других, доводит дело до конца) или трагически срывается на пороге цели.</li>\n</ul>\n<p><strong>Мгновенные угрозы</strong> (казнь, пропасть, обвал):</p>\n<ul>\n<li>Редки и всегда видны заранее.</li>\n<li>От них можно отказаться: не прыгать, не лезть под обвал. Мгновенная угроза — выбор игрока, а не засада.</li>\n</ul>\n<p><strong>Запретное:</strong> помните, что <strong>мир лжёт</strong> — успех даёт ответ, в который верит мир, а правда открывается только с запасом успехов или на крите. Игрок никогда не знает наверняка, слух у него или истина.</p>\n<hr />\n"}, {"id": "глава-3.-звери-твари-и-растения", "title": "Глава 3. Звери, твари и растения", "html": "<hr />\n<h3 id=\"алхимия-в-мире\">Алхимия в мире</h3>\n<p>Алхимики расцвели вместе с приходом магии в мир. Магия породила огромное количество невиданных прежде растений. Из животных для алхимии важны прежде всего <strong>инопланарные твари</strong> и чудовища всех форм и размеров.</p>\n<h3 id=\"звери\">Звери</h3>\n<p><strong>Каймуры.</strong> Хищные, скорее всеядные аналоги кротов с чуть лучшим зрением. Выглядят как вытянутые костяные черви, заостряющиеся к концу, с хвостом и короткими лапами. На деле это ящеры, хладнокровные, поэтому рвутся к кострам: часто «толкаются» с путниками на привале, врезаясь в них из-под земли или выкапываясь прямо в костёр.</p>\n<p><strong>Туры.</strong> Огромные звери с Севера, с земель Сатура. Похожи на сухопутных китов с рогами, только мохнатые и сильно меньше: ростом с 3–4 человека, длина тоже немалая. Шкуры туров очень ценятся.</p>\n<h3 id=\"инопланарные-твари\">Инопланарные твари</h3>\n<p><strong>Баргесты.</strong> Волки с пятью лапами: чёрные, огромные, уродливые.</p>\n<p><strong>Сюпсю.</strong> Червеобразные твари, которые занимают трупы людей как гнездо и начинают ими управлять. Труп при этом продолжает разлагаться.</p>\n<p><strong>Тиньгои.</strong> Духи, мимикрирующие под людей, но без единого отверстия на теле, кроме лица. Могут быть не злыми, но чаще агрессивны и хитры.</p>\n<h3 id=\"растения\">Растения</h3>\n<p><strong>Гъвест</strong> (читается почти как «хвест»). Кровавое дерево с белым стеблем. За ночь может подняться на поле боя из крови павших.</p>\n<p>Остальные растения автор пока не придумывал.</p>\n<hr />\n"}]}, {"title": "Часть II. Основа правил", "chapters": [{"id": "глава-4.-характеристики", "title": "Глава 4. Характеристики", "html": "<hr />\n<h4 id=\"три-характеристики\">Три характеристики</h4>\n<p>У каждого персонажа три характеристики:</p>\n<ul>\n<li><strong>Телосложение</strong> — сила, выносливость, ловкость, здоровье плоти.</li>\n<li><strong>Личность</strong> — ум, восприятие, воля, обаяние, умение читать людей.</li>\n<li><strong>Удача</strong> — то, насколько персонаж нравится Шуту.</li>\n</ul>\n<p>Телосложение и Личность задают тип кости для бросков. Удача костью не является: это <strong>сжигаемая</strong> характеристика (см. ниже).</p>\n<h4 id=\"шкала-ступеней\">Шкала ступеней</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ступень</th>\n<th>Кость</th>\n<th>Модификатор</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Отвратно</td>\n<td>d4 (успех только по паре четвёрок)</td>\n<td>−3</td>\n</tr>\n<tr>\n<td>Ужасно</td>\n<td>d6</td>\n<td>−2</td>\n</tr>\n<tr>\n<td>Плохо</td>\n<td>d8</td>\n<td>−1</td>\n</tr>\n<tr>\n<td>Стандартно</td>\n<td>d10</td>\n<td>0</td>\n</tr>\n<tr>\n<td>Хорошо</td>\n<td>d12</td>\n<td>+1</td>\n</tr>\n<tr>\n<td>Отлично</td>\n<td>d14</td>\n<td>+2</td>\n</tr>\n<tr>\n<td>Образцово</td>\n<td>d16</td>\n<td>+3</td>\n</tr>\n</tbody>\n</table></div>\n<p>Ступени относятся к виду, а не к миру вообще: человек с Отличным Телосложением отличен среди людей.</p>\n<p><strong>d20 лежит за пределами человеческой шкалы.</strong></p>\n<p>Чем ниже ступень, тем чаще крит (см. «Ядро броска»). Слабые живут на удаче, сильные на мастерстве.</p>\n<h4 id=\"удача\">Удача</h4>\n<p>Удача измеряется той же шкалой, но в бросках не участвует. Она работает с исходами: беда ищет неудачника, а в момент беды ступень Удачи можно <strong>сжечь</strong> ради спасения. Ниже Отвратно лежит ступень <strong>Обречённо</strong>. Начальная Удача = Стандартно + происхождение + статус. Вернуть Удачу можно редко и дорого. Подробно — в главе «Удача».</p>\n<h4 id=\"тела\">Тела</h4>\n<p>У каждого живого существа есть три Тела: <strong>Сердца</strong> (плоть), <strong>Разума</strong> (сознание, оболочка души) и <strong>Духа</strong>. Смертный их не ощущает и не может на них воздействовать. На листе смертного Тела записаны пустыми треками: заполняет их мир, а не игрок. Проклятие разъедает Дух, морок ломает Разум, и смертный видит только последствия.</p>\n<hr />\n<hr />\n"}, {"id": "глава-5.-ядро-броска", "title": "Глава 5. Ядро броска", "html": "<hr />\n<h4 id=\"пул\">Пул</h4>\n<p>Когда исход действия неясен и у провала есть цена, игрок собирает пул костей.</p>\n<ul>\n<li><strong>Тип кости</strong> задаёт ступень характеристики (см. главу «Характеристики»).</li>\n<li><strong>Число костей</strong> задаёт уровень навыка (см. главу «Навыки»).</li>\n</ul>\n<p>Все кости в пуле одного типа: бросок всегда опирается на одну характеристику.</p>\n<h4 id=\"успех\">Успех</h4>\n<p>Каждая кость, выпавшая на <strong>6 или выше</strong>, даёт один успех.</p>\n<p><strong>Исключение — d4.</strong> На d4 шестёрка выпасть не может, поэтому обычный успех невозможен. Успех засчитывается только за <strong>пару четвёрок</strong>: две кости, выпавшие на 4, дают один успех. Четыре четвёрки дают два успеха.</p>\n<h4 id=\"сложность\">Сложность</h4>\n<p>Сложность — число успехов, которое нужно набрать.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Сложность</th>\n<th>Действие</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1</td>\n<td>Простое</td>\n<td>открыть незапертую дверь, рутинные дела</td>\n</tr>\n<tr>\n<td>2</td>\n<td>Обычное</td>\n<td>взломать простой замок</td>\n</tr>\n<tr>\n<td>3</td>\n<td>Сложное</td>\n<td>пробраться незамеченным мимо охраны</td>\n</tr>\n<tr>\n<td>4</td>\n<td>Очень сложное</td>\n<td>убедить враждебного переговорщика сменить позицию</td>\n</tr>\n<tr>\n<td>5</td>\n<td>Крайне сложное</td>\n<td>обезвредить хитроумную бомбу при нехватке времени и знаний</td>\n</tr>\n<tr>\n<td>6</td>\n<td>Почти невозможное</td>\n<td>совершить запредельное или героическое</td>\n</tr>\n</tbody>\n</table></div>\n<p>Без крита сложность N требует минимум N костей в пуле.</p>\n<h4 id=\"крит\">Крит</h4>\n<p><strong>Крит</strong> — две кости, выпавшие на максимум своей грани. На d4 — <strong>три четвёрки в одном броске</strong> (пара четвёрок уже даёт обычный успех).</p>\n<p>Крит даёт:</p>\n<ul>\n<li><strong>+1 успех</strong> сверх выпавших (один раз на бросок, даже если максимумов больше);</li>\n<li><strong>право описать дополнительный эффект</strong> сверх результата: действие удалось не просто, а с чем-то ещё;</li>\n<li>в бою (SRM) — <strong>автоматический сдвиг яруса на одну ступень</strong> в пользу критующего, если у противника крита нет. Два крита гасят друг друга (см. «Бой — Кубы в бою»).</li>\n</ul>\n<p>Чем ниже ступень характеристики, тем чаще крит: слабые живут на удаче, сильные на мастерстве. Только крит позволяет взять сложность выше числа костей в пуле: это чудо, а не мастерство.</p>\n<h4 id=\"критический-провал\">Критический провал</h4>\n<p><strong>Критический провал</strong> — ни одного успеха и две кости на 1. На d4 — <strong>три единицы</strong> (как и крит там требует трёх четвёрок).</p>\n<p>Критический провал даёт <strong>осложнение по выбору ГМа</strong> сверх обычного провала: действие не просто не удалось, а обернулось бедой. Это зеркало дополнительного эффекта крита. Крит и критический провал в одном броске не встречаются: крит всегда несёт успех.</p>\n<p>Чем ниже ступень характеристики, тем чаще критический провал: слабые живут не только на удаче, но и на беде.</p>\n<hr />\n<hr />\n"}, {"id": "глава-6.-удача", "title": "Глава 6. Удача", "html": "<blockquote>\n<p>«Удача — это то, что есть только у живых. Если ты уже умер, то какая ж может быть удача?»</p>\n</blockquote>\n<hr />\n<h4 id=\"что-такое-удача\">Что такое Удача</h4>\n<p>Удача — третья характеристика персонажа. Она измеряется той же шкалой, что и остальные («Отвратно → Образцово»), но <strong>не задаёт кость</strong> ни для одного броска.</p>\n<p>Удача показывает, насколько персонаж нравится Шуту, Богу Историй, и насколько крепко его держит Судьба. Высокая Удача значит, что ты интересен Шуту и Колесо тебя бережёт. Низкая значит, что ты массовка и тебя не жалко.</p>\n<p><strong>Главный принцип:</strong> Удача меняет не то, <em>как</em> ты сделал, а то, <em>что из этого вышло</em>. Она работает с исходами и последствиями, а не с бросками. Переброса за Удачу нет.</p>\n<h4 id=\"начальная-удача\">Начальная Удача</h4>\n<p><strong>Удача = Стандартно + происхождение + статус.</strong></p>\n<ul>\n<li><strong>Происхождение</strong> — где и кем ты родился: пустыни Ютона, Столица, род укота (см. <a href=\"#/3/0/глава-8.-порядок-создания-персонажа\" class=\"xref\">главу 8</a>).</li>\n<li><strong>Статус:</strong> Обыватель +1 ступень, Колдун −1, Маг −2. Сила, взятая у кого-то ещё, оплачивается Удачей.</li>\n<li><strong>Не выше Образцово.</strong> Излишек сверх Образцово сгорает.</li>\n<li><strong>Нельзя продать то, чего нет.</strong> Статус недоступен, если Удача опустилась бы ниже Отвратно. Начать игру Обречённым нельзя.</li>\n</ul>\n<h4 id=\"беда-ищет-неудачника\">Беда ищет неудачника</h4>\n<p>Удача работает всегда, даже когда её не жгут.</p>\n<ul>\n<li>Когда беда падает на кого-то из группы <strong>случайно</strong> (в кого полетел шальной болт, чья лошадь сломала ногу, кого узнал стражник), она достаётся персонажу с <strong>самой низкой</strong> Удачей.</li>\n<li>Когда <strong>случайно</strong> приходит что-то хорошее (кошель на дороге, последняя свободная койка), оно достаётся персонажу с <strong>самой высокой</strong> Удачей.</li>\n<li><strong>Групповой провал.</strong> Если один бросок провалили несколько персонажей, последствие достаётся самому неудачливому из провалившихся. Того, кто прошёл бросок, Удача не подставляет.</li>\n<li><strong>В бою</strong> шальная беда (стрела по свалке, падающая балка, понёсший конь) достаётся самому неудачливому из тех, кто стоит к ней одинаково близко. Кого бьют враги, Удача не решает: противник выбирает цель по тактике.</li>\n<li>При равной Удаче решает ГМ или жребий.</li>\n</ul>\n<p>Если за столом используются случайные таблицы, ГМ может сдвигать их результат по ступени Удачи. Это необязательное дополнение.</p>\n<h4 id=\"сжечь-удачу\">Сжечь Удачу</h4>\n<p>В момент беды персонаж может <strong>сжечь ступень Удачи</strong>: она падает на одну ступень, а персонаж получает одну покупку.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Покупка</th>\n<th>Когда</th>\n<th>В бою</th>\n<th>Вне боя</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Уйти от смерти</strong></td>\n<td>Пока персонаж жив, в том числе умирает</td>\n<td>Смертельная рана становится Калечащей, «стерпеть» бросают как обычно. Смертельный тег (Сильное кровотечение, Рана в живот) снимается, рана остаётся</td>\n<td>Смертельное становится тяжёлым последствием</td>\n</tr>\n<tr>\n<td><strong>Отвести последствие</strong></td>\n<td>После исхода, пока персонаж жив</td>\n<td>Рана на ступень легче (Калечащая → Тяжёлая → Лёгкая) или снять один тег</td>\n<td>Последствие на ступень короче по лестнице длительности</td>\n</tr>\n<tr>\n<td><strong>Заявить деталь</strong></td>\n<td>В любой момент, пока персонаж жив</td>\n<td>Меняет сцену со следующего такта: ставит или снимает метку позиции (Опора, Высота, Теснота, стена), вводит третью силу (подмога, понёсшая лошадь), открывает выход (дверь не заперта)</td>\n<td>Открывает путь, который ещё нужно пройти: «в стене трещина», а не «стена рухнула»</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Деталь даёт шанс, а не победу.</strong> Она не меняет текущий такт, матрицу и кубы, не выводит противника из строя напрямую и не решает главную проблему сцены. После неё всё равно нужно действовать. Игрок предлагает Деталь, ГМ утверждает её или правит.</p>\n<h4 id=\"живые-и-мёртвые\">Живые и мёртвые</h4>\n<p><strong>Умирающий ещё жив.</strong> Пока персонаж умирает — от Смертельной раны, кровотечения, яда, болезни, утопления, — Удачу жечь можно.</p>\n<p><strong>Мёртвый мёртв.</strong> Если смерть уже наступила, Удача её не отменит.</p>\n<p><strong>Мгновенная смерть</strong> бывает, когда между бедой и смертью нет времени: падение с башни, топор палача, обвал, взрыв. Она идёт так:</p>\n<ol>\n<li>ГМ объявляет: «Это смертельно» — и называет сложность.</li>\n<li>Игрок решает, жечь ли Удачу, <strong>до броска</strong>.</li>\n<li>Бросок как обычно. Провал без Удачи — смерть. Провал с Удачей — тяжёлое последствие.</li>\n<li>Успех с Удачей — ступень сгорела зря.</li>\n</ol>\n<h4 id=\"лестница-длительности\">Лестница длительности</h4>\n<p>Вне боя у последствий нет ступеней раны, зато у любого последствия есть срок.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ступень</th>\n<th>Что значит</th>\n<th>Примеры</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Навсегда</strong></td>\n<td>не исправить</td>\n<td>потерял глаз, сожгли дом, публично опозорен, проклят</td>\n</tr>\n<tr>\n<td><strong>Надолго</strong></td>\n<td>до конца истории или пока не исправишь делом</td>\n<td>розыск в городе, долг гильдии, перелом</td>\n</tr>\n<tr>\n<td><strong>На время</strong></td>\n<td>дни</td>\n<td>лихорадка, подбитая репутация в трактире</td>\n</tr>\n<tr>\n<td><strong>На сцену</strong></td>\n<td>здесь и сейчас</td>\n<td>потерял кошель, упустил след, выдал себя</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"чего-удача-не-делает\">Чего Удача не делает</h4>\n<ul>\n<li><strong>Случай, а не цена.</strong> Удача спасает от того, чего персонаж не выбирал: шальной стрелы, обвала, болезни, предательства. Она <strong>не отменяет цену</strong>, на которую персонаж пошёл сам: отметки на Теле Разума за Запретное, цену заклинания, условия сделки с богом. Удача не трогает треки Тел.</li>\n<li><strong>Положения и Воля.</strong> Сбит, Удержан, Дрогнул, Бегство, Сдача — это мастерство и нервы, а не судьба. Удача вступает, только когда положение становится смертельной угрозой: кинжал в щель лат Удержанному (Смертельная рана) или казнь сдавшегося (мгновенная угроза).</li>\n</ul>\n<h4 id=\"обречённо-ниже-отвратно\">Обречённо: ниже Отвратно</h4>\n<p>Под Отвратно лежит ступень <strong>Обречённо</strong>. Она вне шкалы смертных, как d20 над Образцово.</p>\n<p>Сжечь Удачу на Отвратно можно. Покупка срабатывает, а персонаж становится <strong>обречённым</strong>:</p>\n<ul>\n<li><strong>Он не может умереть случайно.</strong> Шальной болт, падение, болезнь его не убивают: Шут не отпускает тех, кто нужен ему для финала. В бою Смертельная рана у обречённого — он выбыл, но не умирает. Упал с башни — жив, но разбит.</li>\n<li><strong>Его смерть принадлежит Шуту.</strong> ГМ сам решает, когда и как обречённый умрёт: это его <strong>финал</strong>. ГМ объявляет финал в начале сцены: «Это твой финал». В этой сцене смерть обречённого настоящая, и отвести её нельзя ничем.</li>\n<li><strong>Беда ищет его всегда</strong>, даже если рядом есть отвратные.</li>\n<li><strong>Жечь больше нечего.</strong> Покупок Удачи у обречённого нет.</li>\n<li><strong>Цену платит полностью.</strong> Обречённость не защищает от того, на что персонаж пошёл сам.</li>\n<li><strong>Обречённо — навсегда.</strong> Обречённый уже умер, его смерть только отложена. Шутку Шута ему не предлагают.</li>\n</ul>\n<h4 id=\"шутка-шута-восстановление\">Шутка Шута: восстановление</h4>\n<p>Удачу можно вернуть, но редко и дорого.</p>\n<ul>\n<li>ГМ предлагает <strong>по-настоящему плохой поворот</strong>. Предложить идею Шутки для своего персонажа может и игрок, но решает ГМ.</li>\n<li>Игрок может отказаться без последствий.</li>\n<li>Если согласился, Удача <strong>поднимается на ступень</strong>, но не выше Образцово. Персонаж понравился Шуту, потому что сделал историю интереснее ценой себя.</li>\n</ul>\n<p>Другие пути вернуть Удачу — редкие события мира: сделка с богом, обет, встреча с Колесом. Их описывает мир, а не правила.</p>\n<h4 id=\"немёртвые\">Немёртвые</h4>\n<h4 id=\"советы-гму\">Советы ГМу</h4>\n<p>Это ориентиры, а не механика.</p>\n<p><strong>Шутка Шута:</strong></p>\n<ul>\n<li>Шутка — последствие, которое останется <strong>надолго или навсегда</strong>. Всё, что короче, не Шутка.</li>\n<li>Шутка меняет историю, а не штрафует. Предатель получает имя и мотив; сожжённый дом значит, что возвращаться некуда.</li>\n<li>Не смерть и не потеря персонажа: он остаётся игровым и под контролем игрока.</li>\n<li>Можно через характер: персонаж срывается по своей природе (напился перед переговорами, ударил князя). Если это неправда про персонажа, игрок вправе отказаться.</li>\n<li>Не утешение: не предлагать сразу после сожжённой Удачи как компенсацию.</li>\n<li>Обычно не чаще раза за сюжетную арку (3–6 сессий) на персонажа. Отказанную Шутку не повторять.</li>\n</ul>\n<p><strong>Финал обречённого:</strong></p>\n<ul>\n<li>Обычно в той же арке, где персонаж стал обречённым, или в следующей. Иначе отложенная смерть превращается в бессмертие.</li>\n<li>В кульминации, там, где смерть меняет историю, а не в случайной стычке.</li>\n<li>Смерть что-то покупает (спасает других, доводит дело до конца) или трагически срывается на пороге цели.</li>\n</ul>\n<p><strong>Мгновенные угрозы:</strong></p>\n<ul>\n<li>Редки и всегда видны заранее.</li>\n<li>От них можно отказаться: не прыгать, не лезть под обвал. Мгновенная угроза — выбор игрока, а не засада.</li>\n</ul>\n<hr />\n<hr />\n"}, {"id": "глава-7.-навыки", "title": "Глава 7. Навыки", "html": "<hr />\n<h4 id=\"уровень-навыка\">Уровень навыка</h4>\n<p>Навык измеряется уровнем от <strong>0 до 5</strong>. Число костей в пуле = <strong>уровень навыка + 1</strong>.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Уровень</th>\n<th>Костей</th>\n<th>Кто это</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>0 (без точки)</td>\n<td>1</td>\n<td>не обучен</td>\n</tr>\n<tr>\n<td>1</td>\n<td>2</td>\n<td>новичок</td>\n</tr>\n<tr>\n<td>2</td>\n<td>3</td>\n<td>подмастерье</td>\n</tr>\n<tr>\n<td>3</td>\n<td>4</td>\n<td>профессионал</td>\n</tr>\n<tr>\n<td>4</td>\n<td>5</td>\n<td>мастер</td>\n</tr>\n<tr>\n<td>5</td>\n<td>6</td>\n<td>легенда</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"навык--это-потолок\">Навык — это потолок</h4>\n<p>Сложность N требует N успехов, поэтому без крита её не взять меньше чем с N костями. Значит, <strong>навык открывает потолок сложности</strong>: уровень N−1 позволяет браться за сложность N. Без навыка доступно только простое действие.</p>\n<p>Характеристика решает, насколько уверенно ты работаешь под своим потолком. Навык решает, где этот потолок.</p>\n<h4 id=\"характеристика-по-типу-действия\">Характеристика по типу действия</h4>\n<p>Навык не привязан к характеристике намертво. <strong>Навык говорит, что ты умеешь. Действие говорит, чем ты это делаешь:</strong> телом (Телосложение) или умом, волей и словом (Личность). У большинства навыков есть обычная характеристика, через которую они выполняются чаще всего, но описанное действие всегда важнее.</p>\n<h4 id=\"специализация\">Специализация</h4>\n<p>Специализация — узкая область внутри навыка (например, «Плутовство: замки»). Когда бросок попадает в специализацию, <strong>кость сдвигается на одну ступень вверх</strong> по цепи (d10 → d12). Число костей и потолок сложности не меняются: навык отвечает за доступ, специализация за качество.</p>\n<p><strong>Отвратный специалист.</strong> Специализация поднимает d4 до d6: в своём узком деле отвратный человек выходит из режима «только удача».</p>\n<p><strong>Специализация на вершине цепи.</strong> Если сдвигать некуда (у смертного d16, у прошедших через Тела d20), специализация <strong>расширяет крит на одну грань</strong>: крит засчитывается за пару из двух верхних граней (15–16 на d16, 19–20 на d20).</p>\n<h4 id=\"список-навыков\">Список навыков</h4>\n<p>Т — Телосложение, Л — Личность. «Обычно» — характеристика самых частых действий; «Иначе» — пример действия через другую характеристику.</p>\n<p><strong>Тело и руки</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Навык</th>\n<th>Что покрывает</th>\n<th>Обычно</th>\n<th>Иначе (пример)</th>\n<th>Специализации (примеры)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Атлетика</td>\n<td>бег, лазание, плавание, переноска, марш, <strong>борьба и клинч, уклонение</strong></td>\n<td>Т</td>\n<td>Л: выдержать марш на одной воле</td>\n<td>лазание, плавание, бег, борьба</td>\n</tr>\n<tr>\n<td>Фехтование</td>\n<td>клинки, которыми фехтуют: кинжал, одноручный и полуторный меч, сабля, рапира; парирование им</td>\n<td>Т</td>\n<td>Л: знание школ, чтение противника</td>\n<td>меч, кинжал, сабля, щит; стойкость, уклонение, натиск</td>\n</tr>\n<tr>\n<td>Ратное</td>\n<td>оружие длинного рычага и удара массой: древковое, дробящее, топоры, большой двуручный меч; парирование им</td>\n<td>Т</td>\n<td>Л: знание оружия, чтение противника</td>\n<td>копьё, алебарда, булава, двуручный меч, щит; стойкость, уклонение, натиск</td>\n</tr>\n<tr>\n<td>Рукопашный бой</td>\n<td>удары без оружия</td>\n<td>Т</td>\n<td>Л: чтение безоружного противника</td>\n<td>кулачный бой, удары ногами, грязные приёмы; стойкость, уклонение, натиск</td>\n</tr>\n<tr>\n<td>Стрельба</td>\n<td>луки, арбалеты, огнестрел, метание</td>\n<td>Т (лук) / Л (арбалет, огнестрел)</td>\n<td>см. описание</td>\n<td>луки, арбалеты, огнестрел, метание</td>\n</tr>\n<tr>\n<td>Скрытность</td>\n<td>красться, прятаться, слежка</td>\n<td>Т</td>\n<td>Л: затеряться в толпе</td>\n<td>город, лес, слежка</td>\n</tr>\n<tr>\n<td>Плутовство</td>\n<td>обман руками: карманы, подмена, шулерство, взлом, ловушки</td>\n<td>Т</td>\n<td>Л: понять устройство замка</td>\n<td>карманы, замки, ловушки, карты и кости</td>\n</tr>\n<tr>\n<td>Выживание</td>\n<td>следы, охота, ориентирование, звери</td>\n<td>Т</td>\n<td>Л: прочитать местность и погоду</td>\n<td>следопытство, охота, звери</td>\n</tr>\n<tr>\n<td>Ремесло</td>\n<td>изготовление и починка вещей</td>\n<td>Т</td>\n<td>Л: чертёж, оценка вещи</td>\n<td>кузня, дерево, кожа, осадные машины</td>\n</tr>\n<tr>\n<td>Врачевание</td>\n<td>раны, болезни, хирургия, яды</td>\n<td>Л</td>\n<td>Т: грубая хирургия, лечить себя по ощущениям</td>\n<td>хирургия, знахарство, яды, анатомия</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Слово и люди</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Навык</th>\n<th>Что покрывает</th>\n<th>Обычно</th>\n<th>Иначе (пример)</th>\n<th>Специализации (примеры)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Убеждение</td>\n<td>изменить мнение человека или толпы: уговоры, торг, ораторское искусство</td>\n<td>Л</td>\n<td>—</td>\n<td>торг, проповедь, соблазн, ораторское искусство</td>\n</tr>\n<tr>\n<td>Запугивание</td>\n<td>угрозы, давление, допрос</td>\n<td>Л</td>\n<td>Т: нависнуть, сломать палец</td>\n<td>допрос, угрозы, пытки</td>\n</tr>\n<tr>\n<td>Обман</td>\n<td>обман словом и лицом: ложь, притворство, маскировка, подделка</td>\n<td>Л</td>\n<td>Т: сыграть ранение, грим</td>\n<td>ложь, маскировка, подделка</td>\n</tr>\n<tr>\n<td>Проницательность</td>\n<td>мотивы, ложь, страх, настроение</td>\n<td>Л</td>\n<td>Т: читать касанием и близостью</td>\n<td>ложь, страх, толпа</td>\n</tr>\n<tr>\n<td>Обычаи</td>\n<td>порядки и люди разных слоёв</td>\n<td>Л</td>\n<td>—</td>\n<td>двор, улица, церковь, армия, укоты</td>\n</tr>\n<tr>\n<td>Лидерство</td>\n<td>воля группы: командование, мораль, дисциплина, организация</td>\n<td>Л</td>\n<td>Т: личный пример в бою</td>\n<td>строй, отряд, мятеж, толпа</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Ум и знание</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Навык</th>\n<th>Что покрывает</th>\n<th>Обычно</th>\n<th>Иначе (пример)</th>\n<th>Специализации (примеры)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Бдительность</td>\n<td>чуять опасность: засада, слежка, шорох</td>\n<td>Л</td>\n<td>Т: дежурство на ногах, сон вполглаза</td>\n<td>засада, слух, ночь</td>\n</tr>\n<tr>\n<td>Сыск</td>\n<td>поиск, дознание, улики, сопоставление</td>\n<td>Л</td>\n<td>—</td>\n<td>следы преступления, архивы, свидетели</td>\n</tr>\n<tr>\n<td>Учёность</td>\n<td>грамота, история, языки, право, богословие, науки</td>\n<td>Л</td>\n<td>—</td>\n<td>история, языки, право, богословие, алхимия</td>\n</tr>\n<tr>\n<td>Запретное</td>\n<td>Планы, твари, Арканы, культы, ритуалы, Тела, проклятия</td>\n<td>Л</td>\n<td>Т: почуять</td>\n<td>твари, культы и боги, Планы, Арканы, сигилы, ритуалы и Фаза, Тела и души, проклятия</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"описания-навыков\">Описания навыков</h4>\n<h5 id=\"боевые-навыки\">Боевые навыки</h5>\n<p>Ближний бой разделён по классам оружия, как в старых школах, где меч, древковое и борьба были отдельными дисциплинами:</p>\n<ul>\n<li><strong>Фехтование</strong> — клинки, которыми фехтуют: кинжал, одноручный и полуторный меч, сабля, рапира. Оружие поединка.</li>\n<li><strong>Ратное</strong> — оружие длинного рычага и удара массой: древковое, дробящее, топоры, большой двуручный меч. Оружие войны и строя.</li>\n<li><strong>Рукопашный бой</strong> — удары без оружия.</li>\n</ul>\n<p>Граница проходит не по весу, а по технике. Полуторным мечом фехтуют, даже держа его двумя руками. Большим двуручным мечом бьются как древковым: так прямо пишет Джордж Сильвер, и так его носили в строю — на плече, как пику.</p>\n<p><strong>Борьба и клинч — Атлетика.</strong> Вблизи решают сила и борьба, а не школа: здоровяк без выучки проигрывает дистанцию, но выигрывает клинч.</p>\n<p><strong>Оборона:</strong></p>\n<ul>\n<li><strong>парирование и блок</strong> — от боевого навыка оружия, которым защищаешься;</li>\n<li><strong>уклонение</strong> — от Атлетики.</li>\n</ul>\n<p>Отдельного навыка «Защита» нет: парирование — часть владения оружием.</p>\n<p><strong>Щит — предмет, а не навык.</strong> Он получает профиль и теги в SRM и может быть специализацией боевого навыка («Фехтование: щит»).</p>\n<p><strong>Знание об оружии.</strong> Боевой навык через Личность — это знание: школы, стили, устройство и происхождение оружия. Это же знание помогает <strong>читать противника</strong>: пул чтения берётся от боевого навыка, соответствующего <strong>оружию противника</strong>. Фехтовальщик хорошо читает фехтовальщика и плохо читает алебардиста.</p>\n<p><em>Какой навык и какая характеристика бросаются на каждое действие в бою, сведено в полной матрице SRM (<a href=\"#/4/0/глава-15.-бой\" class=\"xref\">глава 15</a>).</em></p>\n<h5 id=\"стрельба\">Стрельба</h5>\n<p>Луки, арбалеты, огнестрел, метание: зарядить, прицелиться, рассчитать выстрел, ухаживать за оружием. Характеристика зависит от оружия:</p>\n<ul>\n<li><strong>лук — Телосложение:</strong> натяжение боевого лука требует большой силы, лучников готовили с детства;</li>\n<li><strong>арбалет и огнестрел — Личность:</strong> сила не нужна, нужны выдержка, расчёт момента и спокойствие под огнём.</li>\n</ul>\n<p>Огнестрел уравнивает слабого с сильным: хилый, но хладнокровный человек стреляет из пищали не хуже атлета. Навык назван по занятию («Стрельба»), а не по качеству («Меткость»), потому что включает всё обращение с оружием, а не только точность.</p>\n<h5 id=\"плутовство-и-обман\">Плутовство и Обман</h5>\n<p>Оба навыка обманывают, но разным:</p>\n<ul>\n<li><strong>Обман — словом и лицом:</strong> ложь, притворство, маскировка, подделка.</li>\n<li><strong>Плутовство — руками:</strong> срезать кошель, подменить вещь, передёрнуть карту, вскрыть замок, обезвредить ловушку.</li>\n</ul>\n<p>Плутовство обычно идёт от Телосложения (пальцы), но понять устройство чужого замка — это Личность.</p>\n<h5 id=\"врачевание\">Врачевание</h5>\n<p>Раны, болезни, хирургия, яды, анатомия. <strong>Обычно Личность:</strong> врачевание — это знание. Телосложение — когда лечение требует тела: грубая хирургия (вправить сустав, отпилить ногу, удержать бьющегося раненого) и лечение себя по ощущениям (понять, что сломано, где жар, где немеет).</p>\n<p><strong>Знахарство</strong> — специализация Врачевания: травы, отвары, деревенские средства. Деревенский знахарь — это врачеватель со специализацией, а цирюльник-хирург — с другой.</p>\n<h5 id=\"проницательность\">Проницательность</h5>\n<p>Мотивы, ложь, страх, настроение людей.</p>\n<ul>\n<li><strong>Личность</strong> — читать издали: лицо, слова, поведение.</li>\n<li><strong>Телосложение</strong> — читать касанием и близостью: дрожь в рукопожатии, пульс, запах страха, напряжение тела. Тело чувствует тело.</li>\n</ul>\n<h5 id=\"убеждение-и-лидерство\">Убеждение и Лидерство</h5>\n<p>Оба навыка работают с людьми и с толпой. Разница — в том, <strong>что</strong> они меняют.</p>\n<p><strong>Убеждение меняет мнение.</strong> Уговорить человека, сторговаться, соблазнить, поднять толпу речью на площади. Это разовый сдвиг: толпа, убеждённая оратором, думает иначе, но сама по себе не становится стойкой. Ораторское искусство — специализация Убеждения.</p>\n<p><strong>Лидерство держит волю во времени.</strong> Строй под обстрелом, отряд на третий день голода, толпа на грани бунта. Лидерство действует и на персонажей игроков: например, когда враг давит морально, лидер воодушевляет отряд, чтобы никто не дрогнул. Телосложение работает через личный пример: первым пойти на стену.</p>\n<p><strong>Лидерство поддерживает, но не приказывает.</strong> Оно снимает Давление, помогает сопротивляться страху, удерживает от бегства. Но заставить персонажа игрока поступить против его воли оно не может: решение всегда остаётся за игроком.</p>\n<h5 id=\"обычаи\">Обычаи</h5>\n<p>Порядки и люди разных слоёв общества: двор, улица, церковь, армия, укоты. Обычно Личность.</p>\n<h5 id=\"бдительность\">Бдительность</h5>\n<p>Чуять опасность: засаду, слежку, шорох в ночи. Обычно Личность; Телосложение — когда бдительность держится на теле (ночное дежурство на ногах, сон вполглаза).</p>\n<h5 id=\"сыск\">Сыск</h5>\n<p>Поиск, дознание, улики, сопоставление: следы преступления, архивы, свидетели. Обычно Личность.</p>\n<h5 id=\"запретное\">Запретное</h5>\n<p>Знание о том, о чём смертному знать не положено: Планы Бытия и их обитатели, твари Расхождений, Арканы и их знаки, боги вне официальных церквей, культы, ритуалы и Фаза, сигилы, природа Тел и души, проклятия.</p>\n<p><strong>Запретное не даёт творить магию.</strong> Смертный с Запретным 5 узнаёт ритуал, понимает, чему он служит и чем грозит, но провести его не может. Магия — не удел смертных. Запретное — знание без силы.</p>\n<p><strong>Характеристики:</strong></p>\n<ul>\n<li><strong>Личность</strong> — вспомнить, прочесть, сопоставить, понять.</li>\n<li><strong>Телосложение</strong> — <strong>почуять</strong>. Тело реагирует раньше ума: холод по спине, тошнота, давление в груди рядом с тварью, Арканом или прорехой.</li>\n</ul>\n<p><strong>Особые правила:</strong></p>\n<ol>\n<li><strong>Мир лжёт.</strong> Успех на нужную сложность даёт ответ, <strong>в который верит мир</strong>: слухи, церковные трактаты, легенды. Правда открывается только с запасом успехов сверх сложности или на крите. Игрок никогда не знает наверняка, слух у него или истина.</li>\n<li><strong>Цена знания.</strong> Удачный бросок Запретного на сложность 3+ оставляет отметку на треке <strong>Тела Разума</strong>. Чем глубже понимаешь, тем ближе безумие.</li>\n<li><strong>Узнать — значит быть узнанным.</strong> Высокое Запретное (4–5) делает персонажа заметным для того, что смотрит из-за Планов. <em>(Рекомендация мастеру, не механика.)</em></li>\n<li><strong>Этому не учат открыто.</strong> Подъём Запретного выше 2 требует события, а не времени: встречи, запретного текста, пережитого ритуала. <em>(Правило главы о прокачке.)</em></li>\n<li><strong>Дверь в пакт.</strong> Запретное — путь смертного к колдовскому пакту: нельзя заключить договор, не зная, с кем говоришь.</li>\n</ol>\n<hr />\n<hr />\n"}]}, {"title": "Часть III. Создание персонажа (смертные)", "chapters": [{"id": "глава-8.-порядок-создания-персонажа", "title": "Глава 8. Порядок создания персонажа", "html": "<hr />\n<h4 id=\"порядок\">Порядок</h4>\n<ol>\n<li><strong>Раса и происхождение.</strong> Телосложение и Личность = Стандартно + бонусы происхождения или рода. Клеймо происхождения, если есть.</li>\n<li><strong>Статус «Обыватель».</strong> Удача = Стандартно + бонус происхождения + 1. Не выше Образцово: излишек сгорает.</li>\n<li><strong>Ремесло.</strong> 5 навыков, специализация, талант на выбор из двух, снаряжение, положение в обществе.</li>\n<li><strong>Шаблон навыков</strong> (сумма 10): Знаток (3, 2, 2, 1, 1, 1), Бывалый (2, 2, 2, 1, 1, 1, 1) или На все руки (2 и восемь 1). Главная ступень — в навык ремесла. Остальные навыки — 0.</li>\n<li><strong>Воспитание</strong> (только люди): талант и специализация.</li>\n<li><strong>Клеймо предыстории</strong> — одно, обязательно.</li>\n<li><strong>Производные:</strong> Выносливость = 7 + модификатор Телосложения; Воля = 7 + модификатор Личности; пулы на лист.</li>\n</ol>\n<h4 id=\"ограничения-на-старте\">Ограничения на старте</h4>\n<ul>\n<li>Навык не выше 3, и 3 — только у Знатока.</li>\n<li>Запретное не выше 2. <strong>Выходец из Дохлобога:</strong> Запретное 3 — это итог, очки шаблона в Запретное класть нельзя.</li>\n<li>Талант воспитания — <strong>любой</strong>, требование которого выполнено; специализация — в любом навыке с уровнем от 1. Связь с происхождением объясняет игрок, ГМ утверждает. У выходца из Дохлобога талант воспитания — из запретных.</li>\n<li><strong>Противоречащие клейма ГМ не допускает</strong> (например, «Безымянный» — свой среди простого люда — и «Дитя Дохлобога» — простой люд видит нечистого).</li>\n</ul>\n<h4 id=\"что-выписать-на-лист\">Что выписать на лист</h4>\n<ul>\n<li>Характеристики и их кости; Удача и сколько сожжений до Обречённо.</li>\n<li>Навыки, специализации, таланты, клейма.</li>\n<li>Положение в обществе.</li>\n<li>Выносливость, Воля.</li>\n<li>Готовые пулы: оружие (с учётом специализации), Атлетика (уклонение, Борьба), чтение, Воля, «стерпеть».</li>\n</ul>\n<hr />\n<h3 id=\"примеры-сборки-персонажей\">Примеры сборки персонажей</h3>\n<h4 id=\"наёмник-с-востока\">1. Наёмник с Востока</h4>\n<ul>\n<li><strong>Происхождение:</strong> человек, Восточные земли — Т Отлично (d14), Л Плохо (d8).</li>\n<li><strong>Удача:</strong> Хорошо — 5 сожжений до Обречённо.</li>\n<li><strong>Ремесло:</strong> Наёмник, Простой люд; специализация «меч»; талант «Железная воля».</li>\n<li><strong>Шаблон:</strong> Знаток — Фехтование 3; Атлетика 2, Запугивание 2; Выживание 1, Врачевание 1, Бдительность 1.</li>\n<li><strong>Воспитание:</strong> талант «Выносливый»; специализация «Атлетика: борьба».</li>\n<li><strong>Клеймо:</strong> Ветеран резни.</li>\n<li><strong>Итог:</strong> меч 4d16; Атлетика 3d14 (борьба 3d16); Запугивание 3d8. Выносливость 11, Воля 8.</li>\n</ul>\n<h4 id=\"вор-укот-из-рода-крыс\">2. Вор-укот из рода крыс</h4>\n<ul>\n<li><strong>Происхождение:</strong> укот, род крысы — Удача +3, Т и Л Стандартно (d10).</li>\n<li><strong>Удача:</strong> +3 и Обыватель +1 → Образцово, излишек сгорает; 7 сожжений.</li>\n<li><strong>Ремесло:</strong> Вор; специализация «карманы»; талант «Срезать кошель».</li>\n<li><strong>Шаблон:</strong> Бывалый — Плутовство 2, Скрытность 2, Обман 2; Бдительность 1, Обычаи 1, Фехтование 1, Атлетика 1.</li>\n<li><strong>Клейма:</strong> Искажённая душа, Беглый.</li>\n<li><strong>Положение:</strong> Отребье, клеймо опускает на ступень → <strong>Изгой</strong>.</li>\n<li><strong>Итог:</strong> Плутовство 3d10 (карманы 3d12); кинжал 2d10. Выносливость 7, Воля 7.</li>\n</ul>\n<h4 id=\"лекарь-с-запада\">3. Лекарь с Запада</h4>\n<ul>\n<li><strong>Происхождение:</strong> человек, Западные королевства — Л Отлично (d14), Т Плохо (d8).</li>\n<li><strong>Удача:</strong> Хорошо — 5 сожжений.</li>\n<li><strong>Ремесло:</strong> Лекарь, Почтенный; специализация «хирургия»; талант «Перевязка».</li>\n<li><strong>Шаблон:</strong> На все руки — Врачевание 2; Ремесло, Проницательность, Учёность, Убеждение, Фехтование, Атлетика, Бдительность, Обычаи по 1.</li>\n<li><strong>Воспитание:</strong> талант «Чую страх»; специализация «Убеждение: торг».</li>\n<li><strong>Клеймо:</strong> Должник.</li>\n<li><strong>Итог:</strong> Врачевание 3d14 (хирургия 3d16); Проницательность 2d14; меч 2d8. Выносливость 6, Воля 9.</li>\n</ul>\n<h4 id=\"могильщик-из-дохлобога\">4. Могильщик из Дохлобога</h4>\n<ul>\n<li><strong>Происхождение:</strong> человек, Дохлобог — Т и Л Стандартно (d10); Запретное 3; клеймо «Дитя Дохлобога».</li>\n<li><strong>Удача:</strong> Хорошо — 5 сожжений.</li>\n<li><strong>Ремесло:</strong> Могильщик; специализация «Тела и души»; талант «Дурной знак».</li>\n<li><strong>Шаблон:</strong> Бывалый — Атлетика 2, Бдительность 2, Ремесло 2; Врачевание, Обычаи, Ратное, Скрытность по 1 (в Запретное очки не кладутся).</li>\n<li><strong>Воспитание:</strong> запретный талант «Видевший худшее»; специализация «Ремесло: дерево».</li>\n<li><strong>Клеймо:</strong> Поклявшийся.</li>\n<li><strong>Положение:</strong> Отребье, клеймо опускает на ступень → <strong>Изгой</strong>.</li>\n<li><strong>Итог:</strong> Запретное 4d10 (Тела и души 4d12). Выносливость 7, Воля 7.</li>\n</ul>\n<hr />\n<hr />\n"}, {"id": "глава-9.-расы-и-происхождения", "title": "Глава 9. Расы и происхождения", "html": "<p>Рас в мире Континента три: <strong>люди</strong>, <strong>укоты</strong> и <strong>зора'</strong>, причём укоты — скорее подвид людей, хотя их потомки в долгосрочной перспективе способны стать самостоятельным реплицирующимся видом.</p>\n<p>Базовая ступень характеристик — «Стандартно». Происхождение сдвигает её: сумма бонусов у людей около +1, у укотов +3. Разрыв закрывается так: <strong>укоты платят душой и положением</strong> (клеймо «Искажённая душа», чужак среди людей), а <strong>сила людей — воспитание и вера</strong>: человек получает на старте и талант, и специализацию от того, где вырос и в какого бога верит.</p>\n<h3 id=\"люди\">Люди</h3>\n<p>Самая распространённая и изначальная раса Континента. Созданные самим Создателем из частей Духовного Плана, Изначальной Бездны и собственной частички, люди способны достичь божественности, влиять на все Планы Бытия и даже встать вровень с ними. Однако всему этому мешает срок их жизни.</p>\n<p>При создании персонажа-человека игрок выбирает, в каком месте на Континенте он родился, где вырос и в какого Бога или богов верит. Всё это формирует его способности и возможности.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Происхождение</th>\n<th>Бонусы</th>\n<th>Описание</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Земли Сатура</strong></td>\n<td>Телосложение +1</td>\n<td>Рождённый в диких северных землях</td>\n</tr>\n<tr>\n<td><strong>Провинции Триархии</strong></td>\n<td>Личность +1</td>\n<td>Жизнь, присущая большинству: захваченные более века земли, самые разные культуры</td>\n</tr>\n<tr>\n<td><strong>Западные королевства</strong></td>\n<td>Личность +2, Телосложение −1</td>\n<td>Земли, вечно раздираемые междоусобицами и враждой</td>\n</tr>\n<tr>\n<td><strong>Восточные земли</strong></td>\n<td>Телосложение +2, Личность −1</td>\n<td>Земли, издревле сопротивлявшиеся любому контролю</td>\n</tr>\n<tr>\n<td><strong>Пустыни Ютона</strong></td>\n<td>Удача +1</td>\n<td>Редкие поселения среди руин, где личи проверяют могущество</td>\n</tr>\n<tr>\n<td><strong>Дохлобог</strong></td>\n<td>см. ниже</td>\n<td>Живые люди среди немёртвых</td>\n</tr>\n<tr>\n<td><strong>Столица, вариант А</strong></td>\n<td>Одна характеристика (Т или Л) — Образцово (+3), вторая не выше Хорошо (+1), Удача не выше Плохо (−1)</td>\n<td>Светлейшее место Континента</td>\n</tr>\n<tr>\n<td><strong>Столица, вариант Б</strong></td>\n<td>Удача — Отлично (+2), вторая не выше Стандартно (0), третья не выше Ужасно (−2)</td>\n<td>То же, иначе</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Воспитание</strong> (только люди): на старте человек берёт талант (любой с выполненным требованием) и специализацию (в любом навыке от 1). Связь с происхождением объясняет игрок, мастер утверждает.</p>\n<h3 id=\"укоты\">Укоты</h3>\n<p>Укоты — звероподобные гуманоиды, произошедшие от людей. Первые укоты повиновались тяге к природному началу и слились со шкурами животных в особых местах, где магия во время Первого Расхождения проявляла себя особенно сильно; там же произошли трансформации их душ. Укоты добровольно приняли искажение души и прирастили к ней часть души животного, с которым чувствовали особую связь. Их потомки сохраняют изначальное искажение совершенной человеческой души, а современные укоты создают новые рода и ветви.</p>\n<p>Каждый укот — или рождённое от союза укота и человека дитя, или человек, принявший решение о становлении в осознанном возрасте. Чтобы стать укотом, человек проходит ритуал: ритуальное убийство животного, чья шкура выбрана для слияния, обработка шкуры племенной резчицей и слияние со шкурой в месте силы.</p>\n<p>Большинство укотов остаётся на далёкой родине, живя маленькими сплочёнными кланами: охотятся, ремесленничают и держатся круга себе подобных.</p>\n<p><strong>Клеймо «Искажённая душа»</strong> есть у каждого укота: отметка на треке Тела Духа с рождения; среди людей укот — чужак, положение на ступень ниже.</p>\n<p><strong>Рождённый укотом (РУ).</strong> Один из родителей (или оба) уже был укотом, когда тебя зачали. Бонус определяется родом — тем, какое животное выбрал для обряда твой родитель. Такой укот всё ещё может пройти обряд слияния сам, но это необязательно; животные черты проявляются так, как захочет игрок, за исключением слишком сильных проявлений.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Род (подраса)</th>\n<th>Бонусы для РУ</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Укот-кот</td>\n<td>Телосложение +1, Личность +1, Удача +1</td>\n</tr>\n<tr>\n<td>Укот-пёс</td>\n<td>Телосложение +2, Личность +2, Удача −1</td>\n</tr>\n<tr>\n<td>Укот-волк</td>\n<td>Телосложение +2, Личность +1</td>\n</tr>\n<tr>\n<td>Укот-лиса</td>\n<td>Личность +3</td>\n</tr>\n<tr>\n<td>Укот-рысь</td>\n<td>Телосложение +2, Удача +1</td>\n</tr>\n<tr>\n<td>Укот-кролик</td>\n<td>Телосложение +3, Удача +3, Личность −3</td>\n</tr>\n<tr>\n<td>Укот-медведь</td>\n<td>Телосложение +3</td>\n</tr>\n<tr>\n<td>Укот-олень</td>\n<td>Телосложение +2, Личность +1</td>\n</tr>\n<tr>\n<td>Укот-лось</td>\n<td>Телосложение +2, Личность −1, Удача +2</td>\n</tr>\n<tr>\n<td>Укот-ворона</td>\n<td>Личность +3</td>\n</tr>\n<tr>\n<td>Укот-крыса</td>\n<td>Удача +3</td>\n</tr>\n<tr>\n<td>Укот-сова</td>\n<td>Личность +2, Телосложение +1</td>\n</tr>\n</tbody>\n</table></div>\n<p>Если здесь нет животного, которое вы хотели бы выбрать, за определением бонуса обратитесь к мастеру.</p>\n<p><strong>Чистая душа (ЧД).</strong> Ты сам принял решение слиться со шкурой, не будучи укотом изначально. Выбери один из вариантов бонусов:</p>\n<ul>\n<li>+1 к каждой;</li>\n<li>+2 к одной и +1 к другой;</li>\n<li>+2 к двум и −1 к одной;</li>\n<li>+3 к одной;</li>\n<li>+3 к двум и −3 к одной;</li>\n<li>+3 к одной, +2 к другой и −2 к третьей.</li>\n</ul>\n<p><strong>Потолок Удачи.</strong> Не выше Образцово — излишек сгорает. Вор-укот из рода крыс на старте имеет Образцово Удачу (7 сожжений до Обречённо), но расплачивается двумя клеймами и положением Изгоя. Окончательный баланс — плейтест.</p>\n<h3 id=\"выходцы-из-дохлобога-живые\">Выходцы из Дохлобога (живые)</h3>\n<p>Твои предки обосновались в Дохлобоге ещё до того, как единственный некромант открыл секрет искусственной души, а после не захотели покидать земли немёртвых.</p>\n<ul>\n<li>Характеристики без изменений (Стандартно).</li>\n<li><strong>Запретное 3 со старта</strong> — рождение в Дохлобоге и есть то событие, которое нужно Запретному выше 2. Это итоговое значение: очки шаблона навыков в Запретное класть нельзя.</li>\n<li>Клеймо <strong>«Дитя Дохлобога»</strong>: немёртвые не поднимают тебе Давление, обычаи мёртвых знаешь как свои, мёртвые узнают своего — но среди живых дурная слава: Церкви и простой люд видят нечистого, положение на ступень ниже.</li>\n<li>Талант воспитания — из запретного списка (глава 13).</li>\n</ul>\n<h3 id=\"зора\">Зора'</h3>\n<p>Время ещё не пришло…</p>\n<hr />\n"}, {"id": "глава-10.-ремёсла-и-положение-в-обществе", "title": "Глава 10. Ремёсла и положение в обществе", "html": "<hr />\n<h4 id=\"ремесло\">Ремесло</h4>\n<p>Ремесло — кем был персонаж до начала истории. Это не класс: оно ничего не запрещает и не ведёт рост дальше старта. Оно даёт стартовый пакет и место в мире.</p>\n<p><strong>Ремесло есть только у смертных.</strong></p>\n<p>Ремесло даёт:</p>\n<ul>\n<li><strong>5 навыков.</strong> Главная ступень шаблона (3 у Знатока, хотя бы одна 2 у Бывалого и «На все руки») кладётся в один из них.</li>\n<li><strong>Специализацию.</strong></li>\n<li><strong>Талант на выбор из двух.</strong> Требование таланта должно выполняться навыками, которые ты уже распределил.</li>\n<li><strong>Снаряжение</strong> (списком; цены — в <a href=\"#/5/0/глава-18.-снаряжение-и-алхимия\" class=\"xref\">главе 18</a>).</li>\n<li><strong>Положение в обществе.</strong></li>\n</ul>\n<h4 id=\"положение-в-обществе\">Положение в обществе</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ступень</th>\n<th>Кто</th>\n<th>Как к тебе относятся</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Изгой</strong></td>\n<td>только через клейма</td>\n<td>Вне закона и общества: тебя можно убить без суда</td>\n</tr>\n<tr>\n<td><strong>Отребье</strong></td>\n<td>вор, могильщик, крысолов</td>\n<td>Гонят, подозревают первым, в суде слово против тебя</td>\n</tr>\n<tr>\n<td><strong>Простой люд</strong></td>\n<td>наёмник, солдат, охотник, моряк, стражник</td>\n<td>Не замечают</td>\n</tr>\n<tr>\n<td><strong>Почтенный</strong></td>\n<td>лекарь, писарь, торговец, мастер, священник</td>\n<td>Слушают, пускают в дом</td>\n</tr>\n<tr>\n<td><strong>Элитарии</strong></td>\n<td>мелкий элитарий</td>\n<td>Слушаются, судят иначе</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Клейма сдвигают положение.</strong> Укот («Искажённая душа») и выходец из Дохлобога («Дитя Дохлобога») среди людей стоят на ступень ниже своего ремесла. Отребье с таким клеймом — Изгой.</p>\n<p><strong>Опциональное правило: положение в разговоре.</strong> Каждая ступень, на которую собеседник выше тебя, даёт +1 к сложности Убеждения. Вниз по лестнице разговаривать легко.</p>\n<h4 id=\"ремёсла-смертных\">Ремёсла смертных</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Ремесло</th>\n<th>Навыки</th>\n<th>Специализация</th>\n<th>Талант (один из двух)</th>\n<th>Положение</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Наёмник</strong></td>\n<td>Фехтование или Ратное, Атлетика, Запугивание, Выживание, Врачевание</td>\n<td>оружие на выбор</td>\n<td>Выносливый / Железная воля</td>\n<td>Простой люд</td>\n</tr>\n<tr>\n<td><strong>Солдат</strong></td>\n<td>Ратное, Атлетика, Лидерство, Обычаи, Выживание</td>\n<td>копьё или алебарда</td>\n<td>Держать дистанцию / Знамя</td>\n<td>Простой люд</td>\n</tr>\n<tr>\n<td><strong>Охотник</strong></td>\n<td>Стрельба, Выживание, Скрытность, Бдительность, Атлетика</td>\n<td>луки или следопытство</td>\n<td>Следопыт / Чуять зверя</td>\n<td>Простой люд</td>\n</tr>\n<tr>\n<td><strong>Моряк</strong></td>\n<td>Атлетика, Ремесло, Выживание, Обычаи, Фехтование</td>\n<td>лазание или узлы и снасти</td>\n<td>Пловец / Цепкий</td>\n<td>Простой люд</td>\n</tr>\n<tr>\n<td><strong>Стражник</strong></td>\n<td>Сыск, Запугивание, Бдительность, Ратное, Обычаи</td>\n<td>допрос или улица</td>\n<td>Допросчик / Свидетели</td>\n<td>Простой люд</td>\n</tr>\n<tr>\n<td><strong>Вор</strong></td>\n<td>Плутовство, Скрытность, Обман, Бдительность, Обычаи</td>\n<td>карманы или замки</td>\n<td>Срезать кошель / Ловкие пальцы</td>\n<td>Отребье</td>\n</tr>\n<tr>\n<td><strong>Крысолов</strong></td>\n<td>Выживание, Плутовство, Скрытность, Врачевание, Бдительность</td>\n<td>ловушки или яды</td>\n<td>Глаз на ловушки / Чуять зверя</td>\n<td>Отребье</td>\n</tr>\n<tr>\n<td><strong>Могильщик</strong></td>\n<td>Атлетика, Запретное, Бдительность, Ремесло, Врачевание</td>\n<td>Тела и души или анатомия</td>\n<td>Дурной знак / Сон вполглаза</td>\n<td>Отребье</td>\n</tr>\n<tr>\n<td><strong>Лекарь</strong></td>\n<td>Врачевание, Ремесло, Проницательность, Учёность, Убеждение</td>\n<td>хирургия или знахарство</td>\n<td>Перевязка / Обезболить</td>\n<td>Почтенный</td>\n</tr>\n<tr>\n<td><strong>Писарь</strong></td>\n<td>Учёность, Сыск, Обман, Обычаи, Убеждение</td>\n<td>право или подделка</td>\n<td>Архивная крыса / Полиглот</td>\n<td>Почтенный</td>\n</tr>\n<tr>\n<td><strong>Торговец</strong></td>\n<td>Убеждение, Проницательность, Обычаи, Учёность, Ремесло</td>\n<td>торг</td>\n<td>Торгаш / Знакомцы</td>\n<td>Почтенный</td>\n</tr>\n<tr>\n<td><strong>Мастер</strong> (кузнец, плотник, кожевник)</td>\n<td>Ремесло, Атлетика, Ратное, Убеждение, Обычаи</td>\n<td>своё ремесло</td>\n<td>Глаз мастера / Полевой ремонт</td>\n<td>Почтенный</td>\n</tr>\n<tr>\n<td><strong>Священник</strong></td>\n<td>Учёность, Убеждение, Врачевание, Обычаи, Проницательность</td>\n<td>богословие или проповедь</td>\n<td>Книжное знание / Обаяние</td>\n<td>Почтенный</td>\n</tr>\n<tr>\n<td><strong>Мелкий элитарий</strong></td>\n<td>Фехтование, Обычаи, Убеждение, Лидерство, Учёность</td>\n<td>меч или двор</td>\n<td>Этикет / Знамя</td>\n<td>Элитарии</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Снаряжение по смыслу</strong> (точные списки — в блоке «Снаряжение»): наёмник — оружие, стёганка или кольчуга, щит; вор — отмычки, нож, тёмный плащ; лекарь — инструменты, бинты, отвары; и так далее.</p>\n<hr />\n<hr />\n"}, {"id": "глава-11.-клейма", "title": "Глава 11. Клейма", "html": "<hr />\n<h4 id=\"что-такое-клеймо\">Что такое клеймо</h4>\n<p>Клеймо — особенность персонажа, которая <strong>всегда и даёт, и отнимает</strong>. Его не выбирают ради выгоды: оно делает персонажа тем, кто он есть, со всеми последствиями.</p>\n<h4 id=\"откуда-берутся\">Откуда берутся</h4>\n<ul>\n<li><strong>Происхождение:</strong> у некоторых происхождений есть своё клеймо.</li>\n<li><strong>Предыстория:</strong> на старте каждый персонаж берёт <strong>одно клеймо предыстории</strong> (обязательно).</li>\n<li><strong>Игра:</strong> Шутки Шута, сильные мутагены, великие события.</li>\n<li><strong>Своими руками:</strong> игрок придумывает клеймо вместе с ГМом.</li>\n</ul>\n<p>Клейма можно получать и терять по ходу игры.</p>\n<h4 id=\"формат\">Формат</h4>\n<ul>\n<li><strong>Даёт</strong> — одно узкое правило.</li>\n<li><strong>Отнимает</strong> — одно постоянное неудобство.</li>\n<li><strong>Откуда</strong> — предыстория, происхождение, событие.</li>\n<li><strong>Уходит ли</strong> — и как, если может.</li>\n</ul>\n<h4 id=\"клеймо-своими-руками\">Клеймо своими руками</h4>\n<ul>\n<li><strong>Даёт</strong> — одно узкое правило: без броска, +1 кость или замена навыка в одной ситуации. По силе примерно талант 1–2 ступени.</li>\n<li><strong>Отнимает</strong> — одно постоянное неудобство той же силы, которое реально будет мешать. Не «иногда», а «всегда, когда это важно».</li>\n<li><strong>ГМ утверждает.</strong> Если «отнимает» никогда не сработает в этой кампании, клеймо не годится.</li>\n</ul>\n<h4 id=\"клейма-происхождения\">Клейма происхождения</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Клеймо</th>\n<th>Даёт</th>\n<th>Отнимает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Дитя Дохлобога</strong></td>\n<td>Немёртвые не поднимают тебе Давление; обычаи мёртвых знаешь как свои; мёртвые узнают своего</td>\n<td>Среди живых — дурная слава: Церкви и простой люд видят нечистого; положение на ступень ниже</td>\n</tr>\n<tr>\n<td><strong>Искажённая душа</strong> (укоты)</td>\n<td>— (сила уже в характеристиках рода)</td>\n<td>Отметка на треке Тела Духа с рождения; среди людей ты чужак, положение на ступень ниже</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"клейма-предысторий\">Клейма предысторий</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Клеймо</th>\n<th>Даёт</th>\n<th>Отнимает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Безымянный</strong></td>\n<td>Без броска: среди простого люда ты свой, тебе верят на слово</td>\n<td>Наверху тебя не помнят: Почтенные и Элитарии забывают тебя после встречи</td>\n</tr>\n<tr>\n<td><strong>Скиталец</strong></td>\n<td>Без броска: в любом краю Континента знаешь дорогу и бытовой язык</td>\n<td>Нигде не свой: среди оседлых положение на ступень ниже, своего угла нет</td>\n</tr>\n<tr>\n<td><strong>Тронутый Арканом</strong></td>\n<td>Раз за арку ГМ даёт видение или знак от Аркана: правдивый, но туманный</td>\n<td>«Узнать — значит быть узнанным» действует на тебя всегда: Аркан смотрит</td>\n</tr>\n<tr>\n<td><strong>Любимец Бога</strong> (один бог пантеона)</td>\n<td>Раз за арку «Заявить деталь» в сфере своего бога без траты Удачи</td>\n<td>Обеты бога: нарушил — бог отворачивается. Чужие церкви тебе враждебны</td>\n</tr>\n<tr>\n<td><strong>Долг рода</strong></td>\n<td>Имя открывает двери Элитариев</td>\n<td>Род в долгах и с врагами. Раз за арку ГМ предъявляет счёт рода: долг, кровную месть, обязательство перед сюзереном</td>\n</tr>\n<tr>\n<td><strong>Ветеран резни</strong></td>\n<td>Павший на глазах союзник не даёт тебе Давления</td>\n<td>Кошмары: короткий отдых возвращает только половину Выносливости</td>\n</tr>\n<tr>\n<td><strong>Беглый</strong> (от господина, из тюрьмы, из армии)</td>\n<td>Без броска: в любом городе знаешь, как уйти незамеченным</td>\n<td>Ты в розыске в землях Триархии; раз за арку ГМ присылает по твоему следу охотника</td>\n</tr>\n<tr>\n<td><strong>Должник</strong></td>\n<td>На старте снаряжение лучше, чем даёт ремесло: хорошее оружие или кольчуга</td>\n<td>Раз за арку кредитор требует плату — деньгами или услугой, которую ты не выберешь</td>\n</tr>\n<tr>\n<td><strong>Меченый</strong> (шрам, ожог, уродство)</td>\n<td>+1 кость к Запугиванию</td>\n<td>Тебя узнают везде: «Лицо из толпы» и маскировка на тебе не работают</td>\n</tr>\n<tr>\n<td><strong>Поклявшийся</strong> (месть или служение)</td>\n<td>Против цели клятвы и её людей проверка Воли не даёт Бегства: худшее — Дрогнул</td>\n<td>Если представится шанс исполнить клятву, ГМ может поставить тебя перед выбором: клятва или товарищи</td>\n</tr>\n<tr>\n<td><strong>Бывший культист</strong></td>\n<td>«Тайнопись» без требования Запретного</td>\n<td>Культ помнит тебя: бывшие братья ищут отступника</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"клейма-для-сценариев\">Клейма для сценариев</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Клеймо</th>\n<th>Даёт</th>\n<th>Отнимает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Тронутый Фазой</strong></td>\n<td>«Чуять Фазу» без требования Запретного</td>\n<td>Отметка на треке Тела Разума; Фазовые Странники выбирают тебя первым</td>\n</tr>\n</tbody>\n</table></div>\n<p>Только для кампаний, где Фаза важна: в обычном мире она почти не проявляется.</p>\n<h4 id=\"клейма-получаемые-в-игре\">Клейма, получаемые в игре</h4>\n<ul>\n<li><strong>Слава мясника</strong> (из таланта Запугивания): враги, слышавшие о тебе, начинают бой с +2 Давления; твоё имя знают, и от этого не отмыться.</li>\n<li>Всё, что даст Шутка Шута.</li>\n</ul>\n<hr />\n<hr />\n"}, {"id": "глава-12.-таланты", "title": "Глава 12. Таланты", "html": "<h4 id=\"что-такое-талант\">Что такое талант</h4>\n<p>Талант — приём, который персонаж выучил или выработал. Он меняет <strong>одно правило в одной ситуации</strong>. Широкий бонус («+1 кость ко всему Фехтованию») — это навык или специализация, а не талант.</p>\n<p>Таланты — главный путь роста смертного: выучка и закалка в пределах человеческого.</p>\n<h4 id=\"карточка-таланта\">Карточка таланта</h4>\n<ul>\n<li><strong>Название.</strong></li>\n<li><strong>Требует:</strong> обычно уровень навыка; иногда другой талант, клеймо, ремесло, снаряжение.</li>\n<li><strong>Как работает:</strong> одно правило.</li>\n<li><strong>Цена:</strong> если есть — Выносливость, отметка, время, риск.</li>\n<li><strong>Как выглядит:</strong> одна строка картинки.</li>\n</ul>\n<h4 id=\"виды-талантов\">Виды талантов</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Вид</th>\n<th>Как работает</th>\n<th>Пример</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Без броска</td>\n<td>ГМ сообщает правду, или действие удаётся само в узком случае</td>\n<td>Двужильный, Дурной знак</td>\n</tr>\n<tr>\n<td>Замена</td>\n<td>Бросаешь навык А вместо навыка Б в узком случае</td>\n<td>Отдёрг, Книжное знание</td>\n</tr>\n<tr>\n<td>Кость</td>\n<td>+1 кость в узком случае</td>\n<td>Сильный Ответ</td>\n</tr>\n<tr>\n<td>Правило</td>\n<td>Меняет одно правило в одном месте</td>\n<td>Удвоение, Мастерский удар</td>\n</tr>\n<tr>\n<td>Ресурс</td>\n<td>Даёт и тратит своё</td>\n<td>Читающий (жетоны)</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"общие-правила\">Общие правила</h4>\n<ul>\n<li><strong>+1 кость от таланта — не больше одной на бросок</strong>, сколько бы талантов ни сработало.</li>\n<li><strong>Требование — уровень навыка:</strong> таланты идут лестницей по ступеням навыка.</li>\n<li><strong>Улучшения:</strong> у части талантов есть улучшения; каждое — отдельный талант, который требует предыдущего.</li>\n<li><strong>Таланты-противовесы:</strong> если у обеих сторон встречного броска есть таланты «ничья — твоя», они гасятся, и ничья решается как обычно.</li>\n</ul>\n<h4 id=\"как-читать-карточки\">Как читать карточки</h4>\n<ul>\n<li><strong>Боевой навык</strong> — навык оружия у тебя в руке: Фехтование, Ратное или Рукопашный бой (написан на карточке оружия).</li>\n<li><strong>Уровни навыка:</strong> 1 новичок, 2 подмастерье, 3 профессионал, 4 мастер, 5 легенда.</li>\n<li><strong>S</strong> — сумма слоёв такта. Ярус: +2 и выше Пробой, +1 Попадание, 0 Сцепка, −1 Отбито, −2 и ниже Брешь.</li>\n</ul>\n<hr />\n<h3 id=\"боевые-таланты\">Боевые таланты</h3>\n<h4 id=\"чтение-противника\">Чтение противника</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Требует</th>\n<th>Как работает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Читающий</strong></td>\n<td>Боевой навык 2 (подмастерье)</td>\n<td>Ты получаешь <strong>жетоны Прочтения</strong>. Жетон приходит, когда противник два такта подряд выбрал ту же линию и ту же кинетику. Жетоны копятся тайно и сгорают после боя. <strong>Трата</strong> (одна за такт): после тайного выбора и до вскрытия назови ось — кинетику, линию или тип. Противник показывает своё значение на ней, и ты можешь поменять свой выбор на этой оси (Перестройка)</td>\n</tr>\n<tr>\n<td><strong>Читать связку</strong></td>\n<td>«Читающий», боевой навык 3 (профессионал)</td>\n<td>Ещё один жетон каждый раз, когда такт кончился Сцепкой</td>\n</tr>\n<tr>\n<td><strong>Читать выжидание</strong></td>\n<td>«Читать связку», боевой навык 4 (мастер)</td>\n<td>Ещё один жетон, когда вы оба в одном такте выбрали Заслон</td>\n</tr>\n<tr>\n<td><strong>Вторая трата</strong></td>\n<td>«Читающий», боевой навык 4 (мастер)</td>\n<td>Две траты жетонов за такт вместо одной: можно ответить на Финт противника своей Перестройкой</td>\n</tr>\n<tr>\n<td><strong>Читать намерение</strong></td>\n<td>«Читающий», боевой навык 5 (легенда)</td>\n<td>Тратой жетона можно узнать Интент противника: бьёт он, защищается или двигается</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"финты\">Финты</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Требует</th>\n<th>Как работает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Смена</strong></td>\n<td>Боевой навык 1 (новичок)</td>\n<td>Противник потратил жетон и поменял выбор под тебя. Ты меняешь своё значение на той же оси, без броска. <strong>Цена:</strong> твоё действие в этом такте получает −1 к S. Его чтение сорвано, но и ты ничего не выиграл</td>\n</tr>\n<tr>\n<td><strong>Ложь</strong></td>\n<td>«Читающий», боевой навык 2 (подмастерье)</td>\n<td>Противник объявил трату жетона на ось. Ты тратишь свой жетон и называешь ложное значение этой оси, противник меняет выбор под него. Затем оба бросают: ты — боевой навык + Личность, он — пул чтения. <strong>У тебя строго больше успехов:</strong> вскрывается настоящее значение, его замена остаётся. <strong>Иначе:</strong> он видит правду и может поменять выбор ещё раз</td>\n</tr>\n<tr>\n<td><strong>Язык лжеца</strong></td>\n<td>«Ложь», Обман 2 (подмастерье)</td>\n<td>Бросок Лжи — Обман + Личность вместо боевого навыка</td>\n</tr>\n<tr>\n<td><strong>Ложное намерение</strong></td>\n<td>«Ложь», боевой навык 3 (профессионал)</td>\n<td>Если противник читает твой Интент, ты можешь ответить Ложью и показать ему другой Интент.</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"школа-клинка\">Школа клинка</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Требует</th>\n<th>Как работает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Бьёт в корпус</strong></td>\n<td>Боевой навык 2 (подмастерье)</td>\n<td>Обычно удар в Центр против защиты в Центре даёт −1 в слое линии. Для тебя это 0</td>\n</tr>\n<tr>\n<td><strong>Удвоение</strong></td>\n<td>Боевой навык 2 (подмастерье)</td>\n<td>Твой удар закончился <strong>Отбито</strong> — ты сразу бьёшь второй раз в том же такте. Противник открыт: вы оба тайно выбираете только кинетику. Выиграл кинетику — Пробой, равная — Попадание, проиграл — удар не дошёл. <strong>Цена:</strong> 1 Выносливость</td>\n</tr>\n<tr>\n<td><strong>Мастерский удар</strong></td>\n<td>Фехтование 3 (профессионал)</td>\n<td>В Обмене противник бьёт в соседнюю с твоей линию (Верх и Центр или Центр и Низ). Твой клинок по пути отводит его удар: доходит только твой</td>\n</tr>\n<tr>\n<td><strong>Точный укол</strong></td>\n<td>Боевой навык 3 (профессионал)</td>\n<td>Твой колющий Пробой на своей дистанции идёт в щель лат (броня в щели −1), даже если у оружия нет тега «Точный укол»</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"защита\">Защита</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Требует</th>\n<th>Как работает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Защитный стиль</strong></td>\n<td>Боевой навык 2 (подмастерье)</td>\n<td>Выдержка (+1 к следующему Удару) приходит уже после одного Заслона, а не после двух подряд. С Ответом по-прежнему не складывается</td>\n</tr>\n<tr>\n<td><strong>Сильный Ответ</strong></td>\n<td>Боевой навык 2 (подмастерье)</td>\n<td>Пока действует Ответ (+1 к следующему Удару после Отбито или Бреши), ты бросаешь на одну кость больше в броске такта этого удара. <em>Домашнее правило:</em> вместо этого Ответ и Выдержка складываются (до +2 к S), требование — боевой навык 3</td>\n</tr>\n<tr>\n<td><strong>Встречный кинжалом</strong></td>\n<td>Фехтование 2 (подмастерье)</td>\n<td>Кинжал защищает Встречным и на Средней дистанции, а не только на Ближней</td>\n</tr>\n<tr>\n<td><strong>Голые руки</strong></td>\n<td>Рукопашный бой 2 (подмастерье)</td>\n<td>Без оружия тебе доступна защита Парированием: перехватываешь запястье или древко</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"дистанция-и-толпа\">Дистанция и толпа</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Требует</th>\n<th>Как работает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Под остриё</strong></td>\n<td>Боевой навык 2 (подмастерье); кинжал, кулак или короткий клинок</td>\n<td>Входишь под остриё более длинного оружия уже при Отбито (на одну ступень ближе), а не только при Бреши (на две, как обычно)</td>\n</tr>\n<tr>\n<td><strong>Держать дистанцию</strong></td>\n<td>Ратное 2 (подмастерье); копьё или алебарда</td>\n<td>Противник входит под твоё остриё и получает Отбито или Сцепку — он отброшен на одну ступень дистанции дальше</td>\n</tr>\n<tr>\n<td><strong>Бой с толпой</strong></td>\n<td>Боевой навык 3 (профессионал)</td>\n<td>В такт «Выстроить» ты ещё и бьёшь переднего противника, с −1 к S.</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"борьба\">Борьба</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Требует</th>\n<th>Как работает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Отдёрг</strong></td>\n<td>Боевой навык 2 (подмастерье)</td>\n<td>После Сцепки вместо Борьбы (Атлетика + Телосложение) ты бросаешь боевой навык + Телосложение. Больше успехов у тебя — сразу бьёшь в другую линию «по открытому» (S = +1 + кинетика)</td>\n</tr>\n<tr>\n<td><strong>Борец</strong></td>\n<td>Атлетика 3 (профессионал)</td>\n<td>В Борьбе любая победа — навал (противник Удержан), а не только при перевесе 2+</td>\n</tr>\n<tr>\n<td><strong>Выскользнуть</strong></td>\n<td>Атлетика 2 (подмастерье)</td>\n<td>Когда ты Удержан и вырываешься Борьбой, ничья засчитывается тебе</td>\n</tr>\n<tr>\n<td><strong>Полумеч в клинче</strong></td>\n<td>Фехтование 2 (подмастерье)</td>\n<td>В Клинче меч, взятый за середину клинка, бьёт без штрафа тесноты</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"закалка\">Закалка</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Требует</th>\n<th>Как работает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Двужильный</strong></td>\n<td>Атлетика 2 (подмастерье)</td>\n<td>Без броска: новая Тяжёлая рана не требует «стерпеть». По Калечащей бросаешь как обычно</td>\n</tr>\n<tr>\n<td><strong>Выносливый</strong></td>\n<td>Атлетика 1 (новичок)</td>\n<td>Без броска: запас Выносливости +2</td>\n</tr>\n<tr>\n<td><strong>Железная воля</strong></td>\n<td>Любой боевой навык 2 (подмастерье)</td>\n<td>Без броска: Воля (порог, к которому растёт Давление) +2</td>\n</tr>\n</tbody>\n</table></div>\n<h4 id=\"снаряжение\">Снаряжение</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Требует</th>\n<th>Как работает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Быстрая смена</strong></td>\n<td>Боевой навык 2 (подмастерье)</td>\n<td>Выхватить или поднять оружие и ударить им в том же такте, с −1 к S. Обычно смена оружия — такт без удара</td>\n</tr>\n<tr>\n<td><strong>Баклер бережёт руку</strong></td>\n<td>Боевой навык 2 (подмастерье), баклер в руке</td>\n<td>Без броска: теги ран рук (Слабая рука, Перелом руки, Выронил оружие) по тебе не действуют. Сама рана остаётся</td>\n</tr>\n<tr>\n<td><strong>Баклер прячет клинок</strong></td>\n<td>Боевой навык 2 (подмастерье), баклер в руке</td>\n<td>Без броска: против тебя нельзя делать Ставку</td>\n</tr>\n</tbody>\n</table></div>\n<hr />\n<h3 id=\"тело-и-руки\">Тело и руки</h3>\n<h4 id=\"атлетика\">Атлетика</h4>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Талант</th>\n<th>Требует</th>\n<th>Как работает</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Цепкий</strong></td>\n<td>Атлетика 1 (новичок)</td>\n<td>Без броска: простое и обычное лазание (сложность 1–2) удаётся само, если тебя не торопят и не обстреливают</td>\n</tr>\n<tr>\n<td><strong>Пловец</strong></td>\n<td>Атлетика 1 (новичок)</td>\n<td>Без броска: плавание сложности 1–2 удаётся само. В стёганке и кольчуге ты держишься на воде, а не идёшь ко дну</td>\n</tr>\n<tr>\n<td><strong>Носильщик</strong></td>\n<td>Атлетика 2 (подмастерье)</td>\n<td>Без броска: с раненым на плечах или тяжёлой ношей идёшь и бежишь как налегке</td>\n</tr>\n<tr>\n<td><strong>Второе дыхание</strong></td>\n<td>Атлетика 3 (профессионал)</td>\n<td>Раз за бой, когда Выносливость пада
